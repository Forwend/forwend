  /v1/profiles/{profileId}/payments.csv:
    get:
      operationId: exportPaymentMovements
      summary: Export at most 10000 financial movements and observations
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/ProfileId"
        - name: storeId
          in: query
          schema: { type: string, format: uuid }
        - name: linkId
          in: query
          schema: { type: string, format: uuid }
        - name: source
          in: query
          schema: {"type": "string", "enum": ["invoice", "checkout", "request", "payment_link"]}
        - name: status
          in: query
          schema: {"type": "string", "enum": ["open", "confirming", "paid", "settled", "expired", "canceled"]}
        - name: paymentStatus
          in: query
          schema: {"type": "string", "enum": ["open", "detected", "partially_paid", "paid", "expired", "expired_partially_paid", "canceled"]}
        - name: settlementStatus
          in: query
          schema: {"type": "string", "enum": ["none", "pending", "settled"]}
        - name: refundStatus
          in: query
          schema: {"type": "string", "enum": ["none", "held", "refund_pending", "refunded"]}
        - $ref: "#/components/parameters/PaymentState"
        - $ref: "#/components/parameters/PaymentWallet"
        - $ref: "#/components/parameters/PaymentReference"
        - name: from
          in: query
          description: Inclusive UTC recorded day.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive UTC recorded day.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Authorized repeatable-read snapshot; observations never count as booked deltas.
          headers:
            X-Forwend-Snapshot-At:
              schema: { type: string, format: date-time }
            X-Forwend-Movement-Count:
              schema: { type: integer, maximum: 10000 }
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "404":
          description: Payment is outside the caller's profile, stores or mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/profiles/{profileId}/payments/{paymentId}/movements.csv:
    get:
      operationId: exportMovementsOfPayment
      summary: Export movements of one permitted payment
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: storeId
          in: query
          schema: { type: string, format: uuid }
        - name: linkId
          in: query
          schema: { type: string, format: uuid }
        - name: source
          in: query
          schema: {"type": "string", "enum": ["invoice", "checkout", "request", "payment_link"]}
        - name: status
          in: query
          schema: {"type": "string", "enum": ["open", "confirming", "paid", "settled", "expired", "canceled"]}
        - name: paymentStatus
          in: query
          schema: {"type": "string", "enum": ["open", "detected", "partially_paid", "paid", "expired", "expired_partially_paid", "canceled"]}
        - name: settlementStatus
          in: query
          schema: {"type": "string", "enum": ["none", "pending", "settled"]}
        - name: refundStatus
          in: query
          schema: {"type": "string", "enum": ["none", "held", "refund_pending", "refunded"]}
        - $ref: "#/components/parameters/PaymentState"
        - $ref: "#/components/parameters/PaymentWallet"
        - $ref: "#/components/parameters/PaymentReference"
        - name: paymentId
          in: path

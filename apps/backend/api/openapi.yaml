          schema: { $ref: "#/components/schemas/InvoiceId" }
        - name: from
          in: query
          description: Inclusive UTC recorded day.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive UTC recorded day.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Authorized repeatable-read snapshot; observations never count as booked deltas.
          headers:
            X-Forwend-Snapshot-At:
              schema: { type: string, format: date-time }
            X-Forwend-Movement-Count:
              schema: { type: integer, maximum: 10000 }
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "404":
          description: Payment is outside the caller's profile, stores or mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/me:
    post:
      operationId: signUp
      summary: Sign up once; makes the user, the personal profile and its wallet
      description: |
        Call after every sign-in. The first call makes the user and the personal profile with its Privy wallet (201).
        Later calls change nothing (200), except that they retry a wallet Privy failed to make. No Idempotency-Key:
        the user's token is the key.
      responses:
        "201":
          description: Signed up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "200":
          description: Signed up before; nothing changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      operationId: getMe
      summary: The signed-in user's profiles, oldest first
      responses:
        "200":
          description: The profiles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotSignedUp" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/me/sign-out-everywhere:
    post:
      operationId: signOutEverywhere
      summary: End every session of the signed-in user, this one too (R-137)
      description: |
        Freezes and unfreezes the user at Privy, which ends every session and refresh token there. Then every
        signed-in route refuses an access token issued before now. If the freeze fails, the cutoff is not set (500).
        The unfreeze is always sent. Once the freeze worked, the cutoff is set even if the unfreeze failed (500).
      responses:
        "204": { description: Every session ended; the web signs out }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/me/onboarding:
    post:
      operationId: onboard
      summary: Make the first-run choice once; makes the chosen profiles and sets onboardedAt
      description: |
        R-50, D-53. Each choice needs a profile kind: receive_and_send the personal profile every user has,
        get_paid_by_clients a freelancer profile, accept_business_payments and build_integration one merchant profile
        (both together make one). The profiles and onboardedAt are written in one transaction, then each new profile
        gets its Privy wallet as at signup (walletAddress null if Privy fails; the next POST /v1/me makes it). An empty
        list is Skip: it only sets onboardedAt. The first call answers 201; every later call, with any choices, changes
        nothing and answers 200 with the same state. No Idempotency-Key: onboardedAt is the key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingRequest" }
      responses:
        "201":
          description: Onboarded now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "200":
          description: Onboarded before; nothing changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotSignedUp" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/prices:
    get:
      operationId: listPrices
      summary: Each enabled token's USD price from CoinGecko, for display only (R-178)
      description: |
        D-115. The same for every signed-in user; a secret API key answers 401. The worker reads CoinGecko every 15
        minutes, and every api reads the kept prices. A test token has its mainnet coin's price. Invoice amounts, the
        ledger, records and exports never use these prices. Show "Prices by CoinGecko" wherever they appear.
      responses:
        "200":
          description: The enabled tokens, by chain id
          content:
            application/json:
              schema:
                type: object
                required: [prices]
                properties:
                  prices:
                    type: array
                    items: { $ref: "#/components/schemas/TokenPrice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles:
    post:
      operationId: createProfile
      summary: Create a freelancer or merchant profile with its own wallet, once per Idempotency-Key
      description: |
        Keys are per user. The same key with the same values returns the stored profile with 200; with other values, 409.
        If Privy fails, the profile is still created and returned with walletAddress null; the next POST /v1/me makes
        its wallet, so a retry never makes a second profile.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProfileRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "200":
          description: The same request was made before with this key; the stored profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotSignedUp" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/events:
    get:
      operationId: listEvents
      summary: The bell's events of the profile's invoices, newest first
      description: R-81. The same paid, settled and held-money events as the owner's email (R-80).
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
      responses:
        "200":
          description: The events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InvoiceEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/webhook-events:
    get:
      operationId: listWebhookEvents
      summary: The profile's invoice events of the last 30 days, newest first (R-153)
      description: |
        Each item is the body a webhook would carry now (WebhookEvent under webhooks), with the invoice as the owner
        reads it. A store's member or key sees only its stores' events. Test events are not listed.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: type
          in: query
          description: One event type to keep.
          schema:
            type: string
            enum: [invoice.detected, invoice.partially_paid, invoice.paid, invoice.settled, invoice.expired, invoice.canceled, invoice.held, invoice.open, invoice.reopened]
        - name: cursor
          in: query
          description: The nextCursor of the page before.
          schema: { type: string }
      responses:
        "200":
          description: One page of events
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEvent" }
                  nextCursor: { type: [string, "null"], description: Null on the last page. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/owed:
    get:
      operationId: listOwed
      summary: What customers still owe the profile
      description: |
        R-95, D-114. The payments the customer can still pay (the open status filter) that are overdue or partly paid:
        numbered invoices and requests, and checkout sessions, which have no number. Overdue rows come first, most days
        late first; then partly paid. Money held for payers is the payer's, so it is never a row: it shows on balances
        (held) and on each payment. items holds the first limit rows; count and totals cover every row.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: limit
          in: query
          description: Rows in items; default 50.
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: The first rows, with the count and totals of all of them
          content:
            application/json:
              schema:
                type: object
                required: [items, count, totals]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Owed" }
                  count: { type: integer, minimum: 0, description: Every row, also those past limit. }
                  totals:
                    type: array
                    description: |
                      What is left to pay in each token over every row, in base units, ordered by chainId and token. A
                      payment whose client still chooses the token counts in its shown option's token.
                    items: { $ref: "#/components/schemas/OwedTotal" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/notifications:
    get:
      operationId: getNotifications
      summary: The profile's owner email setting
      description: |
        R-80. email says whether the owner gets an email when one of this profile's invoices is paid, settled or gets
        money held for the payer. address is the account's verified login email (read once from Privy on POST /v1/me);
        null when the account has none.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notifications" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: putNotifications
      summary: Turn the profile's owner email on or off
      description: The address can't be set here; any other field is 400.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: boolean }
      responses:
        "200":
          description: The saved setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notifications" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/billing-details:
    get:
      operationId: getBillingDetails
      summary: The profile's billing details
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The billing details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/BillingDetailsNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: putBillingDetails
      summary: Create or replace the profile's billing details
      description: |
        Replaces every field; only taxId is optional (left out or empty means none). Each new invoice keeps a copy as its issuer
        (R-43); invoices made earlier keep the copy they took. Needs no fresh sign-in: they print on documents and move
        no money (D-63).
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingDetailsRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingDetails" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/clients:
    get:
      operationId: listClients
      summary: The profile's saved clients, by name (R-86, R-177)
      description: It lists one page, by name then id, and nextCursor continues it.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: limit
          in: query
          description: Clients per page; default 50.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          description: nextCursor from the previous page.
          schema: { type: string }
        - name: q
          in: query
          description: |
            Search text: 1 to 100 characters after trimming spaces; absent means no search, blank or longer is 422. A
            client matches when its name, email or tax ID contains the text in any letter case.
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: One page; an empty list for a profile with no saved clients
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Client" }
                  nextCursor: { type: [string, "null"], description: Null on the last page. }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/clients/{clientId}:
    get:
      operationId: getClient
      summary: One saved client, as listClients lists it (R-177)
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/ClientId"
      responses:
        "200":
          description: The client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ClientNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: putClient
      summary: Create or replace a saved client
      description: |
        The caller picks the id (a lowercase UUID), so the same request sent twice saves one client: 201 when it makes
        the client, 200 when it replaces every field. A new client is refused with 422 once the profile has 1000. An
        invoice copies the client's details when it is made (R-86); later edits change no invoice.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/ClientId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientRequest" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ClientNotFound" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: deleteClient
      summary: Delete a saved client; invoices keep their copy
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/ClientId"
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ClientNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/tokens:
    get:
      operationId: listProfileTokens
      summary: The enabled tokens and whether the profile has each on (R-136)
      description: Enabled tokens start on, except Tempo OUSD starts off. The owner can change each switch.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200": { $ref: "#/components/responses/ProfileTokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: putProfileTokens
      summary: Replace the tokens the profile has off (R-136)
      description: |
        A new invoice of the profile offers only the tokens on. Each one listed must be an enabled token, and one must
        stay on; otherwise 422 and nothing changes. Invoices made earlier keep their options.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [off]
              properties:
                off:
                  type: array
                  items: { $ref: "#/components/schemas/TokenRef" }
      responses:
        "200": { $ref: "#/components/responses/ProfileTokens" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/stores:
    get:
      operationId: listStores
      summary: The merchant profile's stores, the first one first (R-134)
      description: At most 20 per profile, so the list comes whole. A personal or freelancer profile has none.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The stores
          content:
            application/json:
              schema:
                type: object
                required: [stores]
                properties:
                  stores:
                    type: array
                    items: { $ref: "#/components/schemas/Store" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/stores/{storeId}:
    get:
      operationId: getStore
      summary: One store, as listStores lists it (R-177)
      description: A Developer or Finance member reads only their stores (D-93); another store is not found.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: The store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/StoreNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: putStore
      summary: Create or replace a store of a merchant profile (R-134)
      description: |
        The caller picks the id (a lowercase UUID), so the same request sent twice saves one store: 201 when it makes
        the store, 200 when it replaces every field. A new store is refused with 422 once the profile has 20. Invoices
        made earlier keep their close; changed origins apply to return links set from then on.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StoreRequest" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/StoreNotFound" }
        "409": { $ref: "#/components/responses/NotMerchant" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/stores/{storeId}/logo:
    put:
      operationId: putStoreLogo
      summary: Set a store's logo (R-135)
      description: |
        The body is the image itself: a PNG or JPEG of at most 1048576 bytes and 1024 pixels a side. Anything else
        is 422. The API keeps an 8-bit PNG of the same pixels. So no metadata or other content the upload carried is
        ever served. Answers the store.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/StoreId"
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/StoreNotFound" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: deleteStoreLogo
      summary: Remove a store's logo (R-135); answers the store, also when it had none
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/StoreId"
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/StoreNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/stores/{storeId}/logo.png:
    get:
      operationId: getStoreLogo
      summary: A store's logo (R-135)
      description: |
        Public: pay pages and PDFs show it, and the store id is the public project ID (D-31). A PNG the API encoded,
        served with `Content-Security-Policy: default-src 'none'`, an ETag and `Cache-Control: public, max-age=300`.
      security: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The logo
          content:
            image/png:
              schema: { type: string, format: binary }
        "304": { description: The If-None-Match ETag still matches }
        "404": { $ref: "#/components/responses/LogoNotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/invoices:
    get:
      operationId: listInvoices
      summary: The profile's invoices, newest first (highest number first), in cursor pages
      description: |
        Each item is the invoice without its deposits; GET /v1/invoices/{payToken} adds them. status, state and q narrow
        the list before paging, so a cursor continues the same filtered list. q looks in the number as shown (INV-0042),
        title, note, client name and email, receive address, reference and, when it is a number, the amount.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: limit
          in: query
          description: Items per page; default 50.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          description: nextCursor from the previous page.
          schema: { type: string }
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/PaymentState"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: One page; an empty list for a new profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoices" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createInvoice
      summary: Create an invoice once per Idempotency-Key
      description: |
        The recipient is the profile's wallet, never a request field. The receive address is computed from the terms
        (factory.predict). The same key with the same values returns the stored invoice with 200; with other values,
        409. The invoice gets the profile's next number in the same transaction (D-50): no gaps, and a repeat returns
        the same number. The insert also copies the profile's billing details as issuer (null without them). The number,
        title, note, due and supply dates, line items, agreed value, sender name, client and issuer never change after
        creation. Send chainId, token and amount for one fixed token and network, or amountUsd alone to let the payer
        choose (R-56): the invoice then accepts every enabled token on every chain the worker watches, of one mode (R-156),
        less the ones the profile or its store has off (R-136), each as its own
        option with the amount in its decimals at 1 USD per stablecoin (D-75), its own on-chain id and receive address
        (D-76). Each option counts toward the profile's limits on open receive addresses.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvoiceRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "200":
          description: The same request was made before with this key; the stored invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "409": { $ref: "#/components/responses/CreateInvoiceConflict" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NetworkNotReady" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/invoices/{invoiceId}:
    get:
      operationId: getProfileInvoice
      summary: Read one of the profile's invoices with its client
      description: |
        The public GET /v1/invoices/{payToken} plus client. Another profile's invoice is not found here. Neither is a
        payment-link invoice before its first deposit, here or on any owner route with an invoiceId (R-141).
      parameters:
        - name: view
          in: query
          description: Summary includes the billing option, current option and options with funds or problems; the default preserves every option.
          schema: { type: string, enum: [summary] }
        - $ref: "#/components/parameters/ProfileId"
        - name: invoiceId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InvoiceId" }
      responses:
        "200":
          description: The invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/invoices/{invoiceId}/cancel:
    post:
      operationId: cancelInvoice
      summary: Cancel one of the profile's invoices before any money arrives
      description: |
        R-79, D-79. Only while the invoice (every option of a payer-chooses one) is open, its checkout is still open
        and no transfer was ever seen for it. Canceled is final: the invoice keeps its number, page and PDFs, never
        settles, and money sent to it later is held for the payer (D-26). Answers the canceled invoice.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: invoiceId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InvoiceId" }
      responses:
        "200":
          description: The canceled invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "409": { $ref: "#/components/responses/InvoiceNotCancelable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/invoices/{invoiceId}/send:
    post:
      operationId: sendInvoice
      summary: Email one of the profile's invoices to its client
      description: |
        R-94. Queues one email to the invoice's client email, which the worker sends whatever the owner's email
        setting: the issuer, number, amount, due date, the pay page and the invoice PDF, with Reply-To set to the
        issuer's billing email. Only while the payer can still pay it (open or partly paid, checkout not closed). One
        send per invoice in 24 hours, and the user's 20 client emails a day (R-116); sends also share the limit for everyone with the
        payer's receipt address. The same key again answers 200 and queues nothing. Answers the invoice with its sends.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: invoiceId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InvoiceId" }
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "200":
          description: This key already queued it; nothing new is queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "409": { $ref: "#/components/responses/SendConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/invoices/{invoiceId}/reminders:
    put:
      operationId: setReminders
      summary: Turn payment reminders on or off for one of the profile's invoices
      description: |
        R-96, D-69. While on, the worker emails the invoice's client email at most 3 reminders: 3 days before the due
        date, on it and 7 days after (UTC days), each once, while the payer can still pay it and something is left. On
        needs an invoice the payer can still pay, a due date and a client email, and the client must not have stopped
        them. Off always works. Answers the invoice with its reminders.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: invoiceId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InvoiceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [on]
              properties:
                on: { type: boolean }
      responses:
        "200":
          description: The invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "409": { $ref: "#/components/responses/RemindersConflict" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/invoices/{invoiceId}/reopen:
    post:
      operationId: reopenInvoice
      summary: Reopen one of the profile's invoices that closed partly paid
      description: |
        R-130. Only for an invoice that closed partly paid (expired_partially_paid), not reopened before, a day or
        more before its receiver's settle deadline, with no refund under way. That deadline is settleDeadline, or 30
        days after an early receiver deploy if sooner. Its checkout opens again until a day before that deadline, at
        the same address. The money held for the payer, up to the amount, is the creator's again;
        deposits until the new close count as payment. Answers the invoice, its closesAt the new close.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: invoiceId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InvoiceId" }
      responses:
        "200":
          description: The invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "409": { $ref: "#/components/responses/InvoiceNotReopenable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/invoices/{invoiceId}/details:
    put:
      operationId: editInvoice
      summary: Replace what the owner may edit on one of the profile's invoices
      description: |
        R-127, R-128. The whole editable set: a missing, null or blank field clears it. Fields are checked as on
        create; the memo is the owner's own note, at most 2000 characters of plain text. memo, clientEmail and
        returnUrl change at any time. reference, note and dueDate change only while every option is open, the checkout
        is open and no transfer was seen (else 409), and a new dueDate lies between today and the day the checkout
        closes. A changed returnUrl on a merchant invoice must start with one of its store's allowedOrigins (R-134).
        Each field that changes writes one invoice.edited history row naming the field. Answers the invoice.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: invoiceId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InvoiceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                memo: { type: [string, "null"], maxLength: 2000 }
                clientEmail: { type: [string, "null"], maxLength: 254 }
                returnUrl: { type: [string, "null"], maxLength: 2000 }
                reference: { type: [string, "null"], maxLength: 100 }
                note: { type: [string, "null"], maxLength: 2000 }
                dueDate: { type: [string, "null"], format: date }
      responses:
        "200":
          description: The invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "409": { $ref: "#/components/responses/InvoiceNotEditable" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/invoices/{invoiceId}/repeat/stop:
    post:
      operationId: stopRepeat
      summary: Stop the retainer one of the profile's invoices belongs to
      description: |
        R-98. No later month's invoice is made; invoices already made stay. Answers the invoice, the same when it was
        already stopped or the invoice doesn't repeat.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: invoiceId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InvoiceId" }
      responses:
        "200":
          description: The invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/jobs:
    post:
      operationId: createJob
      summary: Create a job, a quote with a payment schedule (R-100, D-81)
      description: |
        Saved with a link token for the client, /w/<token>, and a copy of the profile's billing details as the issuer.
        The same request sent again with the same key returns the job (200); amounts compare in cents. A profile has at
        most 1000 jobs.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateJobRequest" }
      responses:
        "200":
          description: The same request was already made
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/CreateJobConflict" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      operationId: listJobs
      summary: The profile's jobs, newest first
      description: It lists one page, and nextCursor continues it.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: limit
          in: query
          description: Jobs per page; default 50.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          description: nextCursor from the previous page.
          schema: { type: string }
        - name: q
          in: query
          description: |
            Search text: 1 to 100 characters after trimming spaces; absent means no search, blank or longer is 422. A job
            matches when its title or client name contains the text in any letter case.
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: One page; an empty list for a new profile
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/JobSummary" }
                  nextCursor: { type: [string, "null"], description: Null on the last page. }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/jobs/{jobId}:
    get:
      operationId: getJob
      summary: One of the profile's jobs, with the client and the link token
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/JobNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: deleteJob
      summary: Delete a job the client has not accepted, a withdrawn quote (R-101)
      description: Its link stops working. An accepted job can't be deleted; its invoices and acceptance stay.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/JobNotFound" }
        "409": { $ref: "#/components/responses/JobAccepted" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/jobs/{jobId}/payments/{position}/done:
    post:
      operationId: markPaymentDone
      summary: Mark a step of an accepted job done, which makes its payment's invoice (R-103)
      description: |
        The invoice is made like the deposit: payer chooses, the job's title and client, one line, due dueDays after
        the UTC day, its checkout open 60 days past that (D-80). Steps go in order. The last payment's invoice is the
        final one: its note gives the job's total and each earlier payment with its invoice, amount and whether it is
        paid. It waits until no change waits (change_pending, R-105). A payment that has its invoice answers the same.
        Nothing is emailed: Send to client does that (R-94).
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: position
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 10 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                deliveryLink:
                  type: string
                  maxLength: 2000
                  description: Optional https link to the delivered work (D-66); empty or left out means none.
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/JobNotFound" }
        "409": { $ref: "#/components/responses/MarkDoneConflict" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/NetworkNotReady" }
  /v1/profiles/{profileId}/jobs/{jobId}/payments:
    post:
      operationId: proposeChange
      summary: Propose a scope change on an accepted job, a new payment at the end (R-105)
      description: |
        The client accepts it by the job's link before it can be marked done; it counts in the total once accepted.
        A job has at most 10 payments. The same request sent again with the same key returns the job (200), also once
        the change is withdrawn: it is not added again.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, amountUsd, dueDays]
              properties:
                title: { type: string, minLength: 1, maxLength: 100 }
                amountUsd: { type: string, pattern: "^[0-9]{1,10}(\\.[0-9]{1,2})?$", description: "At least 1.00" }
                dueDays: { type: integer, minimum: 0, maximum: 90 }
      responses:
        "200":
          description: The same request was already made
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/JobNotFound" }
        "409": { $ref: "#/components/responses/ChangeConflict" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/jobs/{jobId}/payments/{position}:
    delete:
      operationId: withdrawChange
      summary: Withdraw the change waiting for the client, always the last payment (R-105)
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: position
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 10 }
      responses:
        "204": { description: Withdrawn }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/JobNotFound" }
        "409": { $ref: "#/components/responses/NotWithdrawable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/reminders/{token}/stop:
    post:
      operationId: stopReminders
      summary: The client stops an invoice's payment reminders
      description: |
        R-96. Public: the token is in the reminder's Stop reminders link and its List-Unsubscribe header. Reads no body,
        so a mail provider's one-click POST (RFC 8058) works too. Stopping twice answers the same. The owner can't turn
        them on again.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "200":
          description: Stopped
          content:
            application/json:
              schema:
                type: object
                required: [number, from]
                properties:
                  number: { type: integer, minimum: 1 }
                  from: { type: [string, "null"], description: The issuer's name, else the sender name. }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/balances:
    get:
      operationId: getBalances
      summary: The profile's money per enabled chain and token
      description: |
        The wallet balance is read at the second RPC's finalized block (D-15, D-45). Pending and held come from our
        records and are not part of the wallet balance.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The balances
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Balances" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/activity:
    get:
      operationId: getActivity
      summary: The profile's invoices and deposits, newest first, in cursor pages
      description: |
        status and q narrow the list before paging, so a cursor continues the same filtered list. Under status, an
        invoice and its deposits use the related payment state. Transfer confirmation alone does not mean paid.
        Held deposits appear only without a status filter. An invoice or request appears once it has a number; a checkout
        session has no document, so only its deposits appear. Funded checkouts appear before invoice numbering. Invoices
        are ordered by creation, deposits by block time. q looks in the transaction hash (a deposit's, or a settled
        invoice's settle transaction), the token symbol and, when it is a number, the amount.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: limit
          in: query
          description: Items per page; default 50.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          description: nextCursor from the previous page.
          schema: { type: string }
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/PaymentState"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: One page; an empty list for a new profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/transactions:
    get:
      operationId: getTransactions
      summary: The profile wallet's token transfers, newest first, in cursor pages
      description: |
        Every Transfer of an enabled token from or to the profile's wallet on an enabled chain, as the worker records
        it (R-38), from the first scan that knows the wallet. A transfer between two profile wallets is out in one
        profile's list and in in the other's. Reorged transfers are left out. Ordered by block time, newest first.
        direction and q narrow the list before paging, so a cursor continues the same filtered list. q looks in the
        counterparty, transaction hash, token symbol and, when it is a number, the amount.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: limit
          in: query
          description: Items per page; default 50.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          description: nextCursor from the previous page.
          schema: { type: string }
        - name: direction
          in: query
          description: Only transfers in or out of the wallet; absent for both. Another value is 422.
          schema: { type: string, enum: [in, out] }
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: One page; an empty list for a new profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transactions" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/transactions.csv:
    get:
      operationId: exportTransactions
      summary: Every transaction of the profile wallet in the UTC days given, newest first, as CSV (R-108)
      description: |
        The columns are the date (UTC), direction, amount, token, network, counterparty, transaction, status, USD value,
        classification, invoice number and client. With a records currency (R-110) they add its value and the ECB rate
        date. A cell a spreadsheet would run as a formula starts with an apostrophe.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: from
          in: query
          description: The first UTC day (YYYY-MM-DD); absent for the first transaction.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: The last UTC day, included; absent for no end. Before from is 422.
          schema: { type: string, format: date }
      responses:
        "200":
          description: The CSV, a header row then one row per transaction
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: A bad day (invalid_value), or more than 10000 transactions in the days (too_many_transactions, R-118).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/statement.pdf:
    get:
      operationId: getStatement
      summary: The profile's income statement for the UTC days given, as a PDF (R-112)
      description: |
        Confirmed money in classified invoice or labelled income, oldest first, with each line's USD value to the cent and
        its value in the records currency, and their totals. The billing details are the account holder.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: from
          in: query
          required: true
          description: The first UTC day (YYYY-MM-DD).
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: The last UTC day, included. Before from is 422.
          schema: { type: string, format: date }
      responses:
        "200":
          description: The statement
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/BillingDetailsNotFound" }
        "422":
          description: A bad day (invalid_value), or more than 10000 transactions in the days (too_many_transactions, R-118).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/records-currency:
    get:
      operationId: getRecordsCurrency
      summary: The profile's other records currency, besides USD (R-110)
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The currency, null for none
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordsCurrency" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: setRecordsCurrency
      summary: Set or clear the profile's other records currency (R-110)
      description: EUR or a currency the ECB publishes a reference rate for, other than USD; null clears it.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordsCurrency" }
      responses:
        "200":
          description: The currency kept
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordsCurrency" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/transactions/{chainId}/{txHash}/{logIndex}/label:
    put:
      operationId: labelTransaction
      summary: Label money in that Forwend can't classify, or clear the label (R-108)
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: chainId
          in: path
          required: true
          schema: { type: integer }
        - name: txHash
          in: path
          required: true
          schema: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        - name: logIndex
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                label:
                  type: [string, "null"]
                  enum: [income, own_transfer, refund, other, null]
                  description: null or left out clears the label
      responses:
        "204": { description: Labelled }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/TransactionNotFound" }
        "409": { $ref: "#/components/responses/NotLabelable" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/balance-history:
    get:
      operationId: getBalanceHistory
      summary: The profile wallet's balance per UTC day, ending at the current balance
      description: |
        One point per UTC day for the last `days` days, today included, oldest first (R-38). A point's balance is the
        wallet balance at the end of its day (00:00 UTC of the next day); the last point is now and equals the wallet
        balance from /balances, read at the second RPC's finalized block. Each earlier balance undoes the recorded
        wallet transfers after it that the current balance includes: not reorged, and at or below that finalized
        block (final). received and sent are the sums of those transfers in and out during the point's day; today's
        has no end, so it holds every such transfer since 00:00 UTC. Money that moves without a Transfer log of the
        token (an Arc native-coin send, fees paid in the token) is not undone, so earlier balances can be off by it;
        a balance that would go below 0 shows 0.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: days
          in: query
          description: Days to cover, today included; default 30.
          schema: { type: integer, minimum: 1, maximum: 365 }
      responses:
        "200":
          description: The history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceHistory" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/jobs/{token}:
    get:
      operationId: getPublicJob
      summary: The job its client's link names
      description: Public, like the checkout. It leaves out the client block and the typed email.
      security: []
      parameters:
        - $ref: "#/components/parameters/JobToken"
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicJob" }
        "404": { $ref: "#/components/responses/JobNotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/jobs/{token}/accept:
    post:
      operationId: acceptJob
      summary: The client accepts the job with a typed name and email (R-100)
      description: |
        Public. Keeps the name, email and time. With a deposit (the first payment, onAccept) it makes the deposit
        invoice in the same transaction: payer chooses, the job's title and client, one line for the payment, due
        dueDays after the UTC day, its checkout open 60 days past that (D-80). An accepted job answers the same.
        Limited per link and for everyone together.
      security: []
      parameters:
        - $ref: "#/components/parameters/JobToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                email: { type: string, maxLength: 254 }
      responses:
        "200":
          description: The accepted job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicJob" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "404": { $ref: "#/components/responses/JobNotFound" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/NetworkNotReady" }
  /v1/jobs/{token}/payments/{position}/accept:
    post:
      operationId: acceptChange
      summary: The client accepts a scope change with a typed name and email (R-105)
      description: |
        Public. Keeps the name, email and time on the change; an accepted change answers the same. A payment that is
        not a change, or one withdrawn, is 404. Limited per link and for everyone together, like acceptJob.
      security: []
      parameters:
        - $ref: "#/components/parameters/JobToken"
        - name: position
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 10 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, proposedAt]
              properties:
                name: { type: string, minLength: 1, maxLength: 200 }
                email: { type: string, maxLength: 254 }
                proposedAt:
                  type: string
                  format: date-time
                  description: The change's proposedAt as read, with its microseconds; another change at the position is 404
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicJob" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "404": { $ref: "#/components/responses/JobNotFound" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/invoices/{payToken}:
    get:
      operationId: getInvoice
      summary: Read an invoice's terms and statuses
      description: |
        Public, so checkout can show the invoice and recompute the receive address from the terms. Anyone with the pay
        link's token can read it, so it leaves out the client's name, email and address; the payer sees the number,
        title, note, due and supply dates, reference, line items, agreed value, sender name and issuer (who bills them).
        An invoice or option id is not found: the chain shows those (D-86).
      security: []
      parameters:
        - name: payToken
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PayToken" }
      responses:
        "200":
          description: The invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/invoices/{payToken}/payer-email:
    put:
      operationId: putPayerEmail
      summary: Email me the receipt (public, like the checkout)
      description: |
        R-82, D-68. The payer's address for this invoice's receipt only, never used for anything else and deleted with
        the invoice. It can change until the receipt is sent; an invoice already paid queues its receipt now, otherwise
        it goes once paid. Limited per invoice and for everyone together; per IP at the edge (Q-8).
      security: []
      parameters:
        - name: payToken
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PayToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        "200":
          description: The address as kept (trimmed, lowercase)
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email: { type: string }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "409": { $ref: "#/components/responses/ReceiptSent" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/invoices/{payToken}/pick:
    put:
      operationId: putPick
      summary: Keep the payer's pick of an option (public, like the checkout)
      description: |
        R-57. The pay page sends it when the payer presses Show address, so the pay link opens on that option again.
        It only shows the pick: payments that add up to 1.00 USD still decide the invoice's option (R-56). A Fixed
        invoice has nothing to pick (422). Refused once a payment that can choose an option is seen. Limited per
        invoice; per IP at the edge (Q-8).
      security: []
      parameters:
        - name: payToken
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PayToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [optionId]
              properties:
                optionId: { $ref: "#/components/schemas/InvoiceId" }
      responses:
        "204": { description: Kept }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "409": { $ref: "#/components/responses/PickLocked" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/invoices/{payToken}/embed:
    get:
      operationId: checkEmbedOrigin
      summary: Whether a page may frame this checkout (public, like the checkout)
      description: |
        R-168. The web app asks before it lets a page frame `/embed/<payToken>`. allowed is true when origin is exactly
        a browser's origin and one of the allowedOrigins of the store the invoice records. A live invoice takes only
        https origins; a test-mode one also takes the store's loopback http origins. It never lists the origins.
      security: []
      parameters:
        - name: payToken
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PayToken" }
        - name: origin
          in: query
          required: true
          schema: { type: string, example: "https://shop.example.com" }
      responses:
        "200":
          description: The answer
          content:
            application/json:
              schema:
                type: object
                required: [allowed]
                properties:
                  allowed: { type: boolean }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/invoices/{payToken}/views:
    post:
      operationId: countView
      summary: Count one load of the pay page (public, like the checkout)
      description: |
        R-125. The pay page sends it once per load. It keeps a count, the first time and the last time, never an IP or
        a user agent. Limited per invoice; per IP at the edge (Q-8).
      security: []
      parameters:
        - name: payToken
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PayToken" }
      responses:
        "204": { description: Counted }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/invoices/{payToken}/recheck:
    post:
      operationId: recheckInvoice
      summary: Check an invoice on chain again (Check status)
      description: |
        Public like GET /v1/invoices/{payToken}: the payer presses Check status (R-55, D-77). Reads the receive
        address's token balance at the chain's finalized block and compares it with the recorded transfers. When more
        is on chain, the worker rescans the address from the invoice's creation block in bounded steps and books what
        it finds. Never signs. One check per invoice every 5 minutes across api replicas; a per-process limit bounds the
        RPC reads; per-IP limits belong to the edge (Q-8).
      security: []
      parameters:
        - name: payToken
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PayToken" }
      responses:
        "200":
          description: What the check found
          content:
            application/json:
              schema:
                type: object
                required: [onChain, recorded, rescanning, nextCheckAt, unreadable]
                properties:
                  onChain:
                    allOf: [{ $ref: "#/components/schemas/Uint256" }]
                    description: The receive address's balance at the chain's finalized block, in base units.
                  recorded:
                    allOf: [{ $ref: "#/components/schemas/Uint256" }]
                    description: The sum of the recorded transfers to it that are not reorged.
                  rescanning:
                    type: boolean
                    description: The worker is rescanning the address for the difference.
                  nextCheckAt: { type: string, format: date-time }
                  unreadable:
                    type: array
                    description: |
                      Chain ids of options whose network did not answer; the other options were still checked. 503
                      only when none answered.
                    items: { type: integer }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: The chain's RPC could not be read (network_unavailable); try again shortly.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/invoices/{payToken}/invoice.pdf:
    get:
      operationId: getInvoicePdf
      summary: Download the invoice as a PDF
      description: |
        Public like GET /v1/invoices/{payToken} (R-47, R-61, D-51). Built on the server from the stored invoice only:
        the Forwend mark (or the store's logo, with its color on the header rule, R-135), number, reference, the
        status (Waiting for payment, Overdue, Confirming, Partially paid, Paid, Expired or Canceled) with the amount
        that goes with it, issuer (left out when the profile had no billing details), billed-to with the client's name,
        address, country and tax ID (never the email), issue day, supply date, due date and payment window close, the
        line table (description, quantity, unit price and amount per item, or one row with the title), the totals with
        what is received and left to pay, the agreed value under them, and the note. Only while the invoice can still
        be paid does it add the pay link with its QR code, the exact amount left, the token contract and the network.
        Every page's footer has the page number and the invoice id. The same invoice gives the same bytes until its
        status changes or its due date passes.
      security: []
      parameters:
        - name: payToken
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PayToken" }
      responses:
        "200": { $ref: "#/components/responses/Pdf" }
        "304": { description: The If-None-Match ETag still matches }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/invoices/{payToken}/receipt.pdf:
    get:
      operationId: getReceiptPdf
      summary: Download the receipt of a paid invoice as a PDF
      description: |
        Public like the invoice PDF. 409 until paymentStatus is paid; a paid invoice stays paid, also once settled.
        Shows the invoice's parties, reference, supply date, line or line items and agreed value, the paid time (block
        time of the deposit that completed the amount), every deposit on any option with its network, amount received
        and the part applied to the invoice (R-121), its full tx hash and a link to the network's explorer, the totals
        received, applied, held for the payer and returned to the payer, and the pay link with its QR code to check the
        receipt, since a PDF can be edited. It says nothing about the settlement: the payer only needs to know they paid;
        moving the money to the creator is the creator's business (R-61, R-68).
      security: []
      parameters:
        - name: payToken
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PayToken" }
      responses:
        "200": { $ref: "#/components/responses/Pdf" }
        "304": { description: The If-None-Match ETag still matches }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "409": { $ref: "#/components/responses/InvoiceNotPaid" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/members:
    get:
      operationId: getTeam
      summary: A merchant profile's team and open invites (R-139)
      description: The owner first, then the members by when they joined, and the open invites newest first.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The team
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/members/{memberId}:
    put:
      operationId: putMember
      summary: Give a member another role and stores (R-139)
      description: Needs a sign-in from the last 5 minutes (D-63). The owner is an Admin for good, so the owner is 422.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/ReauthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/MemberNotFound" }
        "409": { $ref: "#/components/responses/NotMerchant" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: removeMember
      summary: Take a member off the team (R-139)
      description: |
        Their next request no longer reaches the profile, and the open invites they sent are revoked. The owner is 422.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/MemberNotFound" }
        "409": { $ref: "#/components/responses/NotMerchant" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/invites:
    post:
      operationId: invite
      summary: Invite an email address to the team (R-139)
      description: |
        Needs a sign-in from the last 5 minutes (D-63). Queues an email with a link to /invite/<token> that works once,
        for 7 days. The API keeps only the token's SHA-256. A new invite to the same address revokes the open one. The
        email counts toward the client email cap (R-116); past it the answer is 429.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteRequest" }
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invite" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/ReauthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Not a merchant profile (not_merchant), or the address is already on the team (already_on_team)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/invites/{inviteId}:
    delete:
      operationId: revokeInvite
      summary: Revoke an open invite, so its link no longer works (R-139)
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: inviteId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InviteNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/leave:
    post:
      operationId: leaveTeam
      summary: The signed-in member leaves the team (R-139)
      description: The owner can't leave, so a team always keeps an Admin (D-93); the owner is 422.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "204": { description: Left }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/NotMerchant" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/invites/{token}:
    get:
      operationId: getInvitation
      summary: What an invite link offers, for any signed-in user who has it (R-139)
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: The invite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/InviteNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/invites/{token}/accept:
    post:
      operationId: acceptInvite
      summary: Join the team with the invite's role (R-139)
      description: |
        The signed-in user's verified login email, read from Privy, must be the invited address. Accepting also marks
        the first run done (R-50).
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                required: [profileId]
                properties:
                  profileId: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The invite is for another email address (invite_for_another_email)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not signed up (not_signed_up), or the invite is used, revoked, expired or unknown (invite_not_found)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The user is the owner or a member already (already_on_team)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/links:
    get:
      operationId: listPaymentLinks
      summary: The profile's payment links, newest first (R-140)
      description: |
        A Developer or Finance member sees only the links of their stores (D-93). It lists one page, and nextCursor
        continues it. Read one link with getPaymentLink.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: limit
          in: query
          description: Links per page; default 50.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          description: nextCursor from the previous page.
          schema: { type: string }
      responses:
        "200":
          description: The links
          content:
            application/json:
              schema:
                type: object
                required: [links, nextCursor]
                properties:
                  links:
                    type: array
                    items: { $ref: "#/components/schemas/PaymentLink" }
                  nextCursor: { type: [string, "null"], description: Null on the last page. }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/links/{linkId}:
    get:
      operationId: getPaymentLink
      summary: One payment link (R-140), as listPaymentLinks lists it
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/LinkId"
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/LinkNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: putPaymentLink
      summary: Create or replace a payment link (R-140)
      description: |
        The caller picks the id (a lowercase UUID), so the same request sent twice saves one link: 201 when it makes the
        link, 200 when it replaces every field. Forwend makes the slug once (D-94).
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/LinkId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentLinkRequest" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Another profile's or store's link (link_not_found), or not one of the profile's stores (store_not_found)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A personal profile asks with requests, not payment links (personal_profile)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/links/{slug}:
    get:
      operationId: getPublicPaymentLink
      summary: A payment link as its payer sees it (public, R-142)
      description: |
        Public: anyone with the link may pay. Opening it makes nothing (D-54); state says why a link takes no payment.
      security: []
      parameters:
        - $ref: "#/components/parameters/LinkSlug"
      responses:
        "200":
          description: The link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPaymentLink" }
        "404": { $ref: "#/components/responses/PublicLinkNotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/links/{slug}/visits:
    post:
      operationId: countLinkVisit
      summary: Count one load of a payment link's page (public, R-142)
      description: |
        The page sends it once per load; the owner sees the count as visits. It keeps only the count. Limited per link;
        per IP at the edge (Q-8).
      security: []
      parameters:
        - $ref: "#/components/parameters/LinkSlug"
      responses:
        "204": { description: Counted }
        "404": { $ref: "#/components/responses/PublicLinkNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/links/{slug}/pay:
    post:
      operationId: payPaymentLink
      summary: Make the payer's invoice from a payment link (public, R-142)
      description: |
        Makes a payer-chooses invoice (R-56) with the link's title and store, the tokens on for that store and its
        default close. It has no number until its first deposit (R-141). The same Idempotency-Key, at most 200 bytes
        here, answers 200 with the same invoice; a payer's key never replays the owner's invoices. Limited per link and
        for all links together; the second is spent only by a Pay that makes an invoice.
      security: []
      parameters:
        - $ref: "#/components/parameters/LinkSlug"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkPayRequest" }
      responses:
        "200":
          description: The invoice this key made before
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkPay" }
        "201":
          description: Made
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkPay" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "404": { $ref: "#/components/responses/PublicLinkNotFound" }
        "409":
          description: |
            The owner turned the link off (link_off), it is past its last day (link_ended) or it took all its payments
            (link_full). Or the owner has no billing details yet (billing_details_required), or the key was used with
            another amount (idempotency_conflict).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/NetworkNotReady" }
  /v1/profiles/{profileId}/sends:
    get:
      operationId: listPendingSends
      summary: Signed sends the watcher hasn't recorded yet, newest first (R-215)
      description: |
        Each is brought up to date first. Once the watcher records the transfer it leaves this list: the transaction
        itself shows in GET .../transactions. Needs money.read, as the transactions do.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The sends, at most 20
          content:
            application/json:
              schema:
                type: object
                required: [sends]
                properties:
                  sends:
                    type: array
                    items: { $ref: "#/components/schemas/Send" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: prepareSend
      summary: Check a send out of the profile's wallet before the browser signs it (R-211)
      description: |
        Only the owner, with a fresh sign-in (D-49, D-61). Give `to` for an outside address or `toProfileId` for
        another of the owner's profiles. The server reads the wallet's balance, dry-runs the transfer and keeps the
        send for 10 minutes. It replaces the wallet's earlier unsigned send on the chain. Only chains where Forwend
        pays the gas offer Send (D-119).
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [chainId, token, amount]
              properties:
                chainId: { type: integer }
                token: { type: string, description: The token's contract }
                to: { type: string, description: "An address: one case, or mixed case with a valid EIP-55 checksum" }
                toProfileId: { type: string, format: uuid }
                amount: { type: string, description: "Base units, a whole number above 0" }
      responses:
        "201":
          description: Checked and kept; the browser signs it next
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Send" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/ReauthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A send from this wallet is on its way on this network (send_in_progress)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            A value breaks a rule (invalid_value): an invalid, zero, token-contract or own address, an amount above the
            balance, or a network without Send. Or the token's dry run failed (transfer_refused).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: The chain's RPC could not be read (network_unavailable); try again shortly.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/sends/fee:
    get:
      operationId: getSendFee
      summary: The most a send of the token on the chain costs the wallet now (R-216)
      description: 0, paid by Forwend, where it sponsors gas. Elsewhere the wallet pays in the token, its chain's gas coin.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - { name: chainId, in: query, required: true, schema: { type: integer } }
        - { name: token, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, description: The recipient; none estimates a send to the wallet itself, schema: { type: string } }
      responses:
        "200":
          description: The fee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendFee" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: The chain's RPC could not be read (network_unavailable); try again shortly.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/sends/{sendId}:
    get:
      operationId: getSend
      summary: A send, brought up to date from the chain (R-212)
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/SendId"
      responses:
        "200":
          description: The send
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Send" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SendNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/sends/{sendId}/submit:
    post:
      operationId: submitSend
      summary: Report the hash the browser got from signing the send (R-212)
      description: |
        The same hash again is a no-op. A send replaced, canceled or expired while it was being signed takes its hash
        too. A hash belongs to one send.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/SendId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [txHash]
              properties:
                txHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
      responses:
        "200":
          description: The send, now sending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Send" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SendNotFound" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/sends/{sendId}/cancel:
    post:
      operationId: cancelSend
      summary: Give up an unsigned send, as when the owner closes the signing step
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/SendId"
      responses:
        "204": { description: Canceled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SendNotFound" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/keys:
    get:
      operationId: listApiKeys
      summary: The profile's working secret API keys, newest first (R-144)
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The keys; never their text
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createApiKey
      summary: Make a test-mode secret API key (R-144)
      description: |
        Needs a fresh sign-in (D-63). The answer has the key's text in secret, the one time it is shown. A merchant's
        key is for one of its stores; a freelancer's has none. Its scopes never move money (D-61, D-95).
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyRequest" }
      responses:
        "201":
          description: Made
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewApiKey" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/ReauthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A personal profile has no API keys (personal_profile)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/keys/{keyId}/roll:
    post:
      operationId: rollApiKey
      summary: Make a key's new key; the old one works for the overlap (R-144)
      description: |
        Needs a fresh sign-in (D-63). The new key has the old one's name, store and scopes, and its text in secret. A
        key rolls once: a rolled key is 404 here.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/KeyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                overlapHours: { type: integer, minimum: 0, maximum: 168, default: 24 }
      responses:
        "201":
          description: The new key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NewApiKey" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/ReauthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/KeyNotFound" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/keys/{keyId}:
    delete:
      operationId: revokeApiKey
      summary: Stop a key at once (R-144)
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/KeyId"
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/KeyNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/webhooks:
    get:
      operationId: listWebhookEndpoints
      summary: The profile's webhook endpoints, newest first (R-146)
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The endpoints; never their secrets
          content:
            application/json:
              schema:
                type: object
                required: [endpoints]
                properties:
                  endpoints:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEndpoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/webhooks/{endpointId}:
    put:
      operationId: putWebhookEndpoint
      summary: Create or replace a webhook endpoint (R-146)
      description: |
        Needs a fresh sign-in (D-63). The caller picks the id, so the same request sent twice saves one endpoint: 201
        when it makes it, with a first secret that only the secret route shows, and 200 when it replaces every field.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/EndpointId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEndpointRequest" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookEndpoint" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/ReauthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/EndpointNotFound" }
        "409":
          description: A personal profile has no webhooks (personal_profile)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/WebhooksNotConfigured" }
    delete:
      operationId: deleteWebhookEndpoint
      summary: Remove a webhook endpoint and its secrets (R-146)
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/EndpointId"
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/EndpointNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/webhooks/{endpointId}/secret:
    get:
      operationId: revealWebhookSecrets
      summary: The endpoint's working signing secrets, newest first (R-146)
      description: Needs a fresh sign-in (D-63). During a rotation's overlap the old secret is listed too.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/EndpointId"
      responses:
        "200":
          description: The secrets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookSecrets" }
        "401": { $ref: "#/components/responses/ReauthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/EndpointNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/WebhooksNotConfigured" }
  /v1/profiles/{profileId}/webhooks/{endpointId}/secret/rotate:
    post:
      operationId: rotateWebhookSecret
      summary: Give the endpoint a new secret; the old one signs 24 hours more (R-146)
      description: Needs a fresh sign-in (D-63). The answer lists the working secrets, the new one first.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/EndpointId"
      responses:
        "201":
          description: Rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookSecrets" }
        "401": { $ref: "#/components/responses/ReauthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/EndpointNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/WebhooksNotConfigured" }
  /v1/profiles/{profileId}/webhooks/{endpointId}/deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: The endpoint's 50 newest deliveries, each with every attempt (R-149)
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/EndpointId"
      responses:
        "200":
          description: The deliveries, newest first
          content:
            application/json:
              schema:
                type: object
                required: [deliveries]
                properties:
                  deliveries:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/EndpointNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/webhooks/{endpointId}/deliveries/{eventId}/resend:
    post:
      operationId: resendWebhookDelivery
      summary: Send a delivery again from a first attempt, with its first body (R-149)
      description: It waits while the endpoint is off. New pending work is limited to 32 deliveries per profile; a full queue returns 429 webhook_queue_full.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/EndpointId"
        - name: eventId
          in: path
          required: true
          schema: { type: string, pattern: "^evt_[0-9a-f]{32}$" }
      responses:
        "204": { description: Queued }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/DeliveryNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/WebhooksNotConfigured" }
  /v1/profiles/{profileId}/webhooks/{endpointId}/deliveries/resend-failed:
    post:
      operationId: resendFailedWebhookDeliveries
      summary: Resend failed deliveries within the available profile queue budget (R-149)
      description: Queues at most the remaining capacity within 32 pending deliveries per profile. A full queue returns 429 webhook_queue_full.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/EndpointId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [since]
              properties:
                since: { type: string, format: date-time }
      responses:
        "200":
          description: How many go again
          content:
            application/json:
              schema:
                type: object
                required: [resent]
                properties:
                  resent: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/EndpointNotFound" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/WebhooksNotConfigured" }
  /v1/profiles/{profileId}/webhooks/{endpointId}/test:
    post:
      operationId: sendWebhookTestEvent
      summary: Queue a webhook.test event for this endpoint alone (R-149)
      description: Limited to 32 pending deliveries per profile; a full queue returns 429 webhook_queue_full.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/EndpointId"
      responses:
        "201":
          description: Queued; it waits while the endpoint is off
          content:
            application/json:
              schema:
                type: object
                required: [eventId]
                properties:
                  eventId: { type: string, pattern: "^evt_[0-9a-f]{32}$" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/EndpointNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/WebhooksNotConfigured" }
webhooks:
  invoiceEvent:
    post:
      operationId: invoiceEvent
      summary: An invoice change, sent to each endpoint that takes its type (R-147)
      description: |
        Signed with Standard Webhooks (D-42). The webhook-id header is the event's id. A receiver answers 2xx to take it;
        the sequence orders one invoice's events, so a receiver can skip a change older than one it has.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookEvent" }
      responses:
        "200": { description: Taken }
  testEvent:
    post:
      operationId: webhookTestEvent
      summary: The owner's check of an endpoint, sent to it alone (R-149)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookTestEvent" }
      responses:
        "200": { description: Taken }
components:
  securitySchemes:
    privyAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Privy access token (ES256, issuer privy.io, audience = app ID), verified locally.
    secretApiKey:
      type: http
      scheme: bearer
      description: |
        A secret API key, fw_test_ and 36 characters (R-144). It works only on its profile's routes whose permission is
        in its scopes, for its store. It never passes a route that needs a fresh sign-in (403) or a person's route (401).
  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      description: A profile the signed-in user owns or is a member of (R-138); any other value is 403.
      schema: { type: string, format: uuid }
    ClientId:
      name: clientId
      in: path
      required: true
      description: A saved client of this profile; a client of another profile is 404.
      schema: { type: string, format: uuid }
    LinkId:
      name: linkId
      in: path
      required: true
      description: A payment link of this profile; another profile's or another store's link is 404.
      schema: { type: string, format: uuid }
    MemberId:
      name: memberId
      in: path
      required: true
      description: The member's user id, as GET /v1/profiles/{profileId}/members lists it.
      schema: { type: string, format: uuid }
    InviteToken:
      name: token
      in: path
      required: true
      description: The invite link's token, 64 hex characters; a secret link.
      schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    StoreId:
      name: storeId
      in: path
      required: true
      description: A store of this profile; a store of another profile is 404.
      schema: { type: string, format: uuid }
    StatusFilter:
      name: status
      in: query
      description: |
        Only payments under this filter; absent for all. Paid includes wallet-settled payments.
        Settled is the subset already in the wallet. Other filters follow paymentStatus: canceled; expired, expired_partially_paid or closed (see Invoice.closed) is expired; any
        detected or an on-time pending transfer is confirming; other open or partially_paid is open.
        Another value is 422.
      schema: { type: string, enum: [open, confirming, paid, settled, expired, canceled] }
    PaymentState:
      name: state
      in: query
      description: |
        Only payments in this state (D-114). waiting: nothing is confirming. confirming: an on-time transfer is not
        final yet, or the whole amount is credited and waits for the finalized balance check. partially_paid: credited
        money covers part of the amount. paid. overpaid: paid, and money is held for the payer on any option (extra,
        late or another option's). expired: closed without payment, including a checkout session closed by its expire
        action (its paymentStatus stays canceled). canceled: the issuer canceled an invoice or request.
      schema: { type: string, enum: [waiting, confirming, partially_paid, paid, overpaid, expired, canceled] }
    PaymentWallet:
      name: wallet
      in: query
      description: |
        Only payments with this wallet transfer state (D-114). none: nothing to move (not paid). pending: the settle
        is waiting to be signed or to become final. in_wallet: settled into the profile wallet. delayed: it waits for a
        retry, the daily limit or an unresolved transaction. refused: the signer refused it; an operator looks at it.
      schema: { type: string, enum: [none, pending, in_wallet, delayed, refused] }
    PaymentReference:
      name: reference
      in: query
      description: Only the payment whose order reference is exactly this text (letter case counts).
      schema: { type: string, minLength: 1 }
    Search:
      name: q
      in: query
      description: |
        Search text: 1 to 100 characters after trimming spaces; absent means no search, blank or longer is 422. A field
        matches when it contains the text in any letter case. Text that is a decimal number (digits, one point,
        thousands commas allowed) also matches an amount equal to it in whole tokens, exactly: "1,250.5" finds
        1250500000 base units of a 6-decimals token, never 1250500001.
      schema: { type: string, minLength: 1, maxLength: 100 }
    JobToken:
      name: token
      in: path
      required: true
      description: The secret in the client's link /w/<token>
      schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    LinkSlug:
      name: slug
      in: path
      required: true
      description: A payment link's slug (D-94); any other value is 404 link_not_found.
      schema: { type: string, pattern: "^[a-z0-9]{12}$" }
    EndpointId:
      name: endpointId
      in: path
      required: true
      description: A webhook endpoint of this profile; another profile's is 404.
      schema: { type: string, format: uuid }
    KeyId:
      name: keyId
      in: path
      required: true
      description: A working secret API key of this profile; another profile's, a revoked or an expired key is 404.
      schema: { type: string, format: uuid }
    SendId:
      name: sendId
      in: path
      required: true
      description: A send of this profile; another profile's is 404.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1 to 255 bytes of UTF-8.
      schema: { type: string, minLength: 1, maxLength: 255 }
  schemas:
    CreateCheckoutSession:
      type: object
      additionalProperties: false
      required: [storeId, amountUsd]
      properties:
        storeId: { type: string, format: uuid }
        amountUsd: { type: string, description: Exact USD decimal, at least 1.00. }
        reference: { type: string, maxLength: 100, description: Immutable external order reference. }
        title: { type: string, maxLength: 200 }
        expiresIn: { type: integer, minimum: 900, maximum: 31536000 }
        returnUrl: { type: string, format: uri, description: HTTPS URL on a store's allowed origin. }
        metadata: { type: object, additionalProperties: { type: string }, maxProperties: 20 }
        customer:
          type: object
          additionalProperties: false
          properties:
            name: { type: string, maxLength: 200 }
            email: { type: string, format: email }
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [description, quantity, unitPrice]
            properties:
              description: { type: string, maxLength: 200 }
              quantity: { type: string, description: Exact positive decimal with up to two places. }
              unitPrice: { type: string, description: Exact USD decimal. Items must sum to amountUsd. }
    PaymentAmounts:
      type: object
      description: Exact net balances and actual outflows in the option token's base units. Review unresolved evidence before acting.
      required: [receiver, payable, held, settled, refunded, observedRefunded, lastReturnTxHash, unreconciled, hasPolicyException, reconciliationStatus]
      properties:
        reconciliationStatus: { type: string, enum: [verified, pending, review], description: Pending verification differs from evidence requiring manual review. }
        hasPolicyException: { type: boolean, description: An authority outflow consumed merchant payable or payer-held funds outside ordinary policy. }
        receiver: { type: string, pattern: "^-?[0-9]+$" }
        payable: { type: string, pattern: "^-?[0-9]+$" }
        held: { type: string, pattern: "^-?[0-9]+$" }
        settled: { type: string, pattern: "^-?[0-9]+$" }
        refunded: { type: string, pattern: "^-?[0-9]+$" }
        observedRefunded: { type: string, pattern: "^[0-9]+$" }
        lastReturnTxHash: { type: [string, "null"], pattern: "^0x[0-9a-f]{64}$" }
        unreconciled:
          type: boolean
          description: A movement awaits booking, an outflow was refused, or a balance can't be explained. Never treat a negative legacy balance as available money.
    PaymentReceipt:
      type: object
      description: Observed incoming transfers by used option. Pending amounts are not credited or proof of payment.
      required: [optionId, chainId, token, symbol, decimals, received, pending, held]
      properties:
        optionId: { $ref: "#/components/schemas/InvoiceId" }
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        decimals: { type: integer, minimum: 0 }
        received: { $ref: "#/components/schemas/Uint256" }
        pending: { $ref: "#/components/schemas/Uint256" }
        held:
          allOf: [{ $ref: "#/components/schemas/Uint256" }]
          description: Booked money on this option still owed to the payer (extra, late, another option's or after expiry).
    Payment:
      type: object
      required: [paymentId, optionId, optionLocked, optionCount, source, symbol, decimals, purpose, documentKind, number, storeId, storeName, linkId, livemode, title,
        reference, chainId, token, amount, paymentStatus, settlementStatus, refundStatus, state, wallet, dueDate, confirming,
        closed, createdAt, closesAt, hostedUrl]
      properties:
        receipts: { type: array, items: { $ref: "#/components/schemas/PaymentReceipt" } }
        customerName: { type: [string, "null"] }
        customerEmail: { type: [string, "null"] }
        amounts: { $ref: "#/components/schemas/PaymentAmounts" }
        paymentId: { $ref: "#/components/schemas/InvoiceId" }
        optionId: { $ref: "#/components/schemas/InvoiceId" }
        optionLocked: { type: boolean }
        optionCount: { type: integer, minimum: 1 }
        symbol: { type: string }
        decimals: { type: integer, minimum: 0 }
        source: { type: string, enum: [invoice, checkout, request, payment_link] }
        purpose: { type: string, enum: [invoice, checkout, request] }
        documentKind: { type: string, enum: [invoice, request, none] }
        number: { type: [integer, "null"] }
        storeId: { type: [string, "null"], format: uuid }
        storeName: { type: [string, "null"] }
        linkId: { type: [string, "null"], format: uuid }
        livemode: { type: boolean }
        title: { type: [string, "null"] }
        reference: { type: [string, "null"] }
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
        amount: { $ref: "#/components/schemas/Uint256" }
        paymentStatus: { type: string, enum: [open, detected, partially_paid, paid, expired, expired_partially_paid, canceled] }
        settlementStatus: { type: string, enum: [none, pending, settled] }
        refundStatus: { type: string, enum: [none, held, refund_pending, refunded], description: The current option's only. }
        state:
          type: string
          enum: [waiting, confirming, partially_paid, paid, overpaid, expired, canceled]
          description: The merchant's payment state (D-114); see the state filter. paymentStatus keeps its raw value.
        wallet:
          type: string
          enum: [none, pending, in_wallet, delayed, refused]
          description: The wallet transfer state (D-114); see the wallet filter. settlementStatus keeps its raw value.
        dueDate: { type: [string, "null"], format: date }
        confirming:
          type: boolean
          description: An on-time transfer is not final, or the whole amount is credited and the finalized balance check is pending.
        closed: { type: boolean }
        createdAt: { type: string, format: date-time }
        closesAt: { type: string, format: date-time }
        hostedUrl: { type: [string, "null"], format: uri }
    PaymentDetails:
      allOf:
        - $ref: "#/components/schemas/Payment"
        - type: "object"
          required: ["deliveryCount", "deliveriesTruncated", "snapshotAt", "customer", "metadata", "items", "options", "deliveries", "problems"]
          properties:
            deliveryCount: { type: "integer" }
            deliveriesTruncated: { type: "boolean" }
            snapshotAt: { type: "string" }
            customer: { $ref: "#/components/schemas/PaymentCustomer" }
            metadata:
              type: "object"
              additionalProperties: { type: "string" }
            items:
              type: "array"
              description: |
                The line items in order, empty without a breakdown. Money is in the base units of the option whose
                optionId is the paymentId; quantity has 2 decimals ("7.50").
              items:
                type: object
                required: [description, quantity, unitPrice, amount]
                properties:
                  description: { type: string }
                  quantity: { type: string }
                  unitPrice: { $ref: "#/components/schemas/Uint256" }
                  amount: { $ref: "#/components/schemas/Uint256" }
            options:
              type: "array"
              items: { $ref: "#/components/schemas/PaymentOption" }
            deliveries:
              type: "array"
              items: { $ref: "#/components/schemas/PaymentDelivery" }
            problems:
              type: "array"
              items: { $ref: "#/components/schemas/PaymentProblem" }
    PaymentCustomer:
      type: "object"
      required: ["name", "email"]
      properties:
        name:
          anyOf:
            - type: "string"
            - type: "null"
        email:
          anyOf:
            - type: "string"
            - type: "null"
    PaymentOption:
      type: "object"
      required: ["optionId", "chainId", "token", "symbol", "decimals", "amount", "receiveAddress", "closesAt", "paymentStatus", "settlementStatus", "refundStatus", "amounts", "coverage", "settlement", "returns", "deposits", "depositsTruncated"]
      properties:
        optionId: { type: "string" }
        chainId: { type: "integer" }
        token: { type: "string" }
        symbol: { type: "string" }
        decimals: { type: "integer" }
        amount: { type: "string" }
        receiveAddress: { type: "string" }
        closesAt: { type: "string" }
        paymentStatus: { type: "string" }
        settlementStatus: { type: "string" }
        refundStatus: { type: "string" }
        amounts:
          anyOf:
            - $ref: "#/components/schemas/PaymentAmounts"
            - type: "null"
        coverage: { $ref: "#/components/schemas/PaymentCoverage" }
        settlement:
          anyOf:
            - $ref: "#/components/schemas/PaymentSettlement"
            - type: "null"
        deposits:
          type: "array"
          items: { $ref: "#/components/schemas/Deposit" }
        depositsTruncated: { type: "boolean" }
        returns:
          type: array
          description: Held money the refund authority sent back to a payer, once booked, in chain order (PLAN 11.10.3).
          items:
            type: object
            additionalProperties: false
            required: ["txHash", "to", "amount", "blockTime"]
            properties:
              txHash: { type: string }
              to: { type: string, description: The payer's address the money went to. }
              amount: { type: string, description: Base units of the option's token. }
              blockTime: { type: string, format: date-time }
    PaymentCoverage:
      type: "object"
      required: ["historyComplete", "verifiedBlock", "verifiedHash", "verifiedTime", "observedBalance", "balanceDifference", "reconciliationError", "bookingError", "retryAt", "updatedAt", "chainFinalizedBlock", "pendingDeposits", "unbookedDeposits", "unprovedDeposits", "unbookedOutflows"]
      properties:
        historyComplete: { type: "boolean" }
        verifiedBlock:
          anyOf:
            - type: "integer"
            - type: "null"
        verifiedHash:
          anyOf:
            - type: "string"
            - type: "null"
        verifiedTime:
          anyOf:
            - type: "string"
            - type: "null"
        observedBalance:
          anyOf:
            - type: "string"
            - type: "null"
        balanceDifference:
          anyOf:
            - type: "string"
            - type: "null"
        reconciliationError:
          anyOf:
            - type: "string"
            - type: "null"
        bookingError:
          anyOf:
            - type: "string"
            - type: "null"
        retryAt:
          anyOf:
            - type: "string"
            - type: "null"
        updatedAt: { type: "string" }
        chainFinalizedBlock:
          anyOf:
            - type: "integer"
            - type: "null"
        pendingDeposits: { type: "integer" }
        unbookedDeposits: { type: "integer" }
        unprovedDeposits: { type: "integer" }
        unbookedOutflows: { type: "integer" }
    PaymentSettlement:
      type: "object"
      required: ["status", "wait", "attempts", "createdAt", "nextAttemptAt", "signedAt", "txHash", "receiptTxHash", "blockNumber", "blocksLeft", "secondsLeft"]
      properties:
        status: { type: "string" }
        wait:
          anyOf:
            - type: "string"
            - type: "null"
        attempts: { type: "integer" }
        createdAt: { type: "string" }
        nextAttemptAt: { type: "string" }
        signedAt:
          anyOf:
            - type: "string"
            - type: "null"
        txHash:
          anyOf:
            - type: "string"
            - type: "null"
        receiptTxHash:
          description: "Observed successful settlement hash, including a mined replacement. Display only."
          type: ["string", "null"]
        blockNumber:
          type: ["integer", "null"]
        blocksLeft:
          description: "Receipt block minus finalized block; null before a successful receipt or finalized head is available."
          type: ["integer", "null"]
        secondsLeft:
          description: "Estimated chain time remaining; recomputed from receipt time and finalized block time."
          type: ["integer", "null"]
    PaymentDelivery:
      type: "object"
      required: ["endpointId", "eventId", "eventType", "status", "enabled", "attempts", "lastStatusCode", "lastAttemptAt", "nextAttemptAt", "canManage"]
      properties:
        endpointId: { type: "string" }
        eventId: { type: "string" }
        eventType: { type: "string" }
        status: { type: "string" }
        enabled: { type: "boolean" }
        attempts: { type: "integer" }
        lastStatusCode:
          anyOf:
            - type: "integer"
            - type: "null"
        lastAttemptAt:
          anyOf:
            - type: "string"
            - type: "null"
        nextAttemptAt: { type: "string" }
        canManage: { type: "boolean" }
    PaymentProblemAsset:
      type: "object"
      required: ["chainId", "token", "symbol", "decimals"]
      properties:
        chainId: { type: "integer" }
        token: { type: "string" }
        symbol: { type: "string" }
        decimals: { type: "integer" }
    PaymentProblem:
      type: "object"
      required: ["amount", "asset", "code", "action", "optionId", "endpointId", "eventId", "reason"]
      properties:
        amount:
          anyOf:
            - type: "string"
            - type: "null"
        asset:
          anyOf:
            - $ref: "#/components/schemas/PaymentProblemAsset"
            - type: "null"
        code:
          type: "string"
          enum: ["verification_pending", "reconciliation_required", "partial_payment", "held_funds", "outflow_unreconciled", "funds_movement_exception", "settlement_delayed", "settlement_refused", "webhook_delivery"]
        action:
          type: "string"
          enum: ["wait", "share_checkout", "review_funds", "review_settlement", "review_webhooks", "ask_admin"]
        optionId:
          anyOf:
            - type: "string"
            - type: "null"
        endpointId:
          anyOf:
            - type: "string"
            - type: "null"
        eventId:
          anyOf:
            - type: "string"
            - type: "null"
        reason:
          anyOf:
            - type: "string"
            - type: "null"
    PaymentMovement:
      type: "object"
      required: ["livemode", "network", "id", "state", "recordedAt", "paymentId", "optionId", "storeId", "storeName", "source", "documentKind", "number", "reference", "title", "chainId", "token", "symbol", "decimals", "kind", "sourceAmount", "bookedAmount", "receiverDelta", "payableDelta", "heldDelta", "receiverUsdDelta", "txHash", "logIndex", "transferLogIndex", "blockHash", "blockNumber", "blockTime", "from", "to", "status", "verified", "verifiedBlock", "verifiedHash", "policyException", "reconciliationError"]
      properties:
        livemode: { type: "boolean" }
        network: { type: "string" }
        id: { type: "string" }
        state: { type: "string" }
        recordedAt: { type: "string" }
        paymentId: { type: "string" }
        optionId: { type: "string" }
        storeId:
          anyOf:
            - type: "string"
            - type: "null"
        storeName:
          anyOf:
            - type: "string"
            - type: "null"
        source:
          type: "string"
          enum: ["invoice", "checkout", "request", "payment_link"]
        documentKind:
          type: "string"
          enum: ["invoice", "request", "none"]
        number:
          anyOf:
            - type: "integer"
            - type: "null"
        reference:
          anyOf:
            - type: "string"
            - type: "null"
        title:
          anyOf:
            - type: "string"
            - type: "null"
        chainId: { type: "integer" }
        token: { type: "string" }
        symbol:
          anyOf:
            - type: "string"
            - type: "null"
        decimals:
          anyOf:
            - type: "integer"
            - type: "null"
        kind: { type: "string" }
        sourceAmount:
          anyOf:
            - type: "string"
            - type: "null"
        bookedAmount:
          anyOf:
            - type: "string"
            - type: "null"
        receiverDelta:
          anyOf:
            - type: "string"
            - type: "null"
        payableDelta:
          anyOf:
            - type: "string"
            - type: "null"
        heldDelta:
          anyOf:
            - type: "string"
            - type: "null"
        receiverUsdDelta:
          anyOf:
            - type: "string"
            - type: "null"
        txHash:
          anyOf:
            - type: "string"
            - type: "null"
        logIndex:
          anyOf:
            - type: "integer"
            - type: "null"
        transferLogIndex:
          anyOf:
            - type: "integer"
            - type: "null"
        blockHash:
          anyOf:
            - type: "string"
            - type: "null"
        blockNumber:
          anyOf:
            - type: "integer"
            - type: "null"
        blockTime:
          anyOf:
            - type: "string"
            - type: "null"
        from:
          anyOf:
            - type: "string"
            - type: "null"
        to:
          anyOf:
            - type: "string"
            - type: "null"
        status: { type: "string" }
        verified: { type: "boolean" }
        verifiedBlock:
          anyOf:
            - type: "integer"
            - type: "null"
        verifiedHash:
          anyOf:
            - type: "string"
            - type: "null"
        policyException:
          anyOf:
            - type: "string"
            - type: "null"
        reconciliationError:
          anyOf:
            - type: "string"
            - type: "null"
    PaymentBalances:
      type: "object"
      required: ["receiver", "payable", "held"]
      properties:
        receiver: { type: "string" }
        payable: { type: "string" }
        held: { type: "string" }
    PaymentReconciliationAsset:
      type: "object"
      required: ["storeId", "storeName", "chainId", "token", "symbol", "decimals", "livemode", "opening", "changes", "closing", "settled", "refunded", "checkpointBalance", "checkpointDifference", "receiverCount", "verifiedReceivers", "unreconciledReceivers", "pendingDeposits", "unbookedDeposits", "unprovedDeposits", "unbookedOutflows", "otherAssetMovements", "policyExceptions", "bookedMovements", "minVerifiedBlock", "maxVerifiedBlock", "chainFinalizedBlock"]
      properties:
        storeId:
          anyOf:
            - type: "string"
            - type: "null"
        storeName:
          anyOf:
            - type: "string"
            - type: "null"
        chainId: { type: "integer" }
        token: { type: "string" }
        symbol: { type: "string" }
        decimals: { type: "integer" }
        livemode: { type: "boolean" }
        opening: { $ref: "#/components/schemas/PaymentBalances" }
        changes: { $ref: "#/components/schemas/PaymentBalances" }
        closing: { $ref: "#/components/schemas/PaymentBalances" }
        settled: { type: "string" }
        refunded: { type: "string" }
        checkpointBalance:
          anyOf:
            - type: "string"
            - type: "null"
        checkpointDifference:
          anyOf:
            - type: "string"
            - type: "null"
        receiverCount: { type: "integer" }
        verifiedReceivers: { type: "integer" }
        unreconciledReceivers: { type: "integer" }
        pendingDeposits: { type: "integer" }
        unbookedDeposits: { type: "integer" }
        unprovedDeposits: { type: "integer" }
        unbookedOutflows: { type: "integer" }
        otherAssetMovements: { type: "integer" }
        policyExceptions: { type: "integer" }
        bookedMovements: { type: "integer" }
        minVerifiedBlock:
          anyOf:
            - type: "integer"
            - type: "null"
        maxVerifiedBlock:
          anyOf:
            - type: "integer"
            - type: "null"
        chainFinalizedBlock:
          anyOf:
            - type: "integer"
            - type: "null"
    PaymentWebhookProblem:
      type: "object"
      required: ["endpointId", "storeId", "description", "enabled", "livemode", "failed", "disabledPending", "lastProblemAt", "action"]
      properties:
        endpointId: { type: "string" }
        storeId:
          anyOf:
            - type: "string"
            - type: "null"
        description: { type: "string" }
        enabled: { type: "boolean" }
        livemode: { type: "boolean" }
        failed: { type: "integer" }
        disabledPending: { type: "integer" }
        lastProblemAt: { type: "string" }
        action:
          type: "string"
          enum: ["wait", "share_checkout", "review_funds", "review_settlement", "review_webhooks", "ask_admin"]
    CheckoutSession:
      type: object
      required: [sessionId, status, payment]
      properties:
        sessionId: { $ref: "#/components/schemas/InvoiceId" }
        status: { type: string, enum: [open, complete, expired] }
        payment: { $ref: "#/components/schemas/Payment" }
    InvoiceId:
      type: string
      description: The on-chain invoice id; a main invoice's is keccak256 of its pay link's token (D-86).
      pattern: "^0x[0-9a-f]{64}$"
    PayToken:
      type: string
      description: The pay link's token (D-86), 32 random bytes; the invoice id is keccak256 of it.
      pattern: "^[0-9a-f]{64}$"
    Address:
      type: string
      pattern: "^0x[0-9a-f]{40}$"
    Uint256:
      type: string
      description: Base units, 1 to 2^256-1.
      pattern: "^[0-9]+$"
    Me:
      type: object
      required: [onboardedAt, profiles]
      properties:
        onboardedAt:
          type: [string, "null"]
          format: date-time
          description: When the user made or skipped the first-run choice; null until then (the app shows it).
        profiles:
          type: array
          items: { $ref: "#/components/schemas/Profile" }
    PaymentLinkRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, description: 1 to 200 characters of plain text on one line. }
        storeId:
          type: string
          format: uuid
          description: A merchant's store, its first store when left out; a freelancer sends none.
        amountUsd:
          type: [string, "null"]
          pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$"
          description: A fixed amount in USD, at least 1.00. Left out, the payer enters the amount.
        minUsd:
          type: [string, "null"]
          pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$"
          description: An open amount's lowest, at least 1.00 and at most maxUsd. No default (D-94).
        maxUsd:
          type: [string, "null"]
          pattern: "^[0-9]{1,12}(\\.[0-9]{1,2})?$"
          description: An open amount's highest. No default cap (D-94).
        endsAt:
          type: [string, "null"]
          format: date-time
          description: When the link stops taking payments.
        maxPayments:
          type: [integer, "null"]
          minimum: 1
          maximum: 1000000
          description: The most paid invoices the link takes.
        active: { type: boolean, description: "The on or off switch; left out: on." }
    WebhookEndpoint:
      type: object
      required: [endpointId, url, description, storeId, events, enabled, livemode, createdAt, updatedAt]
      properties:
        endpointId: { type: string, format: uuid }
        url: { type: string, maxLength: 2048 }
        description: { type: string, maxLength: 200 }
        storeId: { type: [string, "null"], format: uuid, description: "A merchant endpoint's one store; null for all, and for a freelancer." }
        events:
          type: array
          items: { type: string, enum: [invoice.detected, invoice.partially_paid, invoice.paid, invoice.settled, invoice.expired, invoice.canceled, invoice.held, invoice.open, invoice.reopened] }
        enabled: { type: boolean }
        livemode: { type: boolean, description: "False: test mode (D-87)." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WebhookEndpointRequest:
      type: object
      additionalProperties: false
      required: [url, events]
      properties:
        url:
          type: string
          maxLength: 2048
          description: https, with no credentials and a public host; no private, loopback, link-local or CGNAT address.
        description: { type: string, maxLength: 200 }
        storeId: { type: string, format: uuid, description: "A merchant's store to narrow it to; left out for all." }
        events:
          type: array
          minItems: 1
          items: { type: string, enum: [invoice.detected, invoice.partially_paid, invoice.paid, invoice.settled, invoice.expired, invoice.canceled, invoice.held, invoice.open, invoice.reopened] }
        enabled: { type: boolean, default: true }
    WebhookEvent:
      type: object
      required: [id, type, livemode, sequence, timestamp, data]
      properties:
        id: { type: string, pattern: "^evt_[0-9a-f]{32}$", description: The same for every endpoint. }
        type:
          type: string
          enum: [invoice.detected, invoice.partially_paid, invoice.paid, invoice.settled, invoice.expired, invoice.canceled, invoice.held, invoice.open, invoice.reopened]
        livemode: { type: boolean, description: "False: test mode (D-87)." }
        sequence: { type: integer, minimum: 1, description: "The invoice's events from 1, in commit order." }
        timestamp: { type: string, format: date-time, description: "When the change was written: its transaction's start." }
        data:
          type: object
          required: [invoice, held]
          properties:
            invoice:
              $ref: "#/components/schemas/Invoice"
              description: As the owner's read answers when the event is sent; a link invoice's number may be null.
            held:
              description: The money held for the payer on invoice.held; null on any other type.
              oneOf:
                - type: "null"
                - type: object
                  required: [amount, reason, optionId]
                  properties:
                    amount: { type: string, description: Base units of the invoice token. }
                    reason:
                      type: string
                      enum: [overpaid, late, expired, canceled, other_option]
                    optionId: { type: [string, "null"], description: "The option it is on, on a payer-chooses invoice." }
    WebhookTestEvent:
      type: object
      required: [id, type, livemode, timestamp, data]
      properties:
        id: { type: string, pattern: "^evt_[0-9a-f]{32}$" }
        type: { type: string, enum: [webhook.test] }
        livemode: { type: boolean }
        timestamp: { type: string, format: date-time }
        data: { type: object, additionalProperties: false, description: Empty. }
    WebhookDelivery:
      type: object
      required: [eventId, type, invoiceId, number, status, nextAttemptAt, createdAt, attempts]
      properties:
        eventId: { type: string, pattern: "^evt_[0-9a-f]{32}$" }
        type:
          type: string
          enum: [invoice.detected, invoice.partially_paid, invoice.paid, invoice.settled, invoice.expired, invoice.canceled, invoice.held, invoice.open, invoice.reopened, webhook.test]
        invoiceId: { type: [string, "null"], description: Null for a test event. }
        number:
          type: [integer, "null"]
          minimum: 1
          description: The invoice's; null for a test event and a link invoice before its first deposit.
        status: { type: string, enum: [pending, succeeded, failed] }
        nextAttemptAt: { type: [string, "null"], format: date-time, description: Set only while pending. }
        createdAt: { type: string, format: date-time }
        attempts:
          type: array
          description: Oldest first.
          items:
            type: object
            required: [at, statusCode, error, durationMs]
            properties:
              at: { type: string, format: date-time }
              statusCode: { type: [integer, "null"], description: Null when no answer came. }
              error: { type: [string, "null"], description: "A short reason, never the URL." }
              durationMs: { type: integer, minimum: 0 }
    WebhookSecrets:
      type: object
      required: [secrets]
      properties:
        secrets:
          type: array
          description: The working secrets, newest first.
          items:
            type: object
            required: [secret, createdAt, expiresAt]
            properties:
              secret: { type: string, pattern: "^whsec_[A-Za-z0-9+/]{43}=$", description: Standard Webhooks secret. }
              createdAt: { type: string, format: date-time }
              expiresAt: { type: [string, "null"], format: date-time, description: Set once rotated; it signs until then. }
    ApiKey:
      type: object
      required: [keyId, name, storeId, livemode, last4, scopes, createdAt, lastUsedAt, expiresAt]
      properties:
        keyId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 100 }
        storeId: { type: [string, "null"], format: uuid, description: "A merchant key's store; null for a freelancer's." }
        livemode: { type: boolean, description: "False: a test-mode key (D-87). Live keys wait for a live chain. A key reaches only invoices of its mode (R-156)." }
        last4: { type: string, pattern: "^[0-9A-Za-z]{4}$", description: The last 4 characters of its text. }
        scopes:
          type: array
          items: { type: string, enum: [invoices.read, invoices.write, stores.read, tokens.read] }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time, description: Kept to the minute. }
        expiresAt: { type: [string, "null"], format: date-time, description: Set once rolled; it works until then. }
    NewApiKey:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              pattern: "^fw_test_[0-9A-Za-z]{36}$"
              description: The key's text, in this answer alone; only its SHA-256 is kept.
    ApiKeyRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        storeId: { type: string, format: uuid, description: "A merchant key's store, one of the profile's; a freelancer leaves it out." }
        scopes:
          type: array
          minItems: 1
          items: { type: string, enum: [invoices.read, invoices.write, stores.read, tokens.read] }
    PublicPaymentLink:
      type: object
      required: [slug, title, payee, brand, amountUsd, minUsd, maxUsd, state, livemode, version]
      properties:
        version: { type: string, pattern: "^[1-9][0-9]{0,18}$", description: Opaque offer revision. Visits do not change it. }
        slug: { type: string, pattern: "^[a-z0-9]{12}$" }
        title: { type: string }
        payee: { type: [string, "null"], description: "The billing name; null before the owner saves billing details." }
        livemode: { type: boolean, description: "The link's permanent mode; each payer invoice keeps it (D-87)." }
        brand:
          type: [object, "null"]
          required: [storeId, color, logoAt]
          description: A merchant store's branding (R-135); null for a freelancer's link.
          properties:
            storeId: { type: string, format: uuid }
            color: { type: [string, "null"], pattern: "^#[0-9a-f]{6}$" }
            logoAt: { type: [string, "null"], format: date-time }
        amountUsd: { type: [string, "null"], description: "A fixed link's USD amount; null for an open one." }
        minUsd: { type: [string, "null"], description: "An open link's least amount, if any." }
        maxUsd: { type: [string, "null"], description: "An open link's greatest amount, if any." }
        state:
          type: string
          enum: [on, off, ended, full, not_ready]
          description: Only on takes payments; off is the owner's switch, ended past its last day, full when paid uses and reservations fill its cap, not_ready when acceptance setup is incomplete.
    LinkPayRequest:
      type: object
      additionalProperties: false
      properties:
        expectedAmountUsd:
          type: string
          description: Quoted USD amount. New attempts reject changed prices; committed attempts replay original terms.
        expectedVersion:
          type: string
          pattern: "^[1-9][0-9]{0,18}$"
          description: Public offer version shown to the customer. New attempts reject revised offers.
        amountUsd:
          type: string
          description: An open link's amount, USD with at most two decimals within its limits; left out for a fixed link.
    LinkPay:
      type: object
      required: [payToken, paymentId, sessionId]
      properties:
        paymentId: { $ref: "#/components/schemas/InvoiceId" }
        sessionId: { $ref: "#/components/schemas/InvoiceId" }
        payToken: { $ref: "#/components/schemas/PayToken" }
    PaymentLink:
      type: object
      required: [linkId, slug, title, storeId, amountUsd, minUsd, maxUsd, endsAt, maxPayments, active, visits, paid, reserved, ready,
        createdAt, updatedAt, livemode]
      properties:
        linkId: { type: string, format: uuid }
        slug:
          type: string
          pattern: "^[a-z0-9]{12}$"
          description: The /l/<slug> address; random, and it never changes (D-94).
        title: { type: string }
        storeId: { type: [string, "null"], format: uuid, description: Immutable selling store; null for a freelancer. }
        amountUsd: { type: [string, "null"], description: "Two decimals; null for an open amount." }
        minUsd: { type: [string, "null"] }
        maxUsd: { type: [string, "null"] }
        endsAt: { type: [string, "null"], format: date-time }
        maxPayments: { type: [integer, "null"] }
        active: { type: boolean }
        visits: { type: integer, description: Times the link's page was opened. }
        paid: { type: integer, description: Successful purchases, independent of settlement. }
        ready: { type: boolean, description: Billing details, wallet and accepted tokens are ready in this store and mode. }
        reserved: { type: integer, description: Open attempts awaiting canonical payment or expiration. }
        livemode: { type: boolean, description: "The link's permanent mode; a key reaches only links of its mode (D-87)." }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GrantRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, developer, finance]
        stores:
          type: array
          description: A Developer's or Finance member's stores, one or more of the profile's; an Admin's are left out.
          items: { type: string, format: uuid }
    InviteRequest:
      allOf:
        - $ref: "#/components/schemas/GrantRequest"
        - type: object
          required: [email]
          properties:
            email: { type: string, description: Checked like a client email; kept in lower case. }
    Member:
      type: object
      required: [memberId, email, role, stores, createdAt]
      properties:
        memberId: { type: string, format: uuid }
        email:
          type: [string, "null"]
          description: The account's login email; null when it has none.
        role:
          type: string
          enum: [owner, admin, developer, finance]
        stores:
          type: array
          description: Empty for the owner and Admins, who reach every store.
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    Invite:
      type: object
      required: [inviteId, email, role, stores, createdAt, expiresAt]
      properties:
        inviteId: { type: string, format: uuid }
        email: { type: string }
        role:
          type: string
          enum: [admin, developer, finance]
        stores:
          type: array
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    Team:
      type: object
      required: [members, invites]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        invites:
          type: array
          items: { $ref: "#/components/schemas/Invite" }
    Invitation:
      type: object
      required: [profileName, email, role, expiresAt]
      properties:
        profileName: { type: string }
        email: { type: string, description: The invited address. }
        role:
          type: string
          enum: [admin, developer, finance]
        expiresAt: { type: string, format: date-time }
    Profile:
      type: object
      required: [profileId, kind, name, walletAddress, createdAt, role, permissions]
      properties:
        profileId: { type: string, format: uuid }
        kind:
          type: string
          enum: [personal, freelancer, merchant]
        role:
          type: string
          enum: [owner, admin, developer, finance]
          description: The user's role on the profile (R-138); the owner has every permission.
        permissions:
          type: array
          description: What the role may do (D-93), so the app shows only the pages it can use. The API checks it anyway.
          items:
            type: string
            enum: [invoices.read, invoices.write, stores.read, stores.write, clients.read, clients.write, money.read,
              money.write, money.move, billing.read, billing.write, tokens.read, tokens.write, jobs, notifications, team, team.leave,
              keys, webhooks]
        name:
          type: [string, "null"]
          description: null when none was given; always null for the personal profile.
        walletAddress:
          description: The profile's Privy wallet, where settlements pay; null until Privy has made it.
          oneOf:
            - $ref: "#/components/schemas/Address"
            - type: "null"
        createdAt: { type: string, format: date-time }
    OnboardingRequest:
      type: object
      additionalProperties: false
      required: [choices]
      properties:
        choices:
          type: array
          description: Any number, repeats allowed; empty means Skip.
          items:
            type: string
            enum: [receive_and_send, get_paid_by_clients, accept_business_payments, build_integration]
        names:
          type: object
          additionalProperties: false
          description: >-
            Names for the profiles this call makes, by kind. A name for a kind no choice makes is 422 invalid_value;
            an empty name is no name. A merchant's first store takes its name. Once the user is onboarded, valid names change nothing.
          properties:
            freelancer: { type: string, maxLength: 64 }
            merchant: { type: string, maxLength: 64 }
    CreateProfileRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [freelancer, merchant]
        name:
          type: string
          maxLength: 64
          description: Optional; empty means none. At most 64 characters.
    BillingDetailsRequest:
      type: object
      additionalProperties: false
      required: [name, address, country, email]
      description: Lengths count characters; no NUL. Only taxId is optional; empty means none.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        address:
          type: string
          minLength: 1
          maxLength: 500
          description: Postal address; may have line breaks.
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          description: An assigned ISO 3166-1 alpha-2 code in upper case, like DE.
        taxId: { type: string, maxLength: 50 }
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: A plain contact address like name@example.com, without a display name.
    ClientRequest:
      type: object
      additionalProperties: false
      required: [name]
      description: Lengths count characters; no NUL. Only name is required; empty means none.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email:
          type: string
          maxLength: 254
          description: The billing email, where invoices go; a plain address like name@example.com.
        address:
          type: string
          maxLength: 500
          description: Postal address; may have line breaks.
        country:
          type: string
          pattern: "^([A-Z]{2})?$"
          description: An assigned ISO 3166-1 alpha-2 code in upper case, like DE.
        taxId: { type: string, maxLength: 50, description: The client's tax or VAT ID. }
        reference:
          type: string
          maxLength: 100
          description: |
            The client's PO number or reference that New invoice fills in (R-90); one line. Each invoice keeps its own.
        reminders:
          type: boolean
          description: New invoice starts with payment reminders on for this client (R-97); false when left out.
    Client:
      type: object
      required: [clientId, name, email, address, country, taxId, reference, reminders, updatedAt]
      description: A saved client; a field it doesn't have is null.
      properties:
        clientId: { type: string, format: uuid }
        name: { type: string }
        email: { type: [string, "null"] }
        address: { type: [string, "null"] }
        country: { type: [string, "null"], pattern: "^[A-Z]{2}$" }
        taxId: { type: [string, "null"] }
        reference: { type: [string, "null"] }
        reminders: { type: boolean }
        updatedAt: { type: string, format: date-time }
    StoreRequest:
      type: object
      additionalProperties: false
      required: [name, defaultExpiresIn]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Plain text on one line; it can't name Forwend.
        defaultExpiresIn:
          type: integer
          minimum: 900
          maximum: 31536000
          description: Seconds until the checkout closes for an invoice made without expiresIn.
        allowedOrigins:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 300 }
          description: |
            https origins like https://shop.example.com, without a path, query or fragment; repeats count once. They are
            kept in lower case without the default port. A return link must start with one of them; empty allows none.
            An http origin on localhost or 127.0.0.1 is for test mode: only a test-mode checkout embeds under it (R-168).
            The host is a hostname of letters, digits, hyphens and dots with an optional port; no wildcard.
        brandColor:
          type: string
          pattern: "^(#[0-9a-fA-F]{6})?$"
          description: The store's accent color (R-135), kept in lower case; empty or left out means none.
        tokensOff:
          type: array
          items: { $ref: "#/components/schemas/TokenRef" }
          description: |
            Tokens off for the store's invoices on top of the profile's (R-136). Each must be an enabled token, and
            one must stay on; otherwise 422. Left out means none. A member whose role lacks tokens.write gets 403 when
            this differs from the store's (D-93).
    Store:
      type: object
      required: [storeId, name, defaultExpiresIn, allowedOrigins, brandColor, logoAt, tokensOff, updatedAt]
      description: A merchant profile's store. storeId is its project ID, public and with no authority (D-31).
      properties:
        storeId: { type: string, format: uuid }
        name: { type: string }
        defaultExpiresIn: { type: integer }
        allowedOrigins: { type: array, items: { type: string } }
        brandColor: { type: [string, "null"], pattern: "^#[0-9a-f]{6}$" }
        logoAt:
          type: [string, "null"]
          format: date-time
          description: When the logo was saved (R-135); null without one.
        tokensOff:
          type: array
          items: { $ref: "#/components/schemas/TokenRef" }
          description: |
            By chain id, then contract. Only enabled tokens: one switched off for everyone leaves the list, and the
            next save drops it.
        updatedAt: { type: string, format: date-time }
    TokenRef:
      type: object
      additionalProperties: false
      required: [chainId, token]
      description: A token by its chain and contract; any letter case in, lowercase out.
      properties:
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
    TokenSwitch:
      type: object
      required: [chainId, token, symbol, decimals, network, on]
      properties:
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        decimals: { type: integer, minimum: 0 }
        network: { type: string, description: The chain's name, like base-sepolia. }
        on: { type: boolean }
    Issuer:
      type: object
      required: [name, address, country, taxId, email]
      description: Billing details; taxId is null when none was given.
      properties:
        name: { type: string }
        address: { type: string }
        country: { type: string, pattern: "^[A-Z]{2}$" }
        taxId: { type: [string, "null"] }
        email: { type: string }
    InvoiceEvent:
      type: object
      required: [id, purpose, documentKind, title, kind, invoiceId, number, chainId, token, symbol, decimals, amount, at]
      properties:
        id: { type: integer }
        purpose: { type: string, enum: [invoice, checkout, request] }
        documentKind: { type: string, enum: [invoice, request, none] }
        title: { type: [string, "null"] }
        kind:
          type: string
          enum: [invoice.paid, invoice.settled, invoice.held]
          description: The payer's receipt (invoice.receipt) is not listed.
        invoiceId: { $ref: "#/components/schemas/InvoiceId" }
        number: { type: [integer, "null"], minimum: 1 }
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        decimals: { type: integer, minimum: 0 }
        amount:
          allOf: [{ $ref: "#/components/schemas/Uint256" }]
          description: The option's amount; for invoice.held, the amount newly held for the payer.
        at:
          type: string
          format: date-time
    Owed:
      type: object
      required: [kind, invoiceId, number, purpose, documentKind, reference, title, clientName, dueDate, daysLate,
        optionCount, chainId, token, symbol, decimals, amount]
      properties:
        kind:
          type: string
          enum: [overdue, partlyPaid]
          description: |
            overdue: the due date is before today's UTC date. partlyPaid: part is in and it is not overdue. The held
            kind is no longer sent (D-114): held money is the payer's, not owed to the profile.
        invoiceId: { $ref: "#/components/schemas/InvoiceId" }
        number: { type: [integer, "null"], minimum: 1, description: null for a checkout session (documentKind none). }
        purpose: { type: string, enum: [invoice, checkout, request] }
        documentKind: { type: string, enum: [invoice, request, none] }
        reference: { type: [string, "null"], description: The order reference; names a checkout session. }
        title: { type: [string, "null"] }
        clientName: { type: [string, "null"] }
        dueDate: { type: [string, "null"], format: date }
        daysLate: { type: integer, minimum: 0, description: Whole UTC days past the due date; 0 unless overdue. }
        optionCount:
          type: integer
          minimum: 1
          description: Above 1 the client chooses the token, so an unpaid row reads in USD at 1 USD per token (D-75).
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        decimals: { type: integer, minimum: 0 }
        amount:
          allOf: [{ $ref: "#/components/schemas/Uint256" }]
          description: What is left to pay, the amount less what the ledger booked to the owner.
    OwedTotal:
      type: object
      required: [chainId, token, symbol, decimals, amount]
      properties:
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        decimals: { type: integer, minimum: 0 }
        amount: { $ref: "#/components/schemas/Uint256" }
    Notifications:
      type: object
      required: [email, address]
      properties:
        email:
          type: boolean
          description: On (the default) or off for this profile.
        address:
          type: [string, "null"]
          description: The account's verified login email that the email goes to; null when the account has none.
    BillingDetails:
      allOf:
        - $ref: "#/components/schemas/Issuer"
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: { type: string, format: date-time }
    Balances:
      type: object
      required: [tokens, estimatedUsdTotal]
      properties:
        tokens:
          type: array
          items: { $ref: "#/components/schemas/TokenBalance" }
        estimatedUsdTotal:
          type: [string, "null"]
          description: |
            An estimate, not a quote: the sum of the wallet balances counting each stablecoin as 1 USD, cut (never
            rounded up) to 2 decimals (for example "12.50"). Pending and held are not included. null when any wallet
            balance is missing.
    TokenPrice:
      type: object
      required: [chainId, token, symbol, coinId, usd, sourceUpdatedAt, fetchedAt, stale]
      properties:
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        coinId:
          type: [string, "null"]
          description: The CoinGecko coin (usd-coin, tether, open-usd); null for a symbol without one.
        usd:
          type: [string, "null"]
          pattern: "^[0-9]+(\\.[0-9]+)?$"
          description: The price of 1 token in USD, exactly as CoinGecko gave it (for example "0.999542"). null without
            a price; never 1 in its place.
        sourceUpdatedAt:
          type: [string, "null"]
          format: date-time
          description: When CoinGecko last updated the price; null without one.
        fetchedAt:
          type: [string, "null"]
          format: date-time
          description: When the worker read it; null without a price.
        stale:
          type: boolean
          description: true without a price, when fetchedAt is over 1 hour old or sourceUpdatedAt over 24 hours old.
    TokenBalance:
      type: object
      required: [chainId, token, symbol, decimals, livemode, sendable, wallet, finalizedBlock, pending, settling,
        confirming, partial, held]
      properties:
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        decimals: { type: integer, minimum: 0 }
        livemode: { type: boolean, description: The chain's mode (D-87). }
        sendable:
          type: boolean
          description: "Send offers it: Forwend pays the gas, or the token is the gas coin the wallet pays with (D-119, R-216)."
        wallet:
          description: The profile wallet's balance at finalizedBlock; null when the profile has no wallet yet or the
            chain could not be read.
          oneOf:
            - $ref: "#/components/schemas/Uint256"
            - type: "null"
        finalizedBlock:
          type: [integer, "null"]
          description: The second RPC's finalized block the wallet balance was read at.
        pending:
          type: string
          pattern: "^[0-9]+$"
          description: |
            Not in the wallet yet: deposits to the profile's invoices the ledger has not booked (detected, or final but
            not booked; a late or extra one is later moved to held), plus booked money owed to the creator and not
            settled yet. The wallet balance and our records are read at different moments, so for a short time after a
            settlement the amount can show in both wallet and pending, or briefly in neither. Exactly settling +
            confirming + partial.
        settling:
          type: string
          pattern: "^[0-9]+$"
          description: Booked to the creator on paid payments, waiting for the transfer to the wallet.
        confirming:
          type: string
          pattern: "^[0-9]+$"
          description: |
            Deposits the ledger has not booked yet, plus money booked to the creator on a payment paid in full that
            waits for the finalized balance check. An unbooked deposit can still turn out late or extra, and then held.
        partial:
          type: string
          pattern: "^[0-9]+$"
          description: |
            Booked to the creator on partly paid payments. If the checkout closes before the rest comes, it is held for
            the payer (D-26) unless the owner reopens it (R-130).
        held:
          type: string
          pattern: "^[0-9]+$"
          description: |
            Booked money held for payers (late or extra payments). It is a liability to the payer, never owed to the
            creator (D-114); the creator's only if the owner reopens the invoice (R-130).
    Activity:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }
        nextCursor:
          type: [string, "null"]
          description: Pass as cursor for the next page; null on the last page.
    ActivityItem:
      type: object
      required: [kind, at, invoiceId, chainId, token, symbol, decimals, amount, status, optionCount, closed, held,
        merchantAmount, heldAmount, purpose, documentKind, number, reference, clientName, title]
      properties:
        paymentStatus: { type: string, description: Customer payment state, independent of the individual transfer confirmation. }
        confirming: { type: boolean, description: "An on-time transfer is still being confirmed or credited, or the finalized balance check is pending." }
        kind:
          type: string
          enum: [invoice, deposit]
        at:
          type: string
          format: date-time
          description: |
            When the invoice was made, or the deposit's block time. A block time has whole seconds, so a deposit's at
            is never before its payment was made; at the same at, deposits come first.
        invoiceId: { $ref: "#/components/schemas/InvoiceId" }
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
        symbol:
          type: string
          description: The token's symbol, also for a token no longer enabled.
        decimals: { type: integer, minimum: 0 }
        amount: { $ref: "#/components/schemas/Uint256" }
        status:
          type: string
          description: An invoice's paymentStatus, or a deposit's status (detected or confirmed). Reorged deposits are
            left out.
        settlementStatus:
          type: string
          enum: [none, pending, settled]
          description: Invoices only.
        txHash:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
          description: A deposit's transaction; for an invoice, its settlementTxHash once there is one.
        optionCount:
          type: integer
          minimum: 1
          description: >-
            The invoice's accepted options; above 1 the client chooses, and the invoice reads in USD rather than the
            token and network given here (its first option). 1 for a deposit.
        closed:
          type: boolean
          description: As Invoice.closed for the related payment.
        held:
          type: boolean
          description: >-
            A deposit the owner gets none of, held for the payer (D-26): late, on a canceled or final invoice, on an
            invoice that expired partly paid, or on an option the client did not pay with. False for an invoice. A
            deposit split between the owner and the payer is not held: merchantAmount and heldAmount give its parts.
        merchantAmount:
          oneOf:
            - $ref: "#/components/schemas/Uint256"
            - type: "null"
          description: |
            A booked deposit's part the ledger booked to the owner; 0 once a partly paid expiry moved it to the payer.
            null for an invoice and for a deposit not booked yet.
        heldAmount:
          oneOf:
            - $ref: "#/components/schemas/Uint256"
            - type: "null"
          description: |
            A booked deposit's part held for the payer (D-114); amount = merchantAmount + heldAmount. null when
            merchantAmount is.
        purpose: { type: string, enum: [invoice, checkout, request], description: The related payment's. }
        documentKind: { type: string, enum: [invoice, request, none] }
        number: { type: [integer, "null"], minimum: 1, description: null for a checkout session. }
        reference: { type: [string, "null"], description: The payment's order reference. }
        clientName: { type: [string, "null"], description: The client or customer name. }
        title: { type: [string, "null"] }
    Transactions:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        nextCursor:
          type: [string, "null"]
          description: Pass as cursor for the next page; null on the last page.
    Transaction:
      type: object
      required: [chainId, token, symbol, decimals, direction, amount, counterparty, txHash, logIndex, blockNumber, at,
        status, usdValue, classification, labelable, invoice, recordsValue]
      properties:
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
        symbol:
          type: string
          description: The token's symbol, also for a token no longer enabled.
        decimals: { type: integer, minimum: 0 }
        direction:
          type: string
          enum: [in, out]
          description: in when the wallet received the tokens, out when it sent them.
        amount: { $ref: "#/components/schemas/Uint256" }
        counterparty:
          allOf: [{ $ref: "#/components/schemas/Address" }]
          description: The sender for in, the receiver for out; the zero address for a mint or a burn.
        txHash: { type: string, pattern: "^0x[0-9a-f]{64}$" }
        logIndex: { type: integer, minimum: 0 }
        blockNumber: { type: integer, minimum: 0 }
        at:
          type: string
          format: date-time
          description: The block's time.
        status:
          type: string
          enum: [detected, confirmed]
          description: confirmed once the block is at or below the chain's finalized block (D-45).
        usdValue:
          type: string
          description: The value at receipt, 1 USD per USD stablecoin (D-75, D-82), with every decimal of the token.
        classification:
          type: string
          enum: [invoice, payment, payment_exception, own_transfer, sent, unclassified, income, refund, other]
          description: |
            invoice or payment requires the exact booked settlement event and token transfer.
            payment_exception preserves a policy exception or unresolved attribution; it requires review or a manual label.
            own_transfer is between the user's profiles; sent is other money out. Other receipts require a label.
        labelable:
          type: boolean
          description: True for money in that Forwend can't classify, labelled or not; only those take a label.
        invoice:
          type: [object, "null"]
          description: The invoice money in paid; null for anything else.
          required: [invoiceId, number, clientName]
          properties:
            invoiceId: { type: string }
            number: { type: integer }
            clientName: { type: [string, "null"] }
        payment:
          type: object
          required: [paymentId, purpose, documentKind, policyException, unreconciled]
          properties:
            paymentId: { $ref: "#/components/schemas/InvoiceId" }
            purpose: { type: string, enum: [invoice, checkout, request] }
            documentKind: { type: string, enum: [invoice, request, none] }
            policyException: { type: [string, "null"] }
            unreconciled: { type: boolean }
        recordsValue:
          type: [object, "null"]
          description: |
            The value in the profile's other records currency (R-110): the USD value at the ECB rates of rateDate, the
            latest ECB day on or before the transfer's UTC day within 7 days, rounded half up. Null without a currency or
            such a rate.
          required: [currency, amount, rateDate]
          properties:
            currency: { type: string, pattern: "^[A-Z]{3}$" }
            amount: { type: string }
            rateDate: { type: string, format: date }
    RecordsCurrency:
      type: object
      additionalProperties: false
      properties:
        currency: { type: [string, "null"], pattern: "^[A-Z]{3}$" }
    BalanceHistory:
      type: object
      required: [points, tokens]
      properties:
        points:
          type: array
          description: One per UTC day, oldest first; the last is today, at now.
          items: { $ref: "#/components/schemas/BalanceHistoryPoint" }
        tokens:
          type: array
          description: One per enabled chain and token, as in Balances.
          items: { $ref: "#/components/schemas/TokenHistory" }
    BalanceHistoryPoint:
      type: object
      required: [at, estimatedUsd, receivedUsd, sentUsd]
      properties:
        at:
          type: string
          format: date-time
          description: The end of the point's UTC day (00:00 UTC of the next day); now for the last point.
        estimatedUsd:
          type: [string, "null"]
          description: |
            An estimate, not a quote: the point's balances counting each stablecoin as 1 USD, cut (never rounded up)
            to 2 decimals (for example "12.50"). null when any token's series is null.
        receivedUsd:
          type: [string, "null"]
          description: The point's received amounts, counted like estimatedUsd.
        sentUsd:
          type: [string, "null"]
          description: The point's sent amounts, counted like estimatedUsd.
    TokenHistory:
      type: object
      required: [chainId, token, symbol, decimals, livemode, balances, received, sent]
      properties:
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        decimals: { type: integer, minimum: 0 }
        livemode: { type: boolean, description: The chain's mode (D-87). }
        balances:
          type: [array, "null"]
          description: One per point, in base units; the wallet balance at the point's at. null when the current wallet
            balance is missing (no wallet yet, or the chain could not be read); received and sent are then null too.
          items: { type: string, pattern: "^[0-9]+$" }
        received:
          type: [array, "null"]
          description: One per point, in base units; the sum of final transfers into the wallet during the point's day.
          items: { type: string, pattern: "^[0-9]+$" }
        sent:
          type: [array, "null"]
          description: One per point, in base units; the sum of final transfers out of the wallet during the point's day.
          items: { type: string, pattern: "^[0-9]+$" }
    CreateInvoiceRequest:
      type: object
      additionalProperties: false
      description: Either chainId, token and amount (fixed), or amountUsd alone (payer chooses).
      properties:
        lines:
          type: array
          maxItems: 100
          description: |
            Optional line items (R-88) that add up exactly to amount or amountUsd, else 422. unitPrice is in the
            amount's own unit: base units with amount, a USD decimal with amountUsd; each unitPrice and each
            quantity times it must be a whole number of the token's smallest unit. Part of the idempotency hash
            ("7.5" and "7.50" are the same quantity).
          items:
            type: object
            additionalProperties: false
            required: [description, quantity, unitPrice]
            properties:
              description: { type: string, minLength: 1, maxLength: 200 }
              quantity:
                type: string
                pattern: "^[0-9]{1,7}(\\.[0-9]{1,2})?$"
                description: Above 0 and at most 1000000, with up to 2 decimals.
              unitPrice: { type: string }
        amountUsd:
          type: string
          pattern: "^[0-9]{1,60}(\\.[0-9]{1,18})?$"
          description: |
            Payer chooses: the amount in USD, at least 1.00, such as "12.50". 422 when an accepted token's decimals can't
            hold it exactly. The tokens the profile or its store has off are left out; none left is 422 (R-136).
        chainId: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        token:
          type: string
          description: |
            Contract of an enabled token on chainId; any letter case. A token the profile or its store has off is
            422 (R-136).
          pattern: "^0x[0-9a-fA-F]{40}$"
        amount:
          allOf: [{ $ref: "#/components/schemas/Uint256" }]
          description: Base units of the token, at least one whole token (1.00 USD).
        expiresIn:
          type: integer
          description: |
            Seconds until expiry. Left out with a dueDate, the checkout closes at the end of the 60th UTC day after it
            (R-152). That close stays within 15 minutes to 365 days from now. Otherwise it defaults to 3600, or to the
            store's defaultExpiresIn for a merchant invoice.
          minimum: 900
          maximum: 31536000
        title:
          type: string
          maxLength: 200
          description: Optional; empty means none. Lengths here and below count characters; no NUL.
        note:
          type: string
          maxLength: 2000
          description: Optional message to the payer; empty means none.
        dueDate:
          type: string
          format: date
          description: |
            Optional date the client should pay by (YYYY-MM-DD). Payment closes at expiresAt; without expiresIn that is
            60 days past this date (R-152).
        supplyDate:
          type: string
          format: date
          description: |
            Optional day the work was done or delivered (YYYY-MM-DD, R-89), which EU and UK VAT invoices show when it
            differs from the issue date. Part of the idempotency hash only when set.
        reference:
          type: string
          maxLength: 100
          description: |
            Optional PO number or reference of the client's (R-90), one line; their accounts team matches the invoice
            by it. Part of the idempotency hash only when set.
        agreedValue:
          type: object
          additionalProperties: false
          required: [currency, amount, date]
          description: |
            Optional price agreed with the client in fiat (R-93), typed by the owner (no exchange-rate API). currency
            is EUR or one the ECB publishes a daily reference rate for (D-82): AUD, BRL, CAD, CHF, CNY, CZK, DKK, GBP,
            HKD, HUF, IDR, ILS, INR, ISK, JPY, KRW, MXN, MYR, NOK, NZD, PHP, PLN, RON, SEK, SGD, THB, TRY, USD, ZAR.
            Part of the idempotency hash only when set, in minor units ("1000" and "1000.00" EUR are the same).
          properties:
            currency: { type: string, pattern: "^[A-Z]{3}$" }
            amount:
              type: string
              description: Above 0, at most 12 whole digits and the currency's ISO 4217 decimals (0 for ISK, JPY, KRW).
            date: { type: string, format: date }
        senderName:
          type: string
          maxLength: 100
          description: |
            Optional name the payer sees, for an invoice without billing details such as a personal profile's request
            (D-52); empty means none.
        returnUrl:
          type: string
          maxLength: 2000
          description: |
            Optional https link to the creator's site, offered to the payer once paid (R-58, R-62); empty means none.
            No user or password in it. A merchant invoice's must start with one of its store's allowedOrigins (R-134).
        metadata:
          type: object
          maxProperties: 20
          propertyNames: { pattern: "^[A-Za-z0-9_-]{1,40}$" }
          additionalProperties: { type: string, maxLength: 500 }
          description: |
            Optional keys and values of the creator's own, set at create only (R-151, D-101). A value is plain text on
            one line. Part of the idempotency hash only when set.
        reminders:
          type: boolean
          description: |
            Optional. true turns payment reminders on at once, as setReminders does (R-97); it needs dueDate and
            client.email, otherwise 422. Part of the idempotency hash only when true.
        storeId:
          type: string
          format: uuid
          description: |
            Optional (R-134). The merchant profile's store the invoice records; left out, the profile's first store.
            Not one of the profile's stores, or sent for a personal or freelancer profile: 422. Part of the idempotency
            hash only when set.
        replaces:
          allOf: [{ $ref: "#/components/schemas/InvoiceId" }]
          description: |
            Optional (R-129). The profile's invoice this one replaces: it is canceled in the same transaction with
            Cancel's checks, else 409 invoice_not_cancelable and nothing is made; another profile's or an unknown
            invoice is 404. Part of the idempotency hash only when set.
        repeat:
          type: object
          additionalProperties: false
          description: |
            Optional. Makes the invoice repeat every month (R-98, D-58): each later month's invoice is due on the
            dueDate's day (the month's last day when shorter). The worker makes it 7 UTC days before that due date,
            with the checkout open 60 days past it (D-80), and emails it to client.email unless the user's client
            email cap is used up (R-116). A month whose due date
            passed unmade is skipped. It needs dueDate and client.email, otherwise 422; a profile has at most 50
            running. Part of the idempotency hash only when set.
          properties:
            endDate:
              type: string
              format: date
              description: Optional last due date a month may have, on or after dueDate; empty or left out repeats until stopped.
        client:
          type: object
          additionalProperties: false
          description: Optional; who the invoice is for. Each empty field means none.
          properties:
            name: { type: string, maxLength: 200 }
            email:
              type: string
              maxLength: 254
              description: A plain address like name@example.com, without a display name.
            address:
              type: string
              maxLength: 500
              description: Postal address; may have line breaks.
            country:
              type: string
              pattern: "^([A-Z]{2})?$"
              description: An assigned ISO 3166-1 alpha-2 code in upper case, like DE.
            taxId: { type: string, maxLength: 50, description: The client's tax or VAT ID; shown on the invoice PDF. }
    CreateJobRequest:
      type: object
      additionalProperties: false
      required: [title, client, payments]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        scope:
          type: string
          maxLength: 5000
          description: Optional; the work, in plain text with line breaks. Empty means none.
        client:
          type: object
          additionalProperties: false
          required: [name, email]
          description: Who pays; the rules of a saved client (R-86). Payments are billed to email.
          properties:
            name: { type: string, minLength: 1, maxLength: 200 }
            email: { type: string, minLength: 1, maxLength: 254 }
            address: { type: string, maxLength: 500 }
            country: { type: string, description: "An assigned ISO 3166-1 alpha-2 code; empty means none" }
            taxId: { type: string, maxLength: 50 }
        payments:
          type: array
          minItems: 1
          maxItems: 10
          description: The schedule, in order. The total is their sum.
          items:
            type: object
            additionalProperties: false
            required: [title, amountUsd, dueDays]
            properties:
              title: { type: string, minLength: 1, maxLength: 100 }
              amountUsd: { type: string, pattern: "^[0-9]{1,10}(\\.[0-9]{1,2})?$", description: "Above 0" }
              dueDays: { type: integer, minimum: 0, maximum: 90, description: "Days to pay after the invoice is made" }
              onAccept:
                type: boolean
                description: The deposit, made when the client accepts; only the first payment can be.
    JobPayment:
      type: object
      required: [position, title, amountUsd, dueDays, onAccept, invoiceId, payToken, number, status, doneAt, deliveryLink,
        invoicedAt, paidAt, proposedAt, acceptedName, acceptedAt]
      description: |
        One payment; invoiceId, payToken, number, status and invoicedAt are null until its invoice is made, doneAt
        and deliveryLink until the owner marks its step done (the deposit is made at acceptance, so it has neither),
        and paidAt until its invoice is paid.
      properties:
        position: { type: integer, minimum: 1, maximum: 10 }
        title: { type: string }
        amountUsd: { type: string, description: "With 2 decimals, like 300.00" }
        dueDays: { type: integer }
        onAccept: { type: boolean }
        invoiceId: { oneOf: [{ $ref: "#/components/schemas/InvoiceId" }, { type: "null" }] }
        payToken: { oneOf: [{ $ref: "#/components/schemas/PayToken" }, { type: "null" }] }
        number: { type: [integer, "null"] }
        status: { type: [string, "null"], enum: [open, confirming, paid, settled, expired, canceled, null] }
        doneAt: { type: [string, "null"], format: date-time }
        deliveryLink: { type: [string, "null"] }
        invoicedAt: { type: [string, "null"], format: date-time, description: "When its invoice was made (R-104)" }
        paidAt:
          type: [string, "null"]
          format: date-time
          description: The invoice's paidAt (R-104), the block time of the transfer that completed it; null until paid
        proposedAt:
          type: [string, "null"]
          format: date-time
          description: When the owner proposed it as a scope change (R-105), with microseconds; null for the quote's payments
        acceptedName: { type: [string, "null"], description: "The client's typed name, once they accepted the change" }
        acceptedAt: { type: [string, "null"], format: date-time }
    PublicJob:
      type: object
      required: [title, scope, issuer, payments, totalUsd, acceptedName, acceptedAt, createdAt]
      description: A job as its client's link shows it.
      properties:
        title: { type: string }
        scope: { type: [string, "null"] }
        issuer: { $ref: "#/components/schemas/Issuer" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/JobPayment" }
        totalUsd: { type: string, description: "The sum of the payments the client agreed to, with 2 decimals (R-105)" }
        acceptedName: { type: [string, "null"], description: "The client's typed name, once accepted" }
        acceptedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    Job:
      description: A job read by its owner, with its id, link token, client and the client's typed email.
      allOf:
        - $ref: "#/components/schemas/PublicJob"
        - type: object
          required: [jobId, token, client, acceptedEmail]
          properties:
            jobId: { type: string, format: uuid }
            token: { type: string, pattern: "^[0-9a-f]{64}$" }
            client:
              type: object
              required: [name, email, address, country, taxId]
              properties:
                name: { type: string }
                email: { type: string }
                address: { type: [string, "null"] }
                country: { type: [string, "null"], pattern: "^[A-Z]{2}$" }
                taxId: { type: [string, "null"] }
            acceptedEmail: { type: [string, "null"] }
            payments:
              type: array
              description: |
                The payments, each with the email the client typed to accept it when it is a change, and whether the
                client was emailed about the change (R-107).
              items:
                allOf:
                  - $ref: "#/components/schemas/JobPayment"
                  - type: object
                    required: [acceptedEmail, clientEmailed]
                    properties:
                      acceptedEmail: { type: [string, "null"] }
                      clientEmailed:
                        type: boolean
                        description: An email about this change was queued for the client; false for the quote's payments and past a cap in any 24 hours
    JobSummary:
      type: object
      required: [jobId, title, clientName, totalUsd, payments, paid, acceptedAt, createdAt]
      properties:
        jobId: { type: string, format: uuid }
        title: { type: string }
        clientName: { type: string }
        totalUsd: { type: string }
        payments: { type: integer, description: "How many payments the client agreed to (R-105)" }
        paid: { type: integer, description: "How many of them are paid or settled" }
        acceptedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    Invoices:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InvoiceSummary" }
        nextCursor:
          type: [string, "null"]
          description: Pass as cursor for the next page; null on the last page.
    DepositSummary:
      type: object
      description: Exact totals for all non-reorged transfers, including those outside the deposit preview.
      required: [count, onTimeAmount, lateAmount, pendingAmount]
      properties:
        count: { type: integer, minimum: 0 }
        onTimeAmount: { type: string, pattern: "^[0-9]+$" }
        lateAmount: { type: string, pattern: "^[0-9]+$" }
        pendingAmount:
          type: string
          pattern: "^[0-9]+$"
          description: On-time base units without a deposit or reopen booking.
    Invoice:
      description: An invoice read alone or just created, with its deposits.
      allOf:
        - $ref: "#/components/schemas/InvoiceSummary"
        - type: object
          required: [paidAt, settledAt, deposits, options, nextCheckAt, lines, updates, replacedBy]
          properties:
            paidAt:
              type: [string, "null"]
              format: date-time
              description: |
                Once paymentStatus is paid: the block time of the deposit that completed the amount, as on the
                receipt PDF. null before.
            settledAt:
              type: [string, "null"]
              format: date-time
              description: |
                Once settlementStatus is settled: when the settlement was recorded as final (the ledger's settlement
                entry). null before.
            canceledAt:
              type: [string, "null"]
              format: date-time
              description: When the owner canceled it (paymentStatus canceled); null otherwise.
            depositSummary: { $ref: "#/components/schemas/DepositSummary" }
            deposits:
              type: array
              maxItems: 100
              description: |
                Bounded preview of non-reorged transfers in chain order; empty on create.
                Includes 95 recent transfers plus first on-time payment, last credited payment,
                slowest confirmations and oldest unbooked confirmed transfer. Use depositSummary for totals.
              items: { $ref: "#/components/schemas/Deposit" }
            nextCheckAt:
              type: [string, "null"]
              format: date-time
              description: When Check status may run again (R-55); null when it may now.
            lines:
              type: array
              description: |
                The invoice's line items in order (R-88), empty without a breakdown. Money is in the base units of the
                option whose optionId is the invoiceId; quantity has 2 decimals ("7.50").
              items:
                type: object
                required: [description, quantity, unitPrice, amount]
                properties:
                  description: { type: string }
                  quantity: { type: string }
                  unitPrice: { $ref: "#/components/schemas/Uint256" }
                  amount: { $ref: "#/components/schemas/Uint256" }
            options:
              type: array
              description: |
                Every token and network the invoice accepts, ordered by chain and symbol: one for a fixed invoice. Each
                has its own on-chain id (in its terms instead of invoiceId), amount and receive address; recipient,
                expiresAt and settleDeadline are the invoice's.
              items:
                type: object
                required: [optionId, chainId, network, token, symbol, decimals, amount, receiveAddress, closesAt, deposits]
                properties:
                  amounts: { $ref: "#/components/schemas/PaymentAmounts" }
                  closesAt: { type: string, format: date-time, description: This receiver option's effective close. }
                  optionId: { $ref: "#/components/schemas/InvoiceId" }
                  chainId: { type: integer }
                  network: { type: string, description: The chain's name, such as base-sepolia. }
                  token: { $ref: "#/components/schemas/Address" }
                  symbol: { type: string }
                  decimals: { type: integer, minimum: 0 }
                  amount: { $ref: "#/components/schemas/Uint256" }
                  receiveAddress: { $ref: "#/components/schemas/Address" }
                  depositSummary: { $ref: "#/components/schemas/DepositSummary" }
                  deposits:
                    type: array
                    maxItems: 100
                    description: |
                      Bounded transfer preview with the same selection as the invoice deposits.
                      On an option other than the shown one they are held for the payer (D-76).
                    items: { $ref: "#/components/schemas/Deposit" }
            replacedBy:
              description: |
                R-129. The invoice a Revise replaced this canceled one with, and its pay link; null when none.
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/Revision"
            updates:
              type: array
              description: |
                R-128. The edits the payer sees, newest first: the reference, note or due date changed before any
                payment. from and to are a due date's old and new value, null for the other fields.
              items:
                type: object
                required: [at, field, from, to]
                properties:
                  at: { type: string, format: date-time }
                  field: { type: string, enum: [reference, note, dueDate] }
                  from: { type: [string, "null"], format: date }
                  to: { type: [string, "null"], format: date }
            settlementWait:
              description: |
                Only in the owner's responses (create and the profile's GET); the public GET leaves it out. Why a paid
                invoice's money has not reached the profile wallet yet (R-54); null when it is not paid or already
                settled. signing: the signer settles it on its next round. finalizing: the settle was sent and counts
                once its block is final; secondsLeft estimates the chain time left. retrying: a temporary condition;
                tried again at until. dailyLimit: the user's sponsored settlements for 24 hours are used up; tried
                again at until. refused: the signer refused the terms and an operator looks at it.
              oneOf:
                - type: "null"
                - type: object
                  required: [kind, until, secondsLeft]
                  properties:
                    kind: { type: string, enum: [signing, finalizing, retrying, dailyLimit, refused] }
                    until: { type: [string, "null"], format: date-time }
                    secondsLeft: { type: [integer, "null"], minimum: 0 }
            reminders:
              type: object
              description: |
                Only in the owner's responses; the public GET leaves it out. The payment reminders (R-96): on, when the
                client stopped them (null until then), and each reminder queued, oldest first, with its step.
              required: [on, stoppedAt, emails]
              properties:
                on: { type: boolean }
                stoppedAt: { type: [string, "null"], format: date-time }
                emails:
                  type: array
                  items:
                    type: object
                    required: [step, requestedAt, sentAt, failedAt]
                    properties:
                      step: { type: string, enum: [before, due, after] }
                      requestedAt: { type: string, format: date-time }
                      sentAt: { type: [string, "null"], format: date-time }
                      failedAt: { type: [string, "null"], format: date-time }
            retainer:
              description: |
                Only in the owner's responses; the public GET leaves it out. The retainer the invoice belongs to
                (R-98), on each of its invoices; null when it doesn't repeat. nextDueDate is the next invoice's due
                date and nextOn the UTC day the worker makes and emails it; both null once it ended or stopped.
              oneOf:
                - type: "null"
                - type: object
                  required: [endDate, nextDueDate, nextOn, stoppedAt]
                  properties:
                    endDate: { type: [string, "null"], format: date }
                    nextDueDate: { type: [string, "null"], format: date }
                    nextOn: { type: [string, "null"], format: date }
                    stoppedAt: { type: [string, "null"], format: date-time }
            sends:
              type: array
              description: |
                Only in the owner's responses; the public GET leaves it out. Each Send to client (R-94), oldest first.
                sentAt is when the worker sent the email and failedAt when it gave up; both null while it waits.
              items:
                type: object
                required: [requestedAt, sentAt, failedAt]
                properties:
                  requestedAt: { type: string, format: date-time }
                  sentAt: { type: [string, "null"], format: date-time }
                  failedAt: { type: [string, "null"], format: date-time }
            history:
              type: array
              description: |
                Only in the owner's responses; the public GET leaves it out. Every change to the invoice (R-123, R-124),
                newest first. kind is invoice.created, invoice.canceled, payer.email_given, payer.option_chosen, payer.option_picked,
                invoice.held, invoice.settlement_queued, invoice.settled, "invoice." and the new payment status,
                reminders.on, reminders.off, reminders.stopped, repeat.stopped, email.invoice_, email.reminder_ or
                email.receipt_ and sent or failed (R-126), invoice.edited (R-127), invoice.replaced (R-129),
                invoice.reopened (R-130), whose until is the new close, invoice.numbered (R-141), when a payment-link
                invoice took its number with its first deposit, or invoice.return_queued and invoice.return_released,
                when support queues or drops a return of held money (PLAN 11.10.3).
                actor system is Forwend. optionId names the option chosen, or the one money is held on, when the payer
                chooses; amount is the base units held, in that option's token, else the shown option's; txHash is the
                settle transaction; step is a reminder email's step; field is the edited field, and from and to
                an edited due date's old and new value. On invoice.return_queued, amount is the return and to its
                destination. related is the other invoice of a Revise: on invoice.replaced
                the new one, on the new one's invoice.created the old one.
              items:
                type: object
                required: [id, kind, actor, at, optionId, amount, txHash, step, field, from, to, until, related]
                properties:
                  id: { type: integer, minimum: 1, description: Ascending in the order the rows were written. }
                  kind: { type: string, pattern: "^[a-z]+\\.[a-z_]+$" }
                  actor: { type: string, enum: [owner, payer, system] }
                  at: { type: string, format: date-time }
                  optionId: { type: [string, "null"], pattern: "^0x[0-9a-f]{64}$" }
                  amount: { type: [string, "null"], pattern: "^[0-9]+$" }
                  txHash: { type: [string, "null"], pattern: "^0x[0-9a-f]{64}$" }
                  step: { type: [string, "null"], enum: [before, due, after, null] }
                  field: { type: [string, "null"], enum: [memo, clientEmail, returnUrl, reference, note, dueDate, null] }
                  from: { type: [string, "null"], format: date }
                  to: { type: [string, "null"], format: date }
                  until: { type: [string, "null"], format: date-time }
                  related: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/Revision" }] }
            reopenUntil:
              type: [string, "null"]
              format: date-time
              description: Only in the owner's responses. The close a reopen would give now (R-130); null when it can't reopen.
            replaces:
              description: Only in the owner's responses. The invoice this one replaced (R-129); null when none.
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/Revision"
            memo:
              type: [string, "null"]
              description: Only in the owner's responses; the public GET leaves it out. The owner's own note (R-127).
            views:
              type: object
              description: |
                Only in the owner's responses; the public GET leaves it out. Pay page loads (R-125): how many, the first
                and the last; both times are null before the first load.
              required: [count, firstAt, lastAt]
              properties:
                count: { type: integer, minimum: 0 }
                firstAt: { type: [string, "null"], format: date-time }
                lastAt: { type: [string, "null"], format: date-time }
    Revision:
      type: object
      description: The other invoice of a Revise (R-129). payToken is the replacement's pay link, null otherwise.
      required: [invoiceId, number, payToken]
      properties:
        invoiceId: { $ref: "#/components/schemas/InvoiceId" }
        number: { type: integer, minimum: 1 }
        payToken: { oneOf: [{ type: "null" }, { $ref: "#/components/schemas/PayToken" }] }
    InvoiceSummary:
      type: object
      required: [purpose, documentKind, invoiceId, payToken, optionId, optionLocked, optionCount, confirming, closed, number, title, note, dueDate, supplyDate, reference, agreedValue, senderName, returnUrl, issuer, chainId,
        livemode, token, amount, recipient, factory, receiveAddress, expiresAt, closesAt, settleDeadline, paymentStatus,
        settlementStatus, refundStatus, settlementTxHash, createdAt, brand]
      description: |
        With several options (payer chooses), the terms and statuses are the current option's: the one that received
        money first, else the first listed.
      properties:
        amounts: { $ref: "#/components/schemas/PaymentAmounts" }
        purpose:
          type: string
          enum: [invoice, checkout, request]
          description: Immutable workflow purpose, independent of attached billing documents.
        documentKind:
          type: string
          enum: [invoice, request, none]
          description: Legacy checkout attempts retain invoice documents. New checkout sessions have none.
        linkId:
          type: string
          format: uuid
          description: Source payment link, on owner reads only when present.
        invoiceId:
          allOf: [{ $ref: "#/components/schemas/InvoiceId" }]
          description: >-
            keccak256 of payToken; random for an invoice made before D-86. The chain shows it, so it opens no public
            route.
        payToken:
          oneOf: [{ $ref: "#/components/schemas/PayToken" }, { type: "null" }]
          description: The pay link's token; null for an invoice made before D-86, which has no pay link.
        optionId:
          allOf: [{ $ref: "#/components/schemas/InvoiceId" }]
          description: The on-chain id in the terms below; invoiceId for a fixed invoice.
        optionCount:
          type: integer
          minimum: 1
          description: How many tokens and networks the invoice accepts; 1 for a fixed invoice.
        confirming:
          type: boolean
          description: >-
            A payment made before the close (closesAt) is seen and not final yet. A partially_paid invoice keeps that
            status while the rest confirms, so show it as confirming. Also true once the whole amount is credited and
            the finalized balance check is pending.
        closed:
          type: boolean
          description: >-
            The checkout closed and the invoice can no longer be paid: open, detected or partially_paid, past closesAt,
            with no payment made before the close still confirming and less than the amount paid before it (money after
            the close reads detected until the chain is final). Before an option is chosen, every option's money
            counts, each against its own amount. Its paymentStatus
            changes once the chain is final past the close; show it as expired (or expired, partially paid) meanwhile.
        optionLocked:
          type: boolean
          description: |
            An option's final payments added up to 1.00 USD, so it is the invoice's for good; money sent to any other
            option, or less than that before the choice, is held for the payer (D-76).
        pickedOptionId:
          oneOf: [{ type: "null" }, { $ref: "#/components/schemas/InvoiceId" }]
          description: |
            The option the payer last picked with Show address (R-57), null before a pick. It only shows the pick;
            payments that add up to 1.00 USD decide the option (R-56).
        number:
          type: [integer, "null"]
          minimum: 1
          description: |
            The profile's invoice number, from 1 in creation order, never changed. Clients show it as INV- and at
            least 4 digits: 1 is INV-0001. Null only on the pay page's read of a payment-link invoice before its
            first deposit (R-141); the owner's reads don't find such an invoice.
        title: { type: [string, "null"] }
        note: { type: [string, "null"] }
        dueDate:
          type: [string, "null"]
          format: date
        supplyDate:
          type: [string, "null"]
          format: date
        reference: { type: [string, "null"] }
        agreedValue:
          description: The price agreed with the client in fiat (R-93); null without one.
          oneOf:
            - type: "null"
            - type: object
              required: [currency, amount, decimals, date]
              properties:
                currency: { type: string }
                amount: { type: string, pattern: "^[0-9]+$", description: In the currency's minor units, like cents. }
                decimals: { type: integer, minimum: 0, description: The currency's ISO 4217 decimals. }
                date: { type: string, format: date }
        senderName:
          type: [string, "null"]
          description: The name the payer sees when there is no issuer. In every response, the public GET too.
        returnUrl:
          type: [string, "null"]
          description: The creator's https link for the payer once paid. In every response, the public GET too.
        metadata:
          type: object
          additionalProperties: { type: string }
          description: The create's metadata, {} when none was sent (R-151). Only in the owner's responses.
        client:
          type: object
          required: [name, email, address, country, taxId]
          description: Only in the owner's responses (create, list and the profile's GET); the public GET leaves it out.
          properties:
            name: { type: [string, "null"] }
            email: { type: [string, "null"] }
            address: { type: [string, "null"] }
            country: { type: [string, "null"] }
            taxId: { type: [string, "null"] }
        store:
          type: object
          required: [storeId, name]
          description: |
            A merchant invoice's store (R-134), only in the owner's responses; left out for a personal or freelancer
            profile's invoice and in the public GET. It never changes.
          properties:
            storeId: { type: string, format: uuid }
            name: { type: string }
        brand:
          type: [object, "null"]
          required: [storeId, color, logoAt]
          description: |
            A merchant invoice's store branding (R-135), in every response, the public GET too; null for a personal or
            freelancer profile's invoice. The logo is at /v1/stores/{storeId}/logo.png while logoAt is set.
          properties:
            storeId: { type: string, format: uuid }
            color: { type: [string, "null"], pattern: "^#[0-9a-f]{6}$" }
            logoAt: { type: [string, "null"], format: date-time }
        issuer:
          description: |
            The profile's billing details as they were when the invoice was made; null when it had none. Editing the
            details later does not change it. In every response, the public GET too.
          oneOf:
            - $ref: "#/components/schemas/Issuer"
            - type: "null"
        chainId: { type: integer }
        livemode:
          type: boolean
          description: The chain's mode (D-87, R-143). False on a testnet, whose tokens have no value.
        token: { $ref: "#/components/schemas/Address" }
        amount: { $ref: "#/components/schemas/Uint256" }
        recipient:
          allOf: [{ $ref: "#/components/schemas/Address" }]
          description: The profile wallet that settlement pays.
        factory: { $ref: "#/components/schemas/Address" }
        receiveAddress:
          allOf: [{ $ref: "#/components/schemas/Address" }]
          description: Where the payer sends the token; factory.predict of these terms.
        expiresAt: { type: string, format: date-time, description: The terms' expiry, which the receive address commits to. }
        closesAt:
          type: string
          format: date-time
          description: When the checkout closes. expiresAt, or the reopened close once the owner reopened it (R-130).
        settleDeadline:
          type: string
          format: date-time
          description: expiresAt + 7 days (24 h for invoices made before this window; D-18).
        paymentStatus:
          type: string
          enum: [open, detected, partially_paid, paid, expired, expired_partially_paid, canceled]
        settlementStatus:
          type: string
          enum: [none, pending, settled]
        refundStatus:
          type: string
          enum: [none, held, refund_pending, refunded]
        settlementTxHash:
          type: [string, "null"]
          pattern: "^0x[0-9a-f]{64}$"
          description: |
            The signer's settle transaction once settlementStatus is settled. null before, and when the receiver was
            settled outside the signer (by the refund authority after the deadline).
        createdAt: { type: string, format: date-time }
    Deposit:
      type: object
      required: [txHash, logIndex, from, amount, blockNumber, blockTime, status, late, paid, blocksLeft, blocksTotal, secondsLeft]
      properties:
        txHash: { type: string, pattern: "^0x[0-9a-f]{64}$" }
        logIndex: { type: integer, minimum: 0 }
        from:
          allOf: [{ $ref: "#/components/schemas/Address" }]
          description: The sender of the transfer, from its Transfer log.
        amount: { $ref: "#/components/schemas/Uint256" }
        blockNumber: { type: integer, minimum: 0 }
        blockTime:
          type: string
          format: date-time
          description: The time of the transfer's block, UTC.
        status:
          type: string
          enum: [detected, confirmed]
          description: confirmed once the block is at or below the chain's finalized block (D-45).
        late:
          type: boolean
          description: Block time after the close (closesAt); held for the payer unless the owner reopens the invoice (R-130).
        paid:
          type: [string, "null"]
          pattern: "^[0-9]+$"
          description: >-
            The part the ledger booked to the creator for the deposit (R-121): all of it, the part that completed the
            amount, or 0 when it was held for the payer. A reopen adds the held part it gives back (R-130). Null until
            the ledger books it. An expired partial payment keeps its paid part here, though the expiry later holds it
            for the payer.
        blocksLeft:
          type: integer
          minimum: 0
          description: Blocks until the deposit's block is final; 0 when confirmed.
        blocksTotal:
          type: integer
          minimum: 0
          description: >-
            Blocks the deposit had to wait when first seen, at least blocksLeft; fixed across reads, so blocksTotal -
            blocksLeft is how many passed. 0 when confirmed.
        secondsLeft:
          type: integer
          minimum: 0
          description: Estimated seconds until final, from the chain's finalized block time; 0 when confirmed.
    Send:
      type: object
      required: [sendId, chainId, token, symbol, decimals, from, to, toProfileId, amount, status, final, txHash, failure,
        networkFee, gas, warnings, createdAt]
      properties:
        sendId: { type: string, format: uuid }
        chainId: { type: integer }
        token: { type: string }
        symbol: { type: string }
        decimals: { type: integer, minimum: 0 }
        from: { type: string, description: The profile's wallet }
        to: { type: string }
        toProfileId: { type: [string, "null"], format: uuid, description: Set for a transfer to another of the owner's profiles }
        amount: { type: string, description: Base units }
        status:
          type: string
          enum: [prepared, sending, sent, failed, canceled, expired]
          description: |
            sending: signed, not in a block yet. sent: its transfer is in a block. expired: never signed within 10
            minutes.
        final: { type: boolean, description: The block with its transfer can no longer change }
        txHash: { type: [string, "null"] }
        failure:
          type: [string, "null"]
          enum: [reverted, dropped, null]
          description: "reverted: mined without the transfer. dropped: not on the chain 30 minutes after it was signed."
        networkFee: { $ref: "#/components/schemas/SendFee" }
        gas:
          description: What the browser signs a wallet-paid send with, so it costs at most networkFee; null when Forwend pays.
          oneOf:
            - type: object
              required: [limit, maxFeePerGas, maxPriorityFeePerGas]
              properties:
                limit: { type: string }
                maxFeePerGas: { type: string, description: In the gas coin's wei }
                maxPriorityFeePerGas: { type: string }
            - type: "null"
        warnings:
          type: array
          description: Set when prepared. contract, the recipient has code; newRecipient, this wallet never sent there.
          items: { type: string, enum: [contract, newRecipient] }
        createdAt: { type: string, format: date-time }
    SendFee:
      type: object
      required: [amount, paidBy]
      properties:
        amount: { type: string, description: "The most the wallet pays, in the token's base units; 0 when Forwend pays" }
        paidBy: { type: string, enum: [forwend, wallet] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [malformed_request, unauthorized, reauth_required, forbidden, not_signed_up, invoice_not_found, job_not_found, job_accepted, job_not_accepted, payment_out_of_order, change_not_accepted, change_pending, job_finished, payment_not_withdrawable, transaction_not_found, not_labelable, too_many_transactions,
                billing_details_not_found, billing_details_required, client_not_found, store_not_found, not_merchant, logo_not_found, idempotency_conflict, invoice_not_paid,
                invoice_not_cancelable, invoice_not_editable, invoice_not_reopenable, receipt_sent, client_email_required, invoice_closed, due_date_required,
                reminders_stopped, member_not_found, invite_not_found, invite_for_another_email, already_on_team,
                link_not_found, personal_profile, link_off, link_ended, link_full, invalid_api_key, key_not_found,
                endpoint_not_found, webhooks_not_configured, delivery_not_found, send_not_found, send_in_progress,
                transfer_refused,
                invalid_value, rate_limited, network_not_ready, network_unavailable, internal]
            message: { type: string }
  responses:
    SendNotFound:
      description: No such send of this profile (send_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MalformedRequest:
      description: Not parseable, unknown field, wrong type, or missing Idempotency-Key (malformed_request)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ReauthRequired:
      description: |
        Missing or invalid access token, or one issued before Sign out everywhere (unauthorized). Or the token is not
        from a sign-in in the last 15 minutes: a refresh doesn't count (reauth_required, R-137).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: |
        Missing or invalid access token, or one issued before Sign out everywhere (unauthorized). An unknown, revoked
        or expired API key is invalid_api_key (R-144).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        The user is neither the profile's owner nor a member whose role has the route's permission, or the profile
        does not exist (forbidden, R-138). An API key gets it for a scope it lacks, another profile or a fresh sign-in.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IdempotencyConflict:
      description: The Idempotency-Key was used with other values (idempotency_conflict)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CreateInvoiceConflict:
      description: |
        The Idempotency-Key was used with other values (idempotency_conflict), or a freelancer or merchant profile has
        no billing details yet (billing_details_required, R-92); a personal profile's request needs none. With
        replaces, the invoice it replaces can no longer be canceled (invoice_not_cancelable, R-129).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidValue:
      description: |
        A value breaks a rule (invalid_value): amount, expiresIn, a token or chain that is not enabled, a profile with
        no wallet for the chain, terms the contract would refuse to settle, an invoice title, note, due or supply date,
        line item, agreed value or client field, a job field or payment, a typed name or email on acceptance, a
        profile kind or name, a billing details field, a list limit, cursor, status, direction or search (q), or
        balance-history days.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotSignedUp:
      description: The user has not called POST /v1/me yet (not_signed_up)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvoiceNotFound:
      description: No invoice with this id (invoice_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TransactionNotFound:
      description: The profile's wallet has no such transfer (transaction_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotLabelable:
      description: An invoice payment, a transfer between the user's profiles or money out takes no label (not_labelable)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    JobNotFound:
      description: No job with this id or link token (job_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MarkDoneConflict:
      description: |
        The client has not accepted the job yet (job_not_accepted), an earlier payment has no invoice yet
        (payment_out_of_order), the client has not accepted this change yet (change_not_accepted), or the final payment
        waits for a change the client has not accepted (change_pending).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ChangeConflict:
      description: |
        The Idempotency-Key was used with another change (idempotency_conflict), the client has not accepted the job yet
        (job_not_accepted), a change already waits for the client (change_pending), or the job's last payment is done
        (job_finished).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotWithdrawable:
      description: Only the last payment, a change the client has not accepted, can be withdrawn (payment_not_withdrawable)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    JobAccepted:
      description: The client accepted the job, so it can't be deleted (job_accepted)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CreateJobConflict:
      description: |
        The Idempotency-Key was used with other values (idempotency_conflict), or the profile has no billing details
        yet (billing_details_required): the job copies them as the issuer.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ClientNotFound:
      description: The profile has no client with this id (client_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StoreNotFound:
      description: The store belongs to another profile (store_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ProfileTokens:
      description: The enabled tokens, by chain id, with the profile's switch
      content:
        application/json:
          schema:
            type: object
            required: [tokens]
            properties:
              tokens:
                type: array
                items: { $ref: "#/components/schemas/TokenSwitch" }
    LogoNotFound:
      description: No store with this id has a logo (logo_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DeliveryNotFound:
      description: This endpoint has no delivery of that event (delivery_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EndpointNotFound:
      description: No webhook endpoint of this profile has this id (endpoint_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    WebhooksNotConfigured:
      description: The server has no WEBHOOK_SECRET_KEY, so webhooks are off (webhooks_not_configured)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    KeyNotFound:
      description: No working API key of this profile has this id (key_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PublicLinkNotFound:
      description: No payment link has this slug (link_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    LinkNotFound:
      description: No payment link of this profile, in the user's stores, has this id (link_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MemberNotFound:
      description: No member of this profile has this id (member_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InviteNotFound:
      description: The invite is used, revoked, expired or unknown (invite_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotMerchant:
      description: Only a merchant profile has stores and a team (not_merchant)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BillingDetailsNotFound:
      description: The profile has not saved billing details yet (billing_details_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PickLocked:
      description: Money was seen on the invoice, so its option no longer changes (pick_locked)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ReceiptSent:
      description: The receipt already went to the address given (receipt_sent)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvoiceNotCancelable:
      description: Money was seen, the checkout closed, or the invoice is no longer open (invoice_not_cancelable)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvoiceNotReopenable:
      description: Not closed partly paid, reopened before, a refund under way, or less than a day before its receiver's settle deadline (invoice_not_reopenable)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvoiceNotEditable:
      description: The reference, note or due date changed after money was seen or the checkout closed (invoice_not_editable)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RemindersConflict:
      description: |
        Turning on needs an invoice the payer can still pay (invoice_closed), a due date (due_date_required) and a client
        email (client_email_required), and is refused after the client stopped them (reminders_stopped).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SendConflict:
      description: |
        The Idempotency-Key was used for another invoice (idempotency_conflict), the invoice has no client email
        (client_email_required), or the payer can no longer pay it: paid, expired, its checkout closed, or canceled
        (invoice_closed).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvoiceNotPaid:
      description: The invoice is not paid, so it has no receipt yet (invoice_not_paid)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Pdf:
      description: The PDF, as a download
      headers:
        Content-Disposition:
          description: attachment; filename="forwend-INV-0001-invoice.pdf" (or -receipt.pdf)
          schema: { type: string }
        ETag:
          description: A hash of the bytes; send it as If-None-Match to get 304 while nothing changed.
          schema: { type: string }
        Cache-Control:
          description: |
            private, no-cache. Revalidate with the ETag. A paid receipt doesn't change: later money is held for the
            payer (R-121), and the settlement is not on it.
          schema: { type: string }
      content:
        application/pdf:
          schema: { type: string, format: binary }
    NetworkNotReady:
      description: |
        The network is starting (network_not_ready): the worker has not scanned it yet, so a payment made now could be
        missed. Try again in a minute.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: |
        Too many requests (rate_limited): per signed-in user on the routes that need a token, per client IP on the public
        ones (docs/backend/api.md#rate-limits). Wait Retry-After seconds before the next request.
      headers:
        Retry-After:
          description: Whole seconds until the next request is accepted.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: Unexpected error, no details (internal)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

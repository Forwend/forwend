          schema: {"type": "string", "enum": ["invoice", "checkout", "request", "payment_link"]}
        - name: status
          in: query
          schema: {"type": "string", "enum": ["open", "confirming", "paid", "settled", "expired", "canceled"]}
        - name: paymentStatus
          in: query
          schema: {"type": "string", "enum": ["open", "detected", "partially_paid", "paid", "expired", "expired_partially_paid", "canceled"]}
        - name: settlementStatus
          in: query
          schema: {"type": "string", "enum": ["none", "pending", "settled"]}
        - name: refundStatus
          in: query
          schema: {"type": "string", "enum": ["none", "held", "refund_pending", "refunded"]}
        - $ref: "#/components/parameters/PaymentState"
        - $ref: "#/components/parameters/PaymentWallet"
        - $ref: "#/components/parameters/PaymentReference"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: from
          in: query
          description: Inclusive UTC recorded day.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive UTC recorded day.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Authorized repeatable-read snapshot; observations never count as booked deltas.
          content:
            application/json:
              schema:
                type: "object"
                required: ["snapshotAt", "items", "nextCursor"]
                properties:
                  snapshotAt: { type: "string", format: "date-time" }
                  items:
                    type: "array"
                    items: { $ref: "#/components/schemas/PaymentMovement" }
                  nextCursor:
                    type: ["string", "null"]
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "404":
          description: Payment is outside the caller's profile, stores or mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/profiles/{profileId}/payments/reconciliation:
    get:
      operationId: getPaymentReconciliation
      summary: Reconcile payment balances by store, chain and token
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: storeId
          in: query
          schema: { type: string, format: uuid }
        - name: linkId
          in: query
          schema: { type: string, format: uuid }
        - name: source
          in: query
          schema: {"type": "string", "enum": ["invoice", "checkout", "request", "payment_link"]}
        - name: status
          in: query
          schema: {"type": "string", "enum": ["open", "confirming", "paid", "settled", "expired", "canceled"]}
        - name: paymentStatus
          in: query
          schema: {"type": "string", "enum": ["open", "detected", "partially_paid", "paid", "expired", "expired_partially_paid", "canceled"]}
        - name: settlementStatus
          in: query
          schema: {"type": "string", "enum": ["none", "pending", "settled"]}
        - name: refundStatus
          in: query
          schema: {"type": "string", "enum": ["none", "held", "refund_pending", "refunded"]}
        - $ref: "#/components/parameters/PaymentState"
        - $ref: "#/components/parameters/PaymentWallet"
        - $ref: "#/components/parameters/PaymentReference"
        - name: from
          in: query
          description: Inclusive UTC recorded day.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive UTC recorded day.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Authorized repeatable-read snapshot; observations never count as booked deltas.
          content:
            application/json:
              schema:
                type: "object"
                required: ["snapshotAt", "from", "to", "assets"]
                properties:
                  snapshotAt: { type: "string", format: "date-time" }
                  from: { type: "string", format: "date-time" }
                  to: { type: "string", format: "date-time" }
                  assets:
                    type: "array"
                    items: { $ref: "#/components/schemas/PaymentReconciliationAsset" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "404":
          description: Payment is outside the caller's profile, stores or mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/profiles/{profileId}/payments/{paymentId}/movements:
    get:
      operationId: listPaymentMovementsOfPayment
      summary: Read movement evidence for one permitted payment
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: storeId
          in: query
          schema: { type: string, format: uuid }
        - name: linkId

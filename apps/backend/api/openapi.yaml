openapi: 3.1.0
info:
  title: Forwend API
  version: 0.1.0
  description: |
    Stablecoin invoices. Rules: docs/backend/api.md. Money is a decimal string in base units next to chainId and
    token. Addresses are lowercase 0x hex. Times are RFC 3339 in UTC.
servers:
  - url: http://localhost:8080
    description: Local (pnpm --filter @forwend/backend api)
security:
  - privyAccessToken: []
  - secretApiKey: []
paths:
  /v1/profiles/{profileId}/checkout-sessions:
    get:
      operationId: listCheckoutSessions
      summary: List store-scoped checkout-sessions, including unnumbered attempts
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: storeId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Newest first by creation time and ID
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CheckoutSession" } }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Payment or checkout not found within the caller's profile, stores and mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Idempotency conflict, missing billing details, or checkout cannot expire after payment was seen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NetworkNotReady" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createCheckoutSession
      summary: Create one purchase attempt once per Idempotency-Key
      description: |
        Needs invoices.write. Requires an explicit store. API keys retain their store and mode.
        Exact retries replay immutable purchase terms; changed amount, items, reference, store or key mode conflict.
        No invoice number or invoice document is issued. A browser redirect never proves payment.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCheckoutSession" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        "200":
          description: Original attempt replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Payment or checkout not found within the caller's profile, stores and mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Idempotency conflict, missing billing details, or checkout cannot expire after payment was seen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NetworkNotReady" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/checkout-sessions/{sessionId}:
    get:
      operationId: getCheckoutSession
      summary: Read canonical checkout-sessions state within the caller's stores and mode
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: sessionId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InvoiceId" }
      responses:
        "200":
          description: Canonical state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Payment or checkout not found within the caller's profile, stores and mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Idempotency conflict, missing billing details, or checkout cannot expire after payment was seen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NetworkNotReady" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/checkout-sessions/{sessionId}/expire:
    post:
      operationId: expireCheckoutSession
      summary: Close an unpaid checkout without any observed payment
      description: |
        Needs invoices.write. Idempotent once expired. Payment seen or confirming refuses expiration with 409.
        Financial records and receive addresses remain unchanged. Later funds remain held for the payer.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: sessionId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InvoiceId" }
      responses:
        "200":
          description: Closed checkout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSession" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Payment or checkout not found within the caller's profile, stores and mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Idempotency conflict, missing billing details, or checkout cannot expire after payment was seen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NetworkNotReady" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/payments:
    get:
      operationId: listPayments
      summary: List store-scoped payments, including unnumbered attempts
      description: |
        q matches the order reference, title, customer name and email, payment ID, invoice number (INV-0004) and the
        main option's receive address. A whole transaction hash or receive address also finds the payment by its
        deposits, returns or any option.
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/ProfileId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: storeId
          in: query
          schema: { type: string, format: uuid }
        - name: linkId
          in: query
          schema: { type: string, format: uuid }
        - name: source
          in: query
          schema: {"type": "string", "enum": ["invoice", "checkout", "request", "payment_link"]}
        - name: status
          in: query
          schema: {"type": "string", "enum": ["open", "confirming", "paid", "settled", "expired", "canceled"]}
        - name: paymentStatus
          in: query
          schema: {"type": "string", "enum": ["open", "detected", "partially_paid", "paid", "expired", "expired_partially_paid", "canceled"]}
        - name: settlementStatus
          in: query
          schema: {"type": "string", "enum": ["none", "pending", "settled"]}
        - name: refundStatus
          in: query
          schema: {"type": "string", "enum": ["none", "held", "refund_pending", "refunded"]}
        - $ref: "#/components/parameters/PaymentState"
        - $ref: "#/components/parameters/PaymentWallet"
        - $ref: "#/components/parameters/PaymentReference"
      responses:
        "200":
          description: Newest first by creation time and ID
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Payment" } }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Payment or checkout not found within the caller's profile, stores and mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Idempotency conflict, missing billing details, or checkout cannot expire after payment was seen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NetworkNotReady" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/payments/{paymentId}:
    get:
      operationId: getPayment
      summary: Read canonical payments state within the caller's stores and mode
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: paymentId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InvoiceId" }
        - name: view
          in: query
          description: Summary includes the selected option, options with money, and recorded conflicts. Omit for all option diagnostics.
          schema: { type: string, enum: [summary] }
      responses:
        "200":
          description: Canonical state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentDetails" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Payment or checkout not found within the caller's profile, stores and mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Idempotency conflict, missing billing details, or checkout cannot expire after payment was seen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NetworkNotReady" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/payments/attention:
    get:
      operationId: getPaymentAttention
      summary: Read payment problems and permitted endpoint problems
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: storeId
          in: query
          schema: { type: string, format: uuid }
        - name: linkId
          in: query
          schema: { type: string, format: uuid }
        - name: source
          in: query
          schema: {"type": "string", "enum": ["invoice", "checkout", "request", "payment_link"]}
        - name: status
          in: query
          schema: {"type": "string", "enum": ["open", "confirming", "paid", "settled", "expired", "canceled"]}
        - name: paymentStatus
          in: query
          schema: {"type": "string", "enum": ["open", "detected", "partially_paid", "paid", "expired", "expired_partially_paid", "canceled"]}
        - name: settlementStatus
          in: query
          schema: {"type": "string", "enum": ["none", "pending", "settled"]}
        - name: refundStatus
          in: query
          schema: {"type": "string", "enum": ["none", "held", "refund_pending", "refunded"]}
        - $ref: "#/components/parameters/PaymentState"
        - $ref: "#/components/parameters/PaymentWallet"
        - $ref: "#/components/parameters/PaymentReference"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Authorized repeatable-read snapshot; observations never count as booked deltas.
          content:
            application/json:
              schema:
                type: "object"
                required: ["snapshotAt", "items", "nextCursor", "webhooks", "webhooksTruncated"]
                properties:
                  snapshotAt: { type: "string", format: "date-time" }
                  items:
                    type: "array"
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Payment"
                        - type: "object"
                          required: ["problems"]
                          properties:
                            problems:
                              type: "array"
                              items: { $ref: "#/components/schemas/PaymentProblem" }
                  nextCursor:
                    type: ["string", "null"]
                  webhooks:
                    type: "array"
                    items: { $ref: "#/components/schemas/PaymentWebhookProblem" }
                  webhooksTruncated: { type: "boolean" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "404":
          description: Payment is outside the caller's profile, stores or mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/profiles/{profileId}/payments/movements:
    get:
      operationId: listPaymentMovements
      summary: Read exact booked movements and separate observations
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: storeId
          in: query
          schema: { type: string, format: uuid }
        - name: linkId
          in: query

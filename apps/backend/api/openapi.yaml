  /v1/profiles/{profileId}/payments/{paymentId}/reconciliation:
    get:
      operationId: getReconciliationOfPayment
      summary: Reconcile one permitted payment
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: storeId

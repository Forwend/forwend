openapi: 3.1.0
info:
  title: Forwend API
  version: 0.1.0
  description: |
    Stablecoin invoices. Rules: docs/backend/api.md. Money is a decimal string in base units next to chainId and
    token. Addresses are lowercase 0x hex. Times are RFC 3339 in UTC.
servers:
  - url: http://localhost:8080
    description: Local (pnpm --filter @forwend/backend api)
security:
  - privyAccessToken: []
paths:
  /v1/me:
    post:
      operationId: signUp
      summary: Sign up once; makes the user, the personal profile and its wallet
      description: |
        Call after every sign-in. The first call makes the user and the personal profile with its Privy wallet (201).
        Later calls change nothing (200), except that they retry a wallet Privy failed to make. No Idempotency-Key:
        the user's token is the key.
      responses:
        "201":
          description: Signed up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "200":
          description: Signed up before; nothing changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    get:
      operationId: getMe
      summary: The signed-in user's profiles, oldest first
      responses:
        "200":
          description: The profiles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotSignedUp" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/me/onboarding:
    post:
      operationId: onboard
      summary: Make the first-run choice once; makes the chosen profiles and sets onboardedAt
      description: |
        R-50, D-53. Each choice needs a profile kind: receive_and_send the personal profile every user has,
        get_paid_by_clients a freelancer profile, accept_business_payments and build_integration one merchant profile
        (both together make one). The profiles and onboardedAt are written in one transaction, then each new profile
        gets its Privy wallet as at signup (walletAddress null if Privy fails; the next POST /v1/me makes it). An empty
        list is Skip: it only sets onboardedAt. The first call answers 201; every later call, with any choices, changes
        nothing and answers 200 with the same state. No Idempotency-Key: onboardedAt is the key.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingRequest" }
      responses:
        "201":
          description: Onboarded now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "200":
          description: Onboarded before; nothing changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotSignedUp" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles:
    post:
      operationId: createProfile
      summary: Create a freelancer or merchant profile with its own wallet, once per Idempotency-Key
      description: |
        Keys are per user. The same key with the same values returns the stored profile with 200; with other values, 409.
        If Privy fails, the profile is still created and returned with walletAddress null; the next POST /v1/me makes
        its wallet, so a retry never makes a second profile.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProfileRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "200":
          description: The same request was made before with this key; the stored profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotSignedUp" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/events:
    get:
      operationId: listEvents
      summary: The bell's events of the profile's invoices, newest first
      description: R-81. The same paid, settled and held-money events as the owner's email (R-80).
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
      responses:
        "200":
          description: The events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InvoiceEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/owed:
    get:
      operationId: listOwed
      summary: What clients still owe the profile, and money held for payers
      description: |
        R-95. The invoices the payer can still pay (the open status filter) that are overdue or partly paid, then each
        option with money held for the payer (D-26). Overdue rows come first, most days late first; then partly paid;
        then held.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The rows
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Owed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/notifications:
    get:
      operationId: getNotifications
      summary: The profile's owner email setting
      description: |
        R-80. email says whether the owner gets an email when one of this profile's invoices is paid, settled or gets
        money held for the payer. address is the account's verified login email (read once from Privy on POST /v1/me);
        null when the account has none.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notifications" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: putNotifications
      summary: Turn the profile's owner email on or off
      description: The address can't be set here; any other field is 400.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: boolean }
      responses:
        "200":
          description: The saved setting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notifications" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/billing-details:
    get:
      operationId: getBillingDetails
      summary: The profile's billing details
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The billing details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingDetails" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/BillingDetailsNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    put:
      operationId: putBillingDetails
      summary: Create or replace the profile's billing details
      description: |
        Replaces every field; only taxId is optional (left out or empty means none). Each new invoice keeps a copy as its issuer
        (R-43); invoices made earlier keep the copy they took.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingDetailsRequest" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingDetails" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/clients:
    get:
      operationId: listClients
      summary: The profile's saved clients, by name (R-86)
      description: At most 1000 per profile, so the list comes whole.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The saved clients
          content:
            application/json:
              schema:
                type: object
                required: [clients]
                properties:
                  clients:
                    type: array
                    items: { $ref: "#/components/schemas/Client" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/clients/{clientId}:
    put:
      operationId: putClient
      summary: Create or replace a saved client
      description: |
        The caller picks the id (a lowercase UUID), so the same request sent twice saves one client: 201 when it makes
        the client, 200 when it replaces every field. A new client is refused with 422 once the profile has 1000. An
        invoice copies the client's details when it is made (R-86); later edits change no invoice.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/ClientId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientRequest" }
      responses:
        "200":
          description: Replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ClientNotFound" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    delete:
      operationId: deleteClient
      summary: Delete a saved client; invoices keep their copy
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/ClientId"
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/ClientNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/invoices:
    get:
      operationId: listInvoices
      summary: The profile's invoices, newest first (highest number first), in cursor pages
      description: |
        Each item is the invoice without its deposits; GET /v1/invoices/{invoiceId} adds them. status and q narrow the
        list before paging, so a cursor continues the same filtered list. q looks in the number as shown (INV-0042),
        title, note, client name and email, receive address, reference and, when it is a number, the amount.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: limit
          in: query
          description: Items per page; default 50.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          description: nextCursor from the previous page.
          schema: { type: string }
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: One page; an empty list for a new profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoices" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createInvoice
      summary: Create an invoice once per Idempotency-Key
      description: |
        The recipient is the profile's wallet, never a request field. The receive address is computed from the terms
        (factory.predict). The same key with the same values returns the stored invoice with 200; with other values,
        409. The invoice gets the profile's next number in the same transaction (D-50): no gaps, and a repeat returns
        the same number. The insert also copies the profile's billing details as issuer (null without them). The number,
        title, note, due and supply dates, line items, agreed value, sender name, client and issuer never change after
        creation. Send chainId, token and amount for one fixed token and network, or amountUsd alone to let the payer
        choose (R-56): the invoice then accepts every enabled token on every chain the worker watches, each as its own
        option with the amount in its decimals at 1 USD per stablecoin (D-75), its own on-chain id and receive address
        (D-76). Each option counts toward the profile's limits on open receive addresses.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvoiceRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "200":
          description: The same request was made before with this key; the stored invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/CreateInvoiceConflict" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/NetworkNotReady" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/invoices/{invoiceId}:
    get:
      operationId: getProfileInvoice
      summary: Read one of the profile's invoices with its client
      description: The public GET /v1/invoices/{invoiceId} plus client. Another profile's invoice is not found here.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: invoiceId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InvoiceId" }
      responses:
        "200":
          description: The invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/invoices/{invoiceId}/cancel:
    post:
      operationId: cancelInvoice
      summary: Cancel one of the profile's invoices before any money arrives
      description: |
        R-79, D-79. Only while the invoice (every option of a payer-chooses one) is open, its checkout is still open
        and no transfer was ever seen for it. Canceled is final: the invoice keeps its number, page and PDFs, never
        settles, and money sent to it later is held for the payer (D-26). Answers the canceled invoice.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: invoiceId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InvoiceId" }
      responses:
        "200":
          description: The canceled invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "409": { $ref: "#/components/responses/InvoiceNotCancelable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/invoices/{invoiceId}/send:
    post:
      operationId: sendInvoice
      summary: Email one of the profile's invoices to its client
      description: |
        R-94. Queues one email to the invoice's client email, which the worker sends whatever the owner's email
        setting: the issuer, number, amount, due date, the pay page and the invoice PDF, with Reply-To set to the
        issuer's billing email. Only while the payer can still pay it (open or partly paid, checkout not closed). One
        send per invoice in 24 hours and 20 per profile in 24 hours; sends also share the limit for everyone with the
        payer's receipt address. The same key again answers 200 and queues nothing. Answers the invoice with its sends.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: invoiceId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InvoiceId" }
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "200":
          description: This key already queued it; nothing new is queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "409": { $ref: "#/components/responses/SendConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/balances:
    get:
      operationId: getBalances
      summary: The profile's money per enabled chain and token
      description: |
        The wallet balance is read at the second RPC's finalized block (D-15, D-45). Pending and held come from our
        records and are not part of the wallet balance.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: The balances
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Balances" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/activity:
    get:
      operationId: getActivity
      summary: The profile's invoices and deposits, newest first, in cursor pages
      description: |
        status and q narrow the list before paging, so a cursor continues the same filtered list. Under status, an
        invoice falls as in the invoice list; a deposit is open while detected and paid once confirmed, and a held one
        (held) under no status, only in the full list. q looks in the
        transaction hash (a deposit's, or a settled invoice's settle transaction), the token symbol and, when it is a
        number, the amount.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: limit
          in: query
          description: Items per page; default 50.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          description: nextCursor from the previous page.
          schema: { type: string }
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: One page; an empty list for a new profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/transactions:
    get:
      operationId: getTransactions
      summary: The profile wallet's token transfers, newest first, in cursor pages
      description: |
        Every Transfer of an enabled token from or to the profile's wallet on an enabled chain, as the worker records
        it (R-38), from the first scan that knows the wallet. A transfer between two profile wallets is out in one
        profile's list and in in the other's. Reorged transfers are left out. Ordered by block time, newest first.
        direction and q narrow the list before paging, so a cursor continues the same filtered list. q looks in the
        counterparty, transaction hash, token symbol and, when it is a number, the amount.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: limit
          in: query
          description: Items per page; default 50.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: cursor
          in: query
          description: nextCursor from the previous page.
          schema: { type: string }
        - name: direction
          in: query
          description: Only transfers in or out of the wallet; absent for both. Another value is 422.
          schema: { type: string, enum: [in, out] }
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: One page; an empty list for a new profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transactions" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/profiles/{profileId}/balance-history:
    get:
      operationId: getBalanceHistory
      summary: The profile wallet's balance per UTC day, ending at the current balance
      description: |
        One point per UTC day for the last `days` days, today included, oldest first (R-38). A point's balance is the
        wallet balance at the end of its day (00:00 UTC of the next day); the last point is now and equals the wallet
        balance from /balances, read at the second RPC's finalized block. Each earlier balance undoes the recorded
        wallet transfers after it that the current balance includes: not reorged, and at or below that finalized
        block (final). received and sent are the sums of those transfers in and out during the point's day; today's
        has no end, so it holds every such transfer since 00:00 UTC. Money that moves without a Transfer log of the
        token (an Arc native-coin send, fees paid in the token) is not undone, so earlier balances can be off by it;
        a balance that would go below 0 shows 0.
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - name: days
          in: query
          description: Days to cover, today included; default 30.
          schema: { type: integer, minimum: 1, maximum: 365 }
      responses:
        "200":
          description: The history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceHistory" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/invoices/{invoiceId}:
    get:
      operationId: getInvoice
      summary: Read an invoice's terms and statuses
      description: |
        Public, so checkout can show the invoice and recompute the receive address from the terms. Anyone with the id
        can read it, so it leaves out the client's name, email and address; the payer sees the number, title, note, due
        and supply dates, reference, line items, agreed value, sender name and issuer (who bills them).
      security: []
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InvoiceId" }
      responses:
        "200":
          description: The invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invoice" }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/invoices/{invoiceId}/payer-email:
    put:
      operationId: putPayerEmail
      summary: Email me the receipt (public, like the checkout)
      description: |
        R-82, D-68. The payer's address for this invoice's receipt only, never used for anything else and deleted with
        the invoice. It can change until the receipt is sent; an invoice already paid queues its receipt now, otherwise
        it goes once paid. Limited per invoice and for everyone together; per IP at the edge (Q-8).
      security: []
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InvoiceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        "200":
          description: The address as kept (trimmed, lowercase)
          content:
            application/json:
              schema:
                type: object
                required: [email]
                properties:
                  email: { type: string }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "409": { $ref: "#/components/responses/ReceiptSent" }
        "422": { $ref: "#/components/responses/InvalidValue" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/invoices/{invoiceId}/recheck:
    post:
      operationId: recheckInvoice
      summary: Check an invoice on chain again (Check status)
      description: |
        Public like GET /v1/invoices/{invoiceId}: the payer presses Check status (R-55, D-77). Reads the receive
        address's token balance at the chain's finalized block and compares it with the recorded transfers. When more
        is on chain, the worker rescans the address from the invoice's creation block in bounded steps and books what
        it finds. Never signs. One check per invoice every 5 minutes across api replicas; a per-process limit bounds the
        RPC reads; per-IP limits belong to the edge (Q-8).
      security: []
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InvoiceId" }
      responses:
        "200":
          description: What the check found
          content:
            application/json:
              schema:
                type: object
                required: [onChain, recorded, rescanning, nextCheckAt, unreadable]
                properties:
                  onChain:
                    allOf: [{ $ref: "#/components/schemas/Uint256" }]
                    description: The receive address's balance at the chain's finalized block, in base units.
                  recorded:
                    allOf: [{ $ref: "#/components/schemas/Uint256" }]
                    description: The sum of the recorded transfers to it that are not reorged.
                  rescanning:
                    type: boolean
                    description: The worker is rescanning the address for the difference.
                  nextCheckAt: { type: string, format: date-time }
                  unreadable:
                    type: array
                    description: |
                      Chain ids of options whose network did not answer; the other options were still checked. 503
                      only when none answered.
                    items: { type: integer }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: The chain's RPC could not be read (network_unavailable); try again shortly.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/invoices/{invoiceId}/invoice.pdf:
    get:
      operationId: getInvoicePdf
      summary: Download the invoice as a PDF
      description: |
        Public like GET /v1/invoices/{invoiceId} (R-47, R-61, D-51). Built on the server from the stored invoice only:
        the Forwend mark, number, reference, issuer (left out when the profile had no billing details), bill-to with the
        client's name and address (never the email), created time, supply date, due date, checkout expiry, a line with
        the title, network and amount with the token's symbol (or one per line item, with the title above them), the
        agreed value under the total, note, the pay link with its QR code and the invoice id. The same invoice always
        gives the same bytes.
      security: []
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InvoiceId" }
      responses:
        "200": { $ref: "#/components/responses/Pdf" }
        "304": { description: The If-None-Match ETag still matches }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/invoices/{invoiceId}/receipt.pdf:
    get:
      operationId: getReceiptPdf
      summary: Download the receipt of a paid invoice as a PDF
      description: |
        Public like the invoice PDF. 409 until paymentStatus is paid; a paid invoice stays paid, also once settled.
        Shows the invoice's parties, reference, supply date, line or line items and agreed value, the paid time (block
        time of the deposit that completed the amount), each confirmed deposit made before the checkout closed with its
        full tx hash and a link to the network's explorer, and the pay link with its QR code to check the receipt, since
        a PDF can be edited. It says nothing about the settlement: the payer only needs to know they paid; moving the
        money to the creator is the creator's business (R-61, R-68).
      security: []
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/InvoiceId" }
      responses:
        "200": { $ref: "#/components/responses/Pdf" }
        "304": { description: The If-None-Match ETag still matches }
        "404": { $ref: "#/components/responses/InvoiceNotFound" }
        "409": { $ref: "#/components/responses/InvoiceNotPaid" }
        "500": { $ref: "#/components/responses/Internal" }
components:
  securitySchemes:
    privyAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Privy access token (ES256, issuer privy.io, audience = app ID), verified locally.
  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      description: A profile the signed-in user owns; any other value is 403.
      schema: { type: string, format: uuid }
    ClientId:
      name: clientId
      in: path
      required: true
      description: A saved client of this profile; a client of another profile is 404.
      schema: { type: string, format: uuid }
    StatusFilter:
      name: status
      in: query
      description: |
        Only invoices under this filter; absent for all. settled once settlementStatus is settled; otherwise by
        paymentStatus: paid; canceled; expired, expired_partially_paid or closed (see Invoice.closed) is expired; any
        other open, detected or partially_paid is open.
        Another value is 422.
      schema: { type: string, enum: [open, paid, settled, expired, canceled] }
    Search:
      name: q
      in: query
      description: |
        Search text: 1 to 100 characters after trimming spaces; absent means no search, blank or longer is 422. A field
        matches when it contains the text in any letter case. Text that is a decimal number (digits, one point,
        thousands commas allowed) also matches an amount equal to it in whole tokens, exactly: "1,250.5" finds
        1250500000 base units of a 6-decimals token, never 1250500001.
      schema: { type: string, minLength: 1, maxLength: 100 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1 to 255 bytes of UTF-8.
      schema: { type: string, minLength: 1, maxLength: 255 }
  schemas:
    InvoiceId:
      type: string
      description: The on-chain invoice id, 32 random bytes.
      pattern: "^0x[0-9a-f]{64}$"
    Address:
      type: string
      pattern: "^0x[0-9a-f]{40}$"
    Uint256:
      type: string
      description: Base units, 1 to 2^256-1.
      pattern: "^[0-9]+$"
    Me:
      type: object
      required: [onboardedAt, profiles]
      properties:
        onboardedAt:
          type: [string, "null"]
          format: date-time
          description: When the user made or skipped the first-run choice; null until then (the app shows it).
        profiles:
          type: array
          items: { $ref: "#/components/schemas/Profile" }
    Profile:
      type: object
      required: [profileId, kind, name, walletAddress, createdAt]
      properties:
        profileId: { type: string, format: uuid }
        kind:
          type: string
          enum: [personal, freelancer, merchant]
        name:
          type: [string, "null"]
          description: null when none was given; always null for the personal profile.
        walletAddress:
          description: The profile's Privy wallet, where settlements pay; null until Privy has made it.
          oneOf:
            - $ref: "#/components/schemas/Address"
            - type: "null"
        createdAt: { type: string, format: date-time }
    OnboardingRequest:
      type: object
      additionalProperties: false
      required: [choices]
      properties:
        choices:
          type: array
          description: Any number, repeats allowed; empty means Skip.
          items:
            type: string
            enum: [receive_and_send, get_paid_by_clients, accept_business_payments, build_integration]
    CreateProfileRequest:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [freelancer, merchant]
        name:
          type: string
          maxLength: 64
          description: Optional; empty means none. At most 64 characters.
    BillingDetailsRequest:
      type: object
      additionalProperties: false
      required: [name, address, country, email]
      description: Lengths count characters; no NUL. Only taxId is optional; empty means none.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        address:
          type: string
          minLength: 1
          maxLength: 500
          description: Postal address; may have line breaks.
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          description: An assigned ISO 3166-1 alpha-2 code in upper case, like DE.
        taxId: { type: string, maxLength: 50 }
        email:
          type: string
          minLength: 1
          maxLength: 254
          description: A plain contact address like name@example.com, without a display name.
    ClientRequest:
      type: object
      additionalProperties: false
      required: [name]
      description: Lengths count characters; no NUL. Only name is required; empty means none.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email:
          type: string
          maxLength: 254
          description: The billing email, where invoices go; a plain address like name@example.com.
        address:
          type: string
          maxLength: 500
          description: Postal address; may have line breaks.
        country:
          type: string
          pattern: "^([A-Z]{2})?$"
          description: An assigned ISO 3166-1 alpha-2 code in upper case, like DE.
        taxId: { type: string, maxLength: 50, description: The client's tax or VAT ID. }
        reference:
          type: string
          maxLength: 100
          description: |
            The client's PO number or reference that New invoice fills in (R-90); one line. Each invoice keeps its own.
    Client:
      type: object
      required: [clientId, name, email, address, country, taxId, reference, updatedAt]
      description: A saved client; a field it doesn't have is null.
      properties:
        clientId: { type: string, format: uuid }
        name: { type: string }
        email: { type: [string, "null"] }
        address: { type: [string, "null"] }
        country: { type: [string, "null"], pattern: "^[A-Z]{2}$" }
        taxId: { type: [string, "null"] }
        reference: { type: [string, "null"] }
        updatedAt: { type: string, format: date-time }
    Issuer:
      type: object
      required: [name, address, country, taxId, email]
      description: Billing details; taxId is null when none was given.
      properties:
        name: { type: string }
        address: { type: string }
        country: { type: string, pattern: "^[A-Z]{2}$" }
        taxId: { type: [string, "null"] }
        email: { type: string }
    InvoiceEvent:
      type: object
      required: [id, kind, invoiceId, number, chainId, token, symbol, decimals, amount, at]
      properties:
        id: { type: integer }
        kind:
          type: string
          enum: [invoice.paid, invoice.settled, invoice.held]
          description: The payer's receipt (invoice.receipt) is not listed.
        invoiceId: { $ref: "#/components/schemas/InvoiceId" }
        number: { type: integer, minimum: 1 }
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        decimals: { type: integer, minimum: 0 }
        amount:
          allOf: [{ $ref: "#/components/schemas/Uint256" }]
          description: The option's amount; for invoice.held, the amount newly held for the payer.
        at:
          type: string
          format: date-time
    Owed:
      type: object
      required: [kind, invoiceId, number, title, clientName, dueDate, daysLate, optionCount, chainId, token, symbol,
        decimals, amount]
      properties:
        kind:
          type: string
          enum: [overdue, partlyPaid, held]
          description: |
            overdue: the due date is before today's UTC date. partlyPaid: part is in and it is not overdue. held: money
            on this option is held for the payer, not the owner's.
        invoiceId: { $ref: "#/components/schemas/InvoiceId" }
        number: { type: integer, minimum: 1 }
        title: { type: [string, "null"] }
        clientName: { type: [string, "null"] }
        dueDate: { type: [string, "null"], format: date }
        daysLate: { type: integer, minimum: 0, description: Whole UTC days past the due date; 0 unless overdue. }
        optionCount:
          type: integer
          minimum: 1
          description: Above 1 the client chooses the token, so an unpaid row reads in USD at 1 USD per token (D-75).
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        decimals: { type: integer, minimum: 0 }
        amount:
          allOf: [{ $ref: "#/components/schemas/Uint256" }]
          description: |
            overdue and partlyPaid: what is left to pay, the amount less what the ledger booked to the owner. held: the
            held amount on this option.
    Notifications:
      type: object
      required: [email, address]
      properties:
        email:
          type: boolean
          description: On (the default) or off for this profile.
        address:
          type: [string, "null"]
          description: The account's verified login email that the email goes to; null when the account has none.
    BillingDetails:
      allOf:
        - $ref: "#/components/schemas/Issuer"
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: { type: string, format: date-time }
    Balances:
      type: object
      required: [tokens, estimatedUsdTotal]
      properties:
        tokens:
          type: array
          items: { $ref: "#/components/schemas/TokenBalance" }
        estimatedUsdTotal:
          type: [string, "null"]
          description: |
            An estimate, not a quote: the sum of the wallet balances counting each stablecoin as 1 USD, cut (never
            rounded up) to 2 decimals (for example "12.50"). Pending and held are not included. null when any wallet
            balance is missing.
    TokenBalance:
      type: object
      required: [chainId, token, symbol, decimals, wallet, finalizedBlock, pending, held]
      properties:
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        decimals: { type: integer, minimum: 0 }
        wallet:
          description: The profile wallet's balance at finalizedBlock; null when the profile has no wallet yet or the
            chain could not be read.
          oneOf:
            - $ref: "#/components/schemas/Uint256"
            - type: "null"
        finalizedBlock:
          type: [integer, "null"]
          description: The second RPC's finalized block the wallet balance was read at.
        pending:
          type: string
          pattern: "^[0-9]+$"
          description: |
            Not in the wallet yet: deposits to the profile's invoices the ledger has not booked (detected, or final but
            not booked; a late or extra one is later moved to held), plus booked money owed to the creator and not
            settled yet. The wallet balance and our records are read at different moments, so for a short time after a
            settlement the amount can show in both wallet and pending, or briefly in neither.
        held:
          type: string
          pattern: "^[0-9]+$"
          description: Booked money held for payers (late or extra payments); never the creator's.
    Activity:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }
        nextCursor:
          type: [string, "null"]
          description: Pass as cursor for the next page; null on the last page.
    ActivityItem:
      type: object
      required: [kind, at, invoiceId, chainId, token, symbol, decimals, amount, status, optionCount, closed, held]
      properties:
        kind:
          type: string
          enum: [invoice, deposit]
        at:
          type: string
          format: date-time
          description: When the invoice was made or the deposit was seen.
        invoiceId: { $ref: "#/components/schemas/InvoiceId" }
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
        symbol:
          type: string
          description: The token's symbol, also for a token no longer enabled.
        decimals: { type: integer, minimum: 0 }
        amount: { $ref: "#/components/schemas/Uint256" }
        status:
          type: string
          description: An invoice's paymentStatus, or a deposit's status (detected or confirmed). Reorged deposits are
            left out.
        settlementStatus:
          type: string
          enum: [none, pending, settled]
          description: Invoices only.
        txHash:
          type: string
          pattern: "^0x[0-9a-f]{64}$"
          description: A deposit's transaction; for an invoice, its settlementTxHash once there is one.
        optionCount:
          type: integer
          minimum: 1
          description: >-
            The invoice's accepted options; above 1 the client chooses, and the invoice reads in USD rather than the
            token and network given here (its first option). 1 for a deposit.
        closed:
          type: boolean
          description: As Invoice.closed for an invoice; false for a deposit.
        held:
          type: boolean
          description: >-
            A deposit the owner gets none of, held for the payer (D-26): late, on a canceled or final invoice, on an
            invoice that expired partly paid, or on an option the client did not pay with. False for an invoice.
    Transactions:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Transaction" }
        nextCursor:
          type: [string, "null"]
          description: Pass as cursor for the next page; null on the last page.
    Transaction:
      type: object
      required: [chainId, token, symbol, decimals, direction, amount, counterparty, txHash, logIndex, blockNumber, at,
        status]
      properties:
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
        symbol:
          type: string
          description: The token's symbol, also for a token no longer enabled.
        decimals: { type: integer, minimum: 0 }
        direction:
          type: string
          enum: [in, out]
          description: in when the wallet received the tokens, out when it sent them.
        amount: { $ref: "#/components/schemas/Uint256" }
        counterparty:
          allOf: [{ $ref: "#/components/schemas/Address" }]
          description: The sender for in, the receiver for out; the zero address for a mint or a burn.
        txHash: { type: string, pattern: "^0x[0-9a-f]{64}$" }
        logIndex: { type: integer, minimum: 0 }
        blockNumber: { type: integer, minimum: 0 }
        at:
          type: string
          format: date-time
          description: The block's time.
        status:
          type: string
          enum: [detected, confirmed]
          description: confirmed once the block is at or below the chain's finalized block (D-45).
    BalanceHistory:
      type: object
      required: [points, tokens]
      properties:
        points:
          type: array
          description: One per UTC day, oldest first; the last is today, at now.
          items: { $ref: "#/components/schemas/BalanceHistoryPoint" }
        tokens:
          type: array
          description: One per enabled chain and token, as in Balances.
          items: { $ref: "#/components/schemas/TokenHistory" }
    BalanceHistoryPoint:
      type: object
      required: [at, estimatedUsd, receivedUsd, sentUsd]
      properties:
        at:
          type: string
          format: date-time
          description: The end of the point's UTC day (00:00 UTC of the next day); now for the last point.
        estimatedUsd:
          type: [string, "null"]
          description: |
            An estimate, not a quote: the point's balances counting each stablecoin as 1 USD, cut (never rounded up)
            to 2 decimals (for example "12.50"). null when any token's series is null.
        receivedUsd:
          type: [string, "null"]
          description: The point's received amounts, counted like estimatedUsd.
        sentUsd:
          type: [string, "null"]
          description: The point's sent amounts, counted like estimatedUsd.
    TokenHistory:
      type: object
      required: [chainId, token, symbol, decimals, balances, received, sent]
      properties:
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        decimals: { type: integer, minimum: 0 }
        balances:
          type: [array, "null"]
          description: One per point, in base units; the wallet balance at the point's at. null when the current wallet
            balance is missing (no wallet yet, or the chain could not be read); received and sent are then null too.
          items: { type: string, pattern: "^[0-9]+$" }
        received:
          type: [array, "null"]
          description: One per point, in base units; the sum of final transfers into the wallet during the point's day.
          items: { type: string, pattern: "^[0-9]+$" }
        sent:
          type: [array, "null"]
          description: One per point, in base units; the sum of final transfers out of the wallet during the point's day.
          items: { type: string, pattern: "^[0-9]+$" }
    CreateInvoiceRequest:
      type: object
      additionalProperties: false
      description: Either chainId, token and amount (fixed), or amountUsd alone (payer chooses).
      properties:
        lines:
          type: array
          maxItems: 50
          description: |
            Optional line items (R-88) that add up exactly to amount or amountUsd, else 422. unitPrice is in the
            amount's own unit: base units with amount, a USD decimal with amountUsd; each unitPrice and each
            quantity times it must be a whole number of the token's smallest unit. Part of the idempotency hash
            ("7.5" and "7.50" are the same quantity).
          items:
            type: object
            additionalProperties: false
            required: [description, quantity, unitPrice]
            properties:
              description: { type: string, minLength: 1, maxLength: 200 }
              quantity:
                type: string
                pattern: "^[0-9]{1,7}(\\.[0-9]{1,2})?$"
                description: Above 0 and at most 1000000, with up to 2 decimals.
              unitPrice: { type: string }
        amountUsd:
          type: string
          pattern: "^[0-9]{1,60}(\\.[0-9]{1,18})?$"
          description: |
            Payer chooses: the amount in USD, above 0, such as "12.50". 422 when an accepted token's decimals can't
            hold it exactly.
        chainId: { type: integer, minimum: 1, maximum: 9223372036854775807 }
        token:
          type: string
          description: Contract of an enabled token on chainId; any letter case.
          pattern: "^0x[0-9a-fA-F]{40}$"
        amount: { $ref: "#/components/schemas/Uint256" }
        expiresIn:
          type: integer
          description: Seconds until expiry; default 3600.
          minimum: 900
          maximum: 31536000
        title:
          type: string
          maxLength: 200
          description: Optional; empty means none. Lengths here and below count characters; no NUL.
        note:
          type: string
          maxLength: 2000
          description: Optional message to the payer; empty means none.
        dueDate:
          type: string
          format: date
          description: Optional date the client should pay by (YYYY-MM-DD). Shown only; payment closes at expiresAt.
        supplyDate:
          type: string
          format: date
          description: |
            Optional day the work was done or delivered (YYYY-MM-DD, R-89), which EU and UK VAT invoices show when it
            differs from the issue date. Part of the idempotency hash only when set.
        reference:
          type: string
          maxLength: 100
          description: |
            Optional PO number or reference of the client's (R-90), one line; their accounts team matches the invoice
            by it. Part of the idempotency hash only when set.
        agreedValue:
          type: object
          additionalProperties: false
          required: [currency, amount, date]
          description: |
            Optional price agreed with the client in fiat (R-93), typed by the owner (no exchange-rate API). currency
            is EUR or one the ECB publishes a daily reference rate for (D-82): AUD, BRL, CAD, CHF, CNY, CZK, DKK, GBP,
            HKD, HUF, IDR, ILS, INR, ISK, JPY, KRW, MXN, MYR, NOK, NZD, PHP, PLN, RON, SEK, SGD, THB, TRY, USD, ZAR.
            Part of the idempotency hash only when set, in minor units ("1000" and "1000.00" EUR are the same).
          properties:
            currency: { type: string, pattern: "^[A-Z]{3}$" }
            amount:
              type: string
              description: Above 0, at most 12 whole digits and the currency's ISO 4217 decimals (0 for ISK, JPY, KRW).
            date: { type: string, format: date }
        senderName:
          type: string
          maxLength: 100
          description: |
            Optional name the payer sees, for an invoice without billing details such as a personal profile's request
            (D-52); empty means none.
        returnUrl:
          type: string
          maxLength: 2000
          description: |
            Optional https link to the creator's site, offered to the payer once paid (R-58, R-62); empty means none.
            No user or password in it.
        client:
          type: object
          additionalProperties: false
          description: Optional; who the invoice is for. Each empty field means none.
          properties:
            name: { type: string, maxLength: 200 }
            email:
              type: string
              maxLength: 254
              description: A plain address like name@example.com, without a display name.
            address:
              type: string
              maxLength: 500
              description: Postal address; may have line breaks.
            country:
              type: string
              pattern: "^([A-Z]{2})?$"
              description: An assigned ISO 3166-1 alpha-2 code in upper case, like DE.
            taxId: { type: string, maxLength: 50, description: The client's tax or VAT ID; shown on the invoice PDF. }
    Invoices:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InvoiceSummary" }
        nextCursor:
          type: [string, "null"]
          description: Pass as cursor for the next page; null on the last page.
    Invoice:
      description: An invoice read alone or just created, with its deposits.
      allOf:
        - $ref: "#/components/schemas/InvoiceSummary"
        - type: object
          required: [paidAt, settledAt, deposits, options, nextCheckAt, lines]
          properties:
            paidAt:
              type: [string, "null"]
              format: date-time
              description: |
                Once paymentStatus is paid: the block time of the deposit that completed the amount, as on the
                receipt PDF. null before.
            settledAt:
              type: [string, "null"]
              format: date-time
              description: |
                Once settlementStatus is settled: when the settlement was recorded as final (the ledger's settlement
                entry). null before.
            canceledAt:
              type: [string, "null"]
              format: date-time
              description: When the owner canceled it (paymentStatus canceled); null otherwise.
            deposits:
              type: array
              description: |
                Transfers to the receive address (the shown option's) that are not reorged, in chain order. Empty on
                create.
              items: { $ref: "#/components/schemas/Deposit" }
            nextCheckAt:
              type: [string, "null"]
              format: date-time
              description: When Check status may run again (R-55); null when it may now.
            lines:
              type: array
              description: |
                The invoice's line items in order (R-88), empty without a breakdown. Money is in the base units of the
                option whose optionId is the invoiceId; quantity has 2 decimals ("7.50").
              items:
                type: object
                required: [description, quantity, unitPrice, amount]
                properties:
                  description: { type: string }
                  quantity: { type: string }
                  unitPrice: { $ref: "#/components/schemas/Uint256" }
                  amount: { $ref: "#/components/schemas/Uint256" }
            options:
              type: array
              description: |
                Every token and network the invoice accepts, ordered by chain and symbol: one for a fixed invoice. Each
                has its own on-chain id (in its terms instead of invoiceId), amount and receive address; recipient,
                expiresAt and settleDeadline are the invoice's.
              items:
                type: object
                required: [optionId, chainId, network, token, symbol, decimals, amount, receiveAddress, deposits]
                properties:
                  optionId: { $ref: "#/components/schemas/InvoiceId" }
                  chainId: { type: integer }
                  network: { type: string, description: The chain's name, such as base-sepolia. }
                  token: { $ref: "#/components/schemas/Address" }
                  symbol: { type: string }
                  decimals: { type: integer, minimum: 0 }
                  amount: { $ref: "#/components/schemas/Uint256" }
                  receiveAddress: { $ref: "#/components/schemas/Address" }
                  deposits:
                    type: array
                    description: |
                      Transfers to this option's address that are not reorged, in chain order. On an option other than
                      the shown one they are held for the payer (D-76).
                    items: { $ref: "#/components/schemas/Deposit" }
            settlementWait:
              description: |
                Only in the owner's responses (create and the profile's GET); the public GET leaves it out. Why a paid
                invoice's money has not reached the profile wallet yet (R-54); null when it is not paid or already
                settled. signing: the signer settles it on its next round. finalizing: the settle was sent and counts
                once its block is final; secondsLeft estimates the chain time left. retrying: a temporary condition;
                tried again at until. dailyLimit: the user's sponsored settlements for 24 hours are used up; tried
                again at until. refused: the signer refused the terms and an operator looks at it.
              oneOf:
                - type: "null"
                - type: object
                  required: [kind, until, secondsLeft]
                  properties:
                    kind: { type: string, enum: [signing, finalizing, retrying, dailyLimit, refused] }
                    until: { type: [string, "null"], format: date-time }
                    secondsLeft: { type: [integer, "null"], minimum: 0 }
            sends:
              type: array
              description: |
                Only in the owner's responses; the public GET leaves it out. Each Send to client (R-94), oldest first.
                sentAt is when the worker sent the email and failedAt when it gave up; both null while it waits.
              items:
                type: object
                required: [requestedAt, sentAt, failedAt]
                properties:
                  requestedAt: { type: string, format: date-time }
                  sentAt: { type: [string, "null"], format: date-time }
                  failedAt: { type: [string, "null"], format: date-time }
    InvoiceSummary:
      type: object
      required: [invoiceId, optionId, optionLocked, optionCount, confirming, closed, number, title, note, dueDate, supplyDate, reference, agreedValue, senderName, returnUrl, issuer, chainId,
        token, amount, recipient, factory, receiveAddress, expiresAt, settleDeadline, paymentStatus, settlementStatus,
        refundStatus, settlementTxHash, createdAt]
      description: |
        With several options (payer chooses), the terms and statuses are the current option's: the one that received
        money first, else the first listed.
      properties:
        invoiceId:
          allOf: [{ $ref: "#/components/schemas/InvoiceId" }]
          description: The pay link's id. GET with an option's id answers this invoice.
        optionId:
          allOf: [{ $ref: "#/components/schemas/InvoiceId" }]
          description: The on-chain id in the terms below; invoiceId for a fixed invoice.
        optionCount:
          type: integer
          minimum: 1
          description: How many tokens and networks the invoice accepts; 1 for a fixed invoice.
        confirming:
          type: boolean
          description: >-
            A payment made before expiry is seen and not final yet. A partially_paid invoice keeps that status while the
            rest confirms, so show it as confirming.
        closed:
          type: boolean
          description: >-
            The checkout closed and the invoice can no longer be paid: open, detected or partially_paid, past expiresAt,
            with no payment made before expiry still confirming and less than the amount paid before it (money after
            the close reads detected until the chain is final). Its paymentStatus
            changes once the chain is final past expiry; show it as expired (or expired, partially paid) meanwhile.
        optionLocked:
          type: boolean
          description: |
            An option received money, so it is the invoice's for good; money sent to any other option is held for the
            payer (D-76).
        number:
          type: integer
          minimum: 1
          description: |
            The profile's invoice number, from 1 in creation order, never changed. Clients show it as INV- and at
            least 4 digits: 1 is INV-0001.
        title: { type: [string, "null"] }
        note: { type: [string, "null"] }
        dueDate:
          type: [string, "null"]
          format: date
        supplyDate:
          type: [string, "null"]
          format: date
        reference: { type: [string, "null"] }
        agreedValue:
          description: The price agreed with the client in fiat (R-93); null without one.
          oneOf:
            - type: "null"
            - type: object
              required: [currency, amount, decimals, date]
              properties:
                currency: { type: string }
                amount: { type: string, pattern: "^[0-9]+$", description: In the currency's minor units, like cents. }
                decimals: { type: integer, minimum: 0, description: The currency's ISO 4217 decimals. }
                date: { type: string, format: date }
        senderName:
          type: [string, "null"]
          description: The name the payer sees when there is no issuer. In every response, the public GET too.
        returnUrl:
          type: [string, "null"]
          description: The creator's https link for the payer once paid. In every response, the public GET too.
        client:
          type: object
          required: [name, email, address, country, taxId]
          description: Only in the owner's responses (create, list and the profile's GET); the public GET leaves it out.
          properties:
            name: { type: [string, "null"] }
            email: { type: [string, "null"] }
            address: { type: [string, "null"] }
            country: { type: [string, "null"] }
            taxId: { type: [string, "null"] }
        issuer:
          description: |
            The profile's billing details as they were when the invoice was made; null when it had none. Editing the
            details later does not change it. In every response, the public GET too.
          oneOf:
            - $ref: "#/components/schemas/Issuer"
            - type: "null"
        chainId: { type: integer }
        token: { $ref: "#/components/schemas/Address" }
        amount: { $ref: "#/components/schemas/Uint256" }
        recipient:
          allOf: [{ $ref: "#/components/schemas/Address" }]
          description: The profile wallet that settlement pays.
        factory: { $ref: "#/components/schemas/Address" }
        receiveAddress:
          allOf: [{ $ref: "#/components/schemas/Address" }]
          description: Where the payer sends the token; factory.predict of these terms.
        expiresAt: { type: string, format: date-time }
        settleDeadline:
          type: string
          format: date-time
          description: expiresAt + 24 h.
        paymentStatus:
          type: string
          enum: [open, detected, partially_paid, paid, expired, expired_partially_paid, canceled]
        settlementStatus:
          type: string
          enum: [none, pending, settled]
        refundStatus:
          type: string
          enum: [none, held, refund_pending, refunded]
        settlementTxHash:
          type: [string, "null"]
          pattern: "^0x[0-9a-f]{64}$"
          description: |
            The signer's settle transaction once settlementStatus is settled. null before, and when the receiver was
            settled outside the signer (by the refund authority after the deadline).
        createdAt: { type: string, format: date-time }
    Deposit:
      type: object
      required: [txHash, logIndex, from, amount, blockNumber, blockTime, status, late, blocksLeft, blocksTotal, secondsLeft]
      properties:
        txHash: { type: string, pattern: "^0x[0-9a-f]{64}$" }
        logIndex: { type: integer, minimum: 0 }
        from:
          allOf: [{ $ref: "#/components/schemas/Address" }]
          description: The sender of the transfer, from its Transfer log.
        amount: { $ref: "#/components/schemas/Uint256" }
        blockNumber: { type: integer, minimum: 0 }
        blockTime:
          type: string
          format: date-time
          description: The time of the transfer's block, UTC.
        status:
          type: string
          enum: [detected, confirmed]
          description: confirmed once the block is at or below the chain's finalized block (D-45).
        late:
          type: boolean
          description: Block time after expiresAt; held for the payer, never paid to the creator.
        blocksLeft:
          type: integer
          minimum: 0
          description: Blocks until the deposit's block is final; 0 when confirmed.
        blocksTotal:
          type: integer
          minimum: 0
          description: >-
            Blocks the deposit had to wait when first seen, at least blocksLeft; fixed across reads, so blocksTotal -
            blocksLeft is how many passed. 0 when confirmed.
        secondsLeft:
          type: integer
          minimum: 0
          description: Estimated seconds until final, from the chain's finalized block time; 0 when confirmed.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [malformed_request, unauthorized, forbidden, not_signed_up, invoice_not_found,
                billing_details_not_found, billing_details_required, client_not_found, idempotency_conflict, invoice_not_paid,
                invoice_not_cancelable, receipt_sent, client_email_required, invoice_closed, invalid_value, rate_limited,
                network_not_ready, network_unavailable, internal]
            message: { type: string }
  responses:
    MalformedRequest:
      description: Not parseable, unknown field, wrong type, or missing Idempotency-Key (malformed_request)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid access token (unauthorized)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The user does not own the profile, or it does not exist (forbidden)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IdempotencyConflict:
      description: The Idempotency-Key was used with other values (idempotency_conflict)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CreateInvoiceConflict:
      description: |
        The Idempotency-Key was used with other values (idempotency_conflict), or a freelancer or merchant profile has
        no billing details yet (billing_details_required, R-92); a personal profile's request needs none.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidValue:
      description: |
        A value breaks a rule (invalid_value): amount, expiresIn, a token or chain that is not enabled, a profile with
        no wallet for the chain, terms the contract would refuse to settle, an invoice title, note, due or supply date,
        line item, agreed value or client field, a profile kind or name, a billing details field, a list limit, cursor,
        status, direction or search (q), or balance-history days.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotSignedUp:
      description: The user has not called POST /v1/me yet (not_signed_up)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvoiceNotFound:
      description: No invoice with this id (invoice_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ClientNotFound:
      description: The profile has no client with this id (client_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BillingDetailsNotFound:
      description: The profile has not saved billing details yet (billing_details_not_found)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ReceiptSent:
      description: The receipt already went to the address given (receipt_sent)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvoiceNotCancelable:
      description: Money was seen, the checkout closed, or the invoice is no longer open (invoice_not_cancelable)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SendConflict:
      description: |
        The Idempotency-Key was used for another invoice (idempotency_conflict), the invoice has no client email
        (client_email_required), or the payer can no longer pay it: paid, expired, its checkout closed, or canceled
        (invoice_closed).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvoiceNotPaid:
      description: The invoice is not paid, so it has no receipt yet (invoice_not_paid)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Pdf:
      description: The PDF, as a download
      headers:
        Content-Disposition:
          description: attachment; filename="forwend-INV-0001-invoice.pdf" (or -receipt.pdf)
          schema: { type: string }
        ETag:
          description: A hash of the bytes; send it as If-None-Match to get 304 while nothing changed.
          schema: { type: string }
        Cache-Control:
          description: |
            private, no-cache. Revalidate with the ETag. Another deposit before the checkout closes changes the receipt;
            a late deposit (held for the payer) and the settlement do not.
          schema: { type: string }
      content:
        application/pdf:
          schema: { type: string, format: binary }
    NetworkNotReady:
      description: |
        The network is starting (network_not_ready): the worker has not scanned it yet, so a payment made now could be
        missed. Try again in a minute.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: |
        Too many requests (rate_limited): per signed-in user on the routes that need a token, per client IP on the public
        ones (docs/backend/api.md#rate-limits). Wait Retry-After seconds before the next request.
      headers:
        Retry-After:
          description: Whole seconds until the next request is accepted.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: Unexpected error, no details (internal)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

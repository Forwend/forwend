[profile.default]
src = "src"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.30"
# Same bytecode on every chain: the factory address depends on it (C-03).
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
optimizer = true
optimizer_runs = 10_000
# Receive-address vectors shared with the Go backend (script/ReceiveAddressVectors.s.sol).
fs_permissions = [{ access = "read", path = "./deployments.json" }, { access = "read-write", path = "./vectors" }]

[lint]
# Public immutables are part of the ABI (refundAuthority(), implementation(), factory()).
exclude_lints = ["screaming-snake-case-immutable"]

[fuzz]
runs = 1_000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The official image through AWS's public mirror: Docker Hub limits anonymous pulls from shared runners.
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: forwend
          POSTGRES_PASSWORD: forwend
          POSTGRES_DB: forwend
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U forwend" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://forwend:forwend@localhost:55432/forwend?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: pnpm --filter @forwend/web exec playwright install --with-deps chromium
      - name: Repository checks
        run: python3 scripts/harness.py check --ci
        env:
          BASE_SEPOLIA_RPC: https://sepolia.base.org
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

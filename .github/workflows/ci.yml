name: CI

on:
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One job per lane of the check registry (docs/config.json); tests/test_harness.py keeps this list complete.
    strategy:
      fail-fast: false
      matrix:
        lane: [main, unit]
    services:
      postgres:
        # GitHub-hosted runners are exempt from Docker Hub's public-image pull rate limit.
        image: postgres:17
        env:
          POSTGRES_USER: forwend
          POSTGRES_PASSWORD: forwend
          POSTGRES_DB: forwend
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U forwend" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://forwend:forwend@localhost:55432/forwend?sslmode=disable
    steps:
      # Parallel tests open more than Postgres's default 100 connections; a service container takes no start command.
      - name: Raise the Postgres connection limit
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U forwend -c "ALTER SYSTEM SET max_connections = 300"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U forwend; do sleep 1; done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Bun installs the workspace; Node runs Next.js, Playwright and Vitest.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # Both lanes: web e2e in main, and the canary's pay-page check in the Go tests of unit.
      - name: Install Playwright browser
        working-directory: apps/web
        run: bun x --no-install playwright install --with-deps chromium
      - name: Repository checks
        run: python3 scripts/harness.py check --ci --lane ${{ matrix.lane }}
        env:
          BASE_SEPOLIA_RPC: https://sepolia.base.org
      - name: Upload Playwright traces
        if: failure() && matrix.lane == 'main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
      - name: Upload check logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-logs-${{ matrix.lane }}
          path: docs/runs/check-*.log
          retention-days: 7

name: Publish

# PLAN 11.9.4: one package to npm with provenance, started by hand from main. It can't publish until the owner does the
# setup PLAN 11.9.4 lists: a public repository, the npm environment with required reviewers, and NPM_TOKEN stored only
# as that environment's secret. Without the token, no run can publish.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        options: ["@forwend/js", "@forwend/react", "forwend"]

permissions:
  contents: read
  # npm provenance: the package links to this workflow run.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build test --filter="$PACKAGE..."
      - name: Browser package checks
        if: inputs.package != 'forwend'
        run: |
          pnpm --filter @forwend/react-18-check test
          node scripts/check-browser-packages.mjs
      - run: pnpm publish --filter "$PACKAGE" --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

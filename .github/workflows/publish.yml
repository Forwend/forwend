name: Publish

# One package to npm with provenance, started by hand from main. It can't publish until the owner does the setup
# PLAN.md lists: the npm environment with required reviewers, and NPM_TOKEN stored only as that environment's secret.
# Without the token, no run can publish.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        options: ["@forwend/js", "@forwend/react", "forwend"]

permissions:
  contents: read
  # npm provenance: the package links to this workflow run.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun x --no-install turbo run build test --filter="$PACKAGE..."
      - name: Browser package checks
        if: inputs.package != 'forwend'
        run: |
          bun run --cwd packages/react/test/react-18 test
          node scripts/check-browser-packages.mjs
      # bun pm pack writes workspace: ranges as versions; npm then publishes that tarball with provenance.
      - name: Publish
        run: |
          case "$PACKAGE" in
            forwend) dir=packages/node ;;
            @forwend/js) dir=packages/js ;;
            @forwend/react) dir=packages/react ;;
          esac
          tarball=$(cd "$dir" && bun pm pack --destination "$RUNNER_TEMP" --quiet)
          npm publish "$tarball" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

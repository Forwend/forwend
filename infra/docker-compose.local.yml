# Local services for apps/backend. Values come from apps/backend/.env: bun run --cwd apps/backend postgres:up
services:
  postgres:
    image: postgres:17
    # Parallel Go tests and the backend e2e stacks, run side by side, peak near 150 connections; the default is 100.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in apps/backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in apps/backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in apps/backend/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?set in apps/backend/.env}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 3s
      retries: 30
